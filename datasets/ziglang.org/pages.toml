["https://ziglang.org/zh-CN/learn/overview"]
title = "深入了解  ⚡  Zig 编程语言"
full_description = '''← 返回 学习 深入了解 功能特色小巧而简单的语言专注于调试你的应用程序，而不是调试你的编程语言知识。Zig 的完整语法可以被 500 行的 PEG 语法文件所描述。没有隐式控制流，没有隐式内存分配，没有预处理器，也没有宏。如果 Zig 代码看起来不像是在调用一个函数，那么它就不是。这意味着你可以确定下面的代码只会先调用 foo()，然后调用 bar()，不需要知道任何元素的类型，这一点也是可以保证的：var a = b + c.d; foo(); bar(); 隐式控制流的例子：D 有 @property 函数，可以让你的方法调用看起来像是成员访问，因此在上面的例子中，c.d 可能会调用一个函数。C++、D 和 Rust 有运算符重载，因此 + 可能会调用一个函数。C++、D 和 Go 可以抛出和捕获异常，因此 foo() 可能会抛出一个异常，并且将会阻止 bar() 被调用。Zig 将所有的控制流完全用语言关键字和函数调用来表达，以此促进代码的维护性和可读性。性能和安全：全都要Zig 有 4 种构建模式，它们可以从全局到代码作用域的粒度下被任意混合以匹配需求。 参数 Debug ReleaseSafe ReleaseFast ReleaseSmall 优化 - 提升运行速度，降低可调试能力，减慢编译期间 -O3 -O3 -Os 运行时安全检查 - 降低运行速度，增大体积，用崩溃代替未定义行为 On On 以下是编译期整数溢出的例子，无关编译模式选择：1-integer-overflow.zigtest "integer overflow at compile time" { const x: u8 = 255; _ = x + 1; }Shell$ zig test 1-integer-overflow.zig assets/zig-code/features/1-integer-overflow.zig:3:11: error: overflow of integer type 'u8' with value '256' 这是在启用了安全检查的构建中运行时的场景：2-integer-overflow-runtime.zigtest "integer overflow at runtime" { var x: u8 = 255; x += 1; }Shell$ zig test 2-integer-overflow-runtime.zig 1/1 2-integer-overflow-runtime.test.integer overflow at runtime...thread 3030394 panic: integer overflow /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/2-integer-overflow-runtime.zig:3:7: 0x103cc2e in test.integer overflow at runtime (test) x += 1; ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/compiler/test_runner.zig:157:25: 0x1047f99 in mainTerminal (test) if (test_fn.func()) |_| { ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/compiler/test_runner.zig:37:28: 0x103e01b in main (test) return mainTerminal(); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:22: 0x103d159 in posixCallMainAndExit (test) root.main(); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:266:5: 0x103ccc1 in _start (test) asm volatile (switch (native_arch) { ^ ???:?:?: 0x0 in ??? (???) error: the following test command crashed: /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/.zig-cache/o/9e3bfcb661c1ce3251fa44aa9886f390/test 这些堆栈跟踪在所有目标上都可用，包括裸金属（freestanding）。有了 Zig，人们可以依赖启用安全检查的构建模式，并在性能瓶颈处选择性地禁用安全检查。例如前面的例子可以这样修改：3-undefined-behavior.zigtest "actually undefined behavior" { @setRuntimeSafety(false); var x: u8 = 255; x += 1; // XXX undefined behavior! }Zig 将未定义行为作为一个利器，既可以预防 bug，又可以提升性能。说到性能，Zig 比 C 快。参考实现使用 LLVM 作为后端进行最先进的优化。其他项目所谓的“链接时优化”，在 Zig 是自动达成的。多亏了对交叉编译的一流支持，对于原生构建目标，高级 CPU 特性可以被启用（相当于 -march=native）。精心选择的未定义行为。例如，在 Zig 中，有符号和无符号整数在溢出时都属于未定义的行为，而在 C 中仅有有符号整数的溢出属于未定义行为，这有助于实现 C 语言里没有的优化。Zig 直接暴露了 SIMD 向量类型，使得编写跨平台的向量化代码更容易。请注意，Zig 不是一个完全安全的语言。有兴趣关注 Zig 安全故事的用户，可以订阅下面这些链接：列举各种未定义的行为，甚至是无法进行安全检查的行为（英文）使 Debug 和 ReleaseSafe 模式完全安全（英文）Zig 与 C 竞争，而不是依赖于它Zig 标准库里集成了 libc，但是不依赖于它。以下是 Hello World 示例：4-hello.zigconst std = @import("std"); pub fn main() void { std.debug.print("Hello, world!\n", .{}); }Shell$ zig build-exe 4-hello.zig $ ./4-hello Hello, world! 当使用 -O ReleaseSmall 并移除调试符号，单线程模式构建，可以产生一个以 x86_64-linux 为目标的 9.8 KiB 的静态可执行文件：$ zig build-exe hello.zig -O ReleaseSmall -fstrip -fsingle-threaded $ wc -c hello 9944 hello $ ldd hello not a dynamic executable Windows 的构建就更小了，仅仅 4096 字节：$ zig build-exe hello.zig -O ReleaseSmall -fstrip -fsingle-threaded -target x86_64-windows $ wc -c hello.exe 4096 hello.exe $ file hello.exe hello.exe: PE32+ executable (console) x86-64, for MS Windows 顺序无关的顶层声明全局变量等顶层声明与顺序无关，并进行惰性分析。全局变量的初始值在编译时进行求值。5-global-variables.zigvar y: i32 = add(10, x); const x: i32 = add(12, 34); test "global variables" { assert(x == 46); assert(y == 56); } fn add(a: i32, b: i32) i32 { return a + b; } const std = @import("std"); const assert = std.debug.assert;Shell$ zig test 5-global-variables.zig 1/1 5-global-variables.test.global variables...OK All 1 tests passed. 用可选类型代替空指针在其他编程语言中，空引用是许多运行时异常的来源，甚至被指责为计算机科学中最严重的错误。不加修饰的 Zig 指针不可为空：6-null-to-ptr.zigtest "null @intToPtr" { const foo: *i32 = @ptrFromInt(0x0); _ = foo; }Shell$ zig test 6-null-to-ptr.zig assets/zig-code/features/6-null-to-ptr.zig:2:35: error: pointer type '*i32' does not allow address zero 当然，任何类型都可以通过在前面加上 ? 来变成一个可选类型：7-optional-syntax.zigconst std = @import("std"); const assert = std.debug.assert; test "null @intToPtr" { const ptr: ?*i32 = @ptrFromInt(0x0); assert(ptr == null); }Shell$ zig test 7-optional-syntax.zig 1/1 7-optional-syntax.test.null @intToPtr...OK All 1 tests passed. 要解开一个可选的值，可以使用 orelse 来提供一个默认值：8-optional-orelse.zig// malloc prototype included for reference extern fn malloc(size: size_t) ?*u8; fn doAThing() ?*Foo { const ptr = malloc(1234) orelse return null; // ... }另一种选择是使用 if：9-optional-if.zigfn doAThing(optional_foo: ?*Foo) void { // do some stuff if (optional_foo) |foo| { doSomethingWithFoo(foo); } // do some stuff }相同的语法也可以在 while 中使用：10-optional-while.zigconst std = @import("std"); pub fn main() void { const msg = "hello this is dog"; var it = std.mem.tokenize(u8, msg, " "); while (it.next()) |item| { std.debug.print("{s}\n", .{item}); } }Shell$ zig build-exe 10-optional-while.zig $ ./10-optional-while hello this is dog 手动内存管理用 Zig 编写的库可以在任何地方使用：桌面程序低延迟服务器操作系统内核嵌入式设备实时软件，例如现场表演、飞机、心脏起搏器等在浏览器或者其他使用 WebAssembly 作为插件的程序通过 C ABI 给其他语言调用为了达到这个目的，Zig 程序员必须管理自己的内存，必须处理内存分配失败。Zig 标准库也是如此。任何需要分配内存的函数都会接受一个分配器参数。因此，Zig 标准库甚至可以用于裸金属（freestanding）的目标。除了对错误处理的全新诠释，Zig 还提供了 defer 和 errdefer，使所有的资源管理——不仅仅是内存——变得简单且易于验证。关于 defer 的例子，请看无需 FFI/bindings 的 C 库集成。下面是一个使用 errdefer 的例子： 11-errdefer.zigconst Device = struct { name: []u8, fn create(allocator: *Allocator, id: u32) !Device { const device = try allocator.create(Device); errdefer allocator.destroy(device); device.name = try std.fmt.allocPrint(allocator, "Device(id={d})", id); errdefer allocator.free(device.name); if (id == 0) return error.ReservedDeviceId; return device; } };错误处理的全新诠释错误是值，不可忽略：12-errors-as-values.zigconst std = @import("std"); pub fn main() void { _ = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); }Shell$ zig build-exe 12-errors-as-values.zig /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/12-errors-as-values.zig:4:30: error: error union is discarded _ = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); ~~~~~~~~~~~~~~~~~~~~~^~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/12-errors-as-values.zig:4:30: note: consider using 'try', 'catch', or 'if' referenced by: callMain: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:17 callMainWithArgs: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:482:12 remaining reference traces hidden; use '-freference-trace' to see all reference traces 错误可以被 catch 所处理：13-errors-catch.zigconst std = @import("std"); pub fn main() void { const file = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}) catch |err| label: { std.debug.print("unable to open file: {}\n", .{err}); const stderr = std.io.getStdErr(); break :label stderr; }; file.writeAll("all your codebase are belong to us\n") catch return; }Shell$ zig build-exe 13-errors-catch.zig $ ./13-errors-catch unable to open file: error.FileNotFound all your codebase are belong to us 关键词 try 是 catch |err| return err 的简写：14-errors-try.zigconst std = @import("std"); pub fn main() !void { const file = try std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); defer file.close(); try file.writeAll("all your codebase are belong to us\n"); }Shell$ zig build-exe 14-errors-try.zig $ ./14-errors-try error: FileNotFound /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/posix.zig:1768:23: 0x1066a70 in openatZ (14-errors-try) .NOENT => return error.FileNotFound, ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:880:16: 0x1038294 in openFileZ (14-errors-try) const fd = try posix.openatZ(self.fd, sub_path, os_flags, 0); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:827:5: 0x1034d9e in openFile (14-errors-try) return self.openFileZ(&path_c, flags); ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/14-errors-try.zig:4:18: 0x1034be8 in main (14-errors-try) const file = try std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); ^ 请注意这是一个错误返回跟踪，而不是堆栈跟踪。代码没有付出解开堆栈的代价来获得该跟踪。在错误值上使用 switch 关键词可以用于确保所有可能的错误都被处理：15-errors-switch.zigconst std = @import("std"); test "switch on error" { _ = parseInt("hi", 10) catch |err| switch (err) {}; } fn parseInt(buf: []const u8, radix: u8) !u64 { var x: u64 = 0; for (buf) |c| { const digit = try charToDigit(c); if (digit >= radix) { return error.DigitExceedsRadix; } x = try std.math.mul(u64, x, radix); x = try std.math.add(u64, x, digit); } return x; } fn charToDigit(c: u8) !u8 { const value = switch (c) { '0'...'9' => c - '0', 'A'...'Z' => c - 'A' + 10, 'a'...'z' => c - 'a' + 10, else => return error.InvalidCharacter, }; return value; }Shell$ zig build-exe 15-errors-switch.zig /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:509:45: error: root struct of file '15-errors-switch' has no member named 'main' switch (@typeInfo(@typeInfo(@TypeOf(root.main)).Fn.return_type.?)) { ~~~~^~~~~ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/15-errors-switch.zig:1:1: note: struct declared here const std = @import("std"); ^~~~~ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:482:20: note: called from here return callMain(); ~~~~~~~~^~ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:438:36: note: called from here std.posix.exit(callMainWithArgs(argc, argv, envp)); ~~~~~~~~~~~~~~~~^~~~~~~~~~~~~~~~~~ referenced by: _start: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:351:40 remaining reference traces hidden; use '-freference-trace' to see all reference traces 而关键词 unreachable 用于断言不会发生错误：16-unreachable.zigconst std = @import("std"); pub fn main() void { const file = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}) catch unreachable; file.writeAll("all your codebase are belong to us\n") catch unreachable; }Shell$ zig build-exe 16-unreachable.zig $ ./16-unreachable thread 3030318 panic: attempt to unwrap error: FileNotFound /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/posix.zig:1768:23: 0x10699b0 in openatZ (16-unreachable) .NOENT => return error.FileNotFound, ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:880:16: 0x1039a94 in openFileZ (16-unreachable) const fd = try posix.openatZ(self.fd, sub_path, os_flags, 0); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:827:5: 0x103723e in openFile (16-unreachable) return self.openFileZ(&path_c, flags); ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/16-unreachable.zig:4:77: 0x1034fcf in main (16-unreachable) const file = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}) catch unreachable; ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:22: 0x10347d9 in posixCallMainAndExit (16-unreachable) root.main(); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:266:5: 0x1034341 in _start (16-unreachable) asm volatile (switch (native_arch) { ^ ???:?:?: 0x0 in ??? (???) (process terminated by signal) 这将会在不安全构建中出现未定义行为，因此请确保只在一定会成功的地方使用。在所有目标上启用堆栈跟踪本页所展示的堆栈跟踪和错误返回跟踪适用于所有一级支持和部分二级支持目标，甚至裸金属（freestanding）目标！此外，标准库能在任何一点捕获堆栈跟踪，然后将其转储为标准错误：17-stack-traces.zigconst std = @import("std"); var address_buffer: [8]usize = undefined; var trace1 = std.builtin.StackTrace{ .instruction_addresses = address_buffer[0..4], .index = 0, }; var trace2 = std.builtin.StackTrace{ .instruction_addresses = address_buffer[4..], .index = 0, }; pub fn main() void { foo(); bar(); std.debug.print("first one:\n", .{}); std.debug.dumpStackTrace(trace1); std.debug.print("\n\nsecond one:\n", .{}); std.debug.dumpStackTrace(trace2); } fn foo() void { std.debug.captureStackTrace(null, &trace1); } fn bar() void { std.debug.captureStackTrace(null, &trace2); }Shell$ zig build-exe 17-stack-traces.zig $ ./17-stack-traces first one: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/debug.zig:365:29: 0x10396e7 in captureStackTrace (17-stack-traces) addr.* = it.next() orelse { ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/17-stack-traces.zig:26:32: 0x103717c in foo (17-stack-traces) std.debug.captureStackTrace(null, &trace1); ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/17-stack-traces.zig:16:8: 0x10350c8 in main (17-stack-traces) foo(); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:22: 0x1034979 in posixCallMainAndExit (17-stack-traces) root.main(); ^ second one: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/debug.zig:365:29: 0x10396e7 in captureStackTrace (17-stack-traces) addr.* = it.next() orelse { ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/17-stack-traces.zig:30:32: 0x103719c in bar (17-stack-traces) std.debug.captureStackTrace(null, &trace2); ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/17-stack-traces.zig:17:8: 0x10350cd in main (17-stack-traces) bar(); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:22: 0x1034979 in posixCallMainAndExit (17-stack-traces) root.main(); ^ 你可以在正在进行的 GeneralPurposeDebugAllocator 项目中看到这种技术的应用。泛型数据结构和函数类型和值必须在编译期已知：18-types.zigconst std = @import("std"); const assert = std.debug.assert; test "types are values" { const T1 = u8; const T2 = bool; assert(T1 != T2); const x: T2 = true; assert(x); }Shell$ zig test 18-types.zig 1/1 18-types.test.types are values...OK All 1 tests passed. 泛型数据结构简单来说就是一个函数返回一个类型：19-generics.zigconst std = @import("std"); fn List(comptime T: type) type { return struct { items: []T, len: usize, }; } pub fn main() void { var buffer: [10]i32 = undefined; var list = List(i32){ .items = &buffer, .len = 0, }; list.items[0] = 1234; list.len += 1; std.debug.print("{d}\n", .{list.items.len}); }Shell$ zig build-exe 19-generics.zig $ ./19-generics 10 编译期反射和编译期代码执行@typeInfo 内置函数可以用于提供编译期反射：20-reflection.zigconst std = @import("std"); const Header = struct { magic: u32, name: []const u8, }; pub fn main() void { printInfoAboutStruct(Header); } fn printInfoAboutStruct(comptime T: type) void { const info = @typeInfo(T); inline for (info.Struct.fields) |field| { std.debug.print( "{s} has a field called {s} with type {s}\n", .{ @typeName(T), field.name, @typeName(field.type), }, ); } }Shell$ zig build-exe 20-reflection.zig $ ./20-reflection 20-reflection.Header has a field called magic with type u32 20-reflection.Header has a field called name with type []const u8 Zig 标准库使用这种技术来实现格式化打印。尽管是一种小巧而简洁的语言，但 Zig 的格式化打印完全是在 Zig 中实现的。同时，在 C 语言中，printf 的编译错误是硬编码到编译器中的。同样，在 Rust 中，格式化打印的宏也是硬编码到编译器中的。Zig 还可以在编译期对函数和代码块求值。在某些情况下，比如全局变量初始化，表达式会在编译期隐式地进行求值。除此之外我们还可以使用 comptime 关键字显式地在编译期求值。把它与断言相结合就可以变得尤为强大了：21-comptime.zigconst std = @import("std"); const assert = std.debug.assert; fn fibonacci(x: u32) u32 { if (x <= 1) return x; return fibonacci(x - 1) + fibonacci(x - 2); } test "compile-time evaluation" { var array: [fibonacci(6)]i32 = undefined; @memset(&array, 42); co'''
