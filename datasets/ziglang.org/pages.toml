["https://ziglang.org/de-DE/learn/build-system"]
title = "Zig Build-System  ⚡  Zig Programmiersprache"
full_description = '''← Zurück zu Lernen Zig Build-System Wann sollte man das Zig-Build-System einsetzen?Erste Schritte Einfaches ausführbares ProgrammInstallation von Build-ArtefaktenHinzufügen eines Komfortschritts zur Ausführung der AnwendungGrundlagen BenutzeroptionenStandard-KonfigurationsoptionenOptionen zur bedingten KompilierungStatische BibliothekDynamische BibliothekTestenSystem-Bibliotheken verlinkenDateien erzeugen Systemwerkzeuge ausführenProjektwerkzeuge ausführenErzeugen von Assets für @embedFileErzeugen von Zig-QuellcodeUmgang mit einer oder mehreren erzeugten DateienQuelldateien verändernPraktische Beispiele Build für mehrere Ziele, um eine Freigabe zu erstellen Wann sollte man das Zig-Build-System einsetzen?Die grundlegenden Befehle zig build-exe, zig build-lib, zig build-obj, und zig test sind oftmals ausreichend. Manchmal benötigt man jedoch eine weitere Abstaktionsebene, um komplexere Kompilationen durchzuführen.Wenn beispielsweise eine dieser Situationen zutrifft:Die Kommandozeile wird zu lang und unhandlich, und du möchtest sie aufschreiben.Du willst viele Dinge bauen, oder der Build-Prozess umfasst viele Schritte.Du möchten die Vorteile der Parallelverarbeitung und des Cachings nutzen, um die Erstellungszeit zu verkürzen.Du möchtest Konfigurationsoptionen für das Projekt freigeben.Der Build-Prozess ist je nach Zielsystem und anderen Optionen unterschiedlich.Du hast Abhängigkeiten zu anderen Projekten.Du möchtest unnötige Abhängigkeiten zu 'cmake', 'make', 'shell', 'msvc', 'python', etc. vermeiden und/oder das Projekt mehr Mitwirkenden zugänglich machen.Du möchtest ein Paket anbieten, das auch von Dritten genutzt werden kann.Du möchtest einen standardisierten Weg für Werkzeuge wie IDEs bieten, damit diese semantisch verstehen, wie das Projekt zu bauen ist.Wenn einer dieser Punkte zutrifft, wird das Projekt von der Verwendung des Zig-Build-Systems profitieren.Erste SchritteEinfaches ausführbares ProgrammDieses Build-Skript erzeugt ein ausführbares Programm aus einer Zig-Datei, mit einer von außen aufrufbaren Funktion.hello.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("hello.zig"), .target = b.host, }); b.installArtifact(exe); }Shell$ zig build--summary all Build Summary: 3/3 steps succeeded install cached └─ install hello cached └─ zig build-exe hello Debug native cached 66ms MaxRSS:36M Installation von Build-ArtefaktenDas Zig-Build-System basiert, wie die meisten Build-Systeme, auf der Modellierung des Projekts als gerichteter azyklischer Graph (DAG) von Schritten, die unabhängig und gleichzeitig ausgeführt werden.Standardmäßig ist der Hauptschritt im Graph der Schritt Install, dessen Zweck es ist, Build-Artefakte an ihren endgültigen Platz zu kopieren. Der Install-Schritt startet ohne Abhängigkeiten, und daher wird nichts passieren, wenn zig build ausgeführt wird. Das Build-Skript eines Projekts muss den zu installierenden Dingen etwas hinzufügen, was der obige Aufruf der Funktion installArtifact macht.Ausgabe├── build.zig ├── hello.zig ├── .zig-cache └── zig-out └── bin └── hello In der Ausgabe sind zwei Verzeichnisse enthalten: .zig-cache und zig-out. Das erste enthält Dateien, die nachfolgende Builds schneller machen, aber diese Dateien sind nicht dafür gedacht, in eine Versionskontrolle eingecheckt zu werden. Dieses Verzeichnis kann auch jederzeit ohne Konsequenzen vollständig gelöscht werden.Das zweite, zig-out, ist ein „Installationspräfix“. Dies entspricht dem Standardkonzept der Dateisystemhierarchie. Dieses Verzeichnis wird nicht vom Projekt bestimmt, sondern vom Benutzer von zig build mittels dem --prefix-Flag (kurz -p).Als Projektbetreuer wählst du aus, was in dieses Verzeichnis gelegt wird, aber der Benutzer wählt aus, wo er es in seinem System installieren möchte. Das Build-Skript kann die Ausgabepfade nicht fest kodieren, da dies die Zwischenspeicherung, die Gleichzeitigkeit und die Kompatibilität beeinträchtigen und den Endbenutzer verärgern würde.Hinzufügen eines Komfortschritts zur Ausführung der AnwendungEs ist üblich einen Run-Schritt hinzuzufügen, um eine Möglichkeit zu schaffen, die eigene Hauptanwendung direkt aus dem Build-Befehl zu starten (zig build run).hello.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("hello.zig"), .target = b.host, }); b.installArtifact(exe); const run_exe = b.addRunArtifact(exe); const run_step = b.step("run", "Run the application"); run_step.dependOn(&run_exe.step); }Shell$ zig buildrun --summary all Hello World! Build Summary: 3/3 steps succeeded run success └─ run hello success 14ms MaxRSS:1M └─ zig build-exe hello Debug native cached 44ms MaxRSS:36M GrundlagenBenutzeroptionenVerwende b.option, um das Build-Skript sowohl für Benutzer konfigurierbar zu machen, als auch für andere Projekte, die von dem Projekt als Paket abhängen.build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const windows = b.option(bool, "windows", "Target Microsoft Windows") orelse false; const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("example.zig"), .target = b.resolveTargetQuery(.{ .os_tag = if (windows) .windows else null, }), }); b.installArtifact(exe); }Shell$ zig build--help Usage: /home/ci/deps/zig-linux-x86_64-0.13.0/zig build [steps] [options] Steps: install (default) Copy build artifacts to prefix path uninstall Remove build artifacts from prefix path General Options: -p, --prefix [path] Where to install files (default: zig-out) --prefix-lib-dir [path] Where to install libraries --prefix-exe-dir [path] Where to install executables --prefix-include-dir [path] Where to install C header files --release[=mode] Request release mode, optionally specifying a preferred optimization mode: fast, safe, small -fdarling, -fno-darling Integration with system-installed Darling to execute macOS programs on Linux hosts (default: no) -fqemu, -fno-qemu Integration with system-installed QEMU to execute foreign-architecture programs on Linux hosts (default: no) --glibc-runtimes [path] Enhances QEMU integration by providing glibc built for multiple foreign architectures, allowing execution of non-native programs that link with glibc. -frosetta, -fno-rosetta Rely on Rosetta to execute x86_64 programs on ARM64 macOS hosts. (default: no) -fwasmtime, -fno-wasmtime Integration with system-installed wasmtime to execute WASI binaries. (default: no) -fwine, -fno-wine Integration with system-installed Wine to execute Windows programs on Linux hosts. (default: no) -h, --help Print this help and exit -l, --list-steps Print available steps --verbose Print commands before executing them --color [auto|off|on] Enable or disable colored error messages --prominent-compile-errors Buffer compile errors and display at end --summary [mode] Control the printing of the build summary all Print the build summary in its entirety new Omit cached steps failures (Default) Only print failed steps none Do not print the build summary -j<N> Limit concurrent jobs (default is to use all CPU cores) --maxrss <bytes> Limit memory usage (default is to use available memory) --skip-oom-steps Instead of failing, skip steps that would exceed --maxrss --fetch Exit after fetching dependency tree Project-Specific Options: -Dwindows=[bool] Target Microsoft Windows System Integration Options: --search-prefix [path] Add a path to look for binaries, libraries, headers --sysroot [path] Set the system root directory (usually /) --libc [file] Provide a file which specifies libc paths --system [pkgdir] Disable package fetching; enable all integrations -fsys=[name] Enable a system integration -fno-sys=[name] Disable a system integration Available System Integrations: Enabled: (none) - Advanced Options: -freference-trace[=num] How many lines of reference trace should be shown per compile error -fno-reference-trace Disable reference trace --build-file [file] Override path to build.zig --cache-dir [path] Override path to local Zig cache directory --global-cache-dir [path] Override path to global Zig cache directory --zig-lib-dir [arg] Override path to Zig lib directory --build-runner [file] Override path to build runner --seed [integer] For shuffling dependency traversal order (default: random) --debug-log [scope] Enable debugging the compiler --debug-pkg-config Fail if unknown pkg-config flags encountered --verbose-link Enable compiler debug output for linking --verbose-air Enable compiler debug output for Zig AIR --verbose-llvm-ir[=file] Enable compiler debug output for LLVM IR --verbose-llvm-bc=[file] Enable compiler debug output for LLVM BC --verbose-cimport Enable compiler debug output for C imports --verbose-cc Enable compiler debug output for C compilation --verbose-llvm-cpu-features Enable compiler debug output for LLVM CPU features example.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); }Beachte bitte diese Zeilen:Project-Specific Options: -Dwindows=[bool] Target Microsoft Windows Dieser Teil des Hilfemenüs wird automatisch erzeugt, wenn die Logik von build.zig ausgeführt wird. Benutzer können auf diese Weise Konfigurationsoptionen des Build-Skripts erkunden.Standard-KonfigurationsoptionenBisher haben wir ein boolesches Flag verwendet, um die Erstellung für Windows anzuzeigen. Das können wir jedoch besser machen.Die meisten Projekte möchten die Möglichkeit bieten, die Ziel- und Optimierungseinstellungen zu ändern. Um Standard-Namenskonventionen für diese Optionen zu fördern, bietet Zig die Hilfsfunktionen standardTargetOptions und standardOptimizeOption.Mit den Standard-Zieloptionen kann die Person, die zig build ausführt, wählen, für welches Ziel (Betriebssystem/Platform) gebaut werden soll. Standardmäßig ist jedes Ziel erlaubt. Keine Auswahl bedeutet, dass als Ziel das Host-System automatisch gewählt wird. Weitere Optionen zur Einschränkung der unterstützten Zielsysteme sind ebenfalls verfügbar.Die Standard-Optimierungsoptionen erlauben es der Person, die zig build ausführt, zwischen Debug, ReleaseSafe, ReleaseFast und ReleaseSmall zu wählen. Standardmäßig wird keine der Release-Optionen vom Build-Skript als bevorzugte Option angesehen, und der Benutzer muss eine Entscheidung treffen, um einen Release-Build zu erstellen.hello.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const target = b.standardTargetOptions(.{}); const optimize = b.standardOptimizeOption(.{}); const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("hello.zig"), .target = target, .optimize = optimize, }); b.installArtifact(exe); }Shell$ zig build-Dtarget=x86_64-windows -Doptimize=ReleaseSmall --summary all Build Summary: 3/3 steps succeeded install cached └─ install hello cached └─ zig build-exe hello ReleaseSmall x86_64-windows cached 44ms MaxRSS:36M Jetzt enthält unser --help-Menü zusätzliche Einträge:Project-Specific Options: -Dtarget=[string] The CPU architecture, OS, and ABI to build for -Dcpu=[string] Target CPU features to add or subtract -Doptimize=[enum] Prioritize performance, safety, or binary size (-O flag) Supported Values: Debug ReleaseSafe ReleaseFast ReleaseSmall Es ist durchaus möglich, diese Optionen direkt über b.option zu erstellen, aber diese API bietet eine allgemein gebräuchliche Namenskonvention für häufig verwendete Einstellungen.In unserer Terminalausgabe siehst du, dass wir -Dtarget=x86_64-windows -Doptimize=ReleaseSmall übergeben haben. Im Vergleich zum ersten Beispiel sehen wir jetzt andere Dateien im Installationspräfix:zig-out/ └── bin └── hello.exe Optionen zur bedingten KompilierungUm Optionen aus dem Build-Skript in den Zig-Code des Projekts zu übertragen, verwenden wir den Schritt Options.app.zigconst std = @import("std"); const config = @import("config"); const semver = std.SemanticVersion.parse(config.version) catch unreachable; extern fn foo_bar() void; pub fn main() !void { if (semver.major < 1) { @compileError("too old"); } std.debug.print("version: {s}\n", .{config.version}); if (config.have_libfoo) { foo_bar(); } } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const exe = b.addExecutable(.{ .name = "app", .root_source_file = b.path("app.zig"), .target = b.host, }); const version = b.option([]const u8, "version", "application version string") orelse "0.0.0"; const enable_foo = detectWhetherToEnableLibFoo(); const options = b.addOptions(); options.addOption([]const u8, "version", version); options.addOption(bool, "have_libfoo", enable_foo); exe.root_module.addOptions("config", options); b.installArtifact(exe); } fn detectWhetherToEnableLibFoo() bool { return false; }Shell$ zig build-Dversion=1.2.3 --summary all Build Summary: 4/4 steps succeeded install cached └─ install app cached └─ zig build-exe app Debug native cached 33ms MaxRSS:36M └─ options cached In diesem Beispiel sind die Daten, die von @import("config") bereitgestellt werden zur Kompilierzeit bekannt (comptime-known), was verhindert, dass der @compileError ausgelöst wird. Wenn wir -Dversion=0.2.3 übergeben hätten, oder die Option weggelassen, dann wäre die Kompilierung von 'app.zig' mit dem Fehler "zu alt" fehlschlagen.Statische BibliothekDieses Build-Skript erstellt eine statische Bibliothek aus Zig-Code und dann auch eine ausführbare Datei aus anderem Zig-Code, der diese Bibliothek verwendet.fizzbuzz.zigexport fn fizzbuzz(n: usize) ?[*:0]const u8 { if (n % 5 == 0) { if (n % 3 == 0) { return "fizzbuzz"; } else { return "fizz"; } } else if (n % 3 == 0) { return "buzz"; } return null; } demo.zigconst std = @import("std"); extern fn fizzbuzz(n: usize) ?[*:0]const u8; pub fn main() !void { const stdout = std.io.getStdOut(); var bw = std.io.bufferedWriter(stdout.writer()); const w = bw.writer(); for (0..100) |n| { if (fizzbuzz(n)) |s| { try w.print("{s}\n", .{s}); } else { try w.print("{d}\n", .{n}); } } try bw.flush(); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const target = b.standardTargetOptions(.{}); const optimize = b.standardOptimizeOption(.{}); const libfizzbuzz = b.addStaticLibrary(.{ .name = "fizzbuzz", .root_source_file = b.path("fizzbuzz.zig"), .target = target, .optimize = optimize, }); const exe = b.addExecutable(.{ .name = "demo", .root_source_file = b.path("demo.zig"), .target = target, .optimize = optimize, }); exe.linkLibrary(libfizzbuzz); b.installArtifact(libfizzbuzz); if (b.option(bool, "enable-demo", "install the demo too") orelse false) { b.installArtifact(exe); } }Shell$ zig build--summary all Build Summary: 3/3 steps succeeded install cached └─ install fizzbuzz cached └─ zig build-lib'''
