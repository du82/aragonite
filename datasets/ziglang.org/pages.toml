["https://ziglang.org/ru-RU/zsf"]
title = "Zig Software Foundation  ⚡  Язык программирования Zig"
full_description = '''← Вернуться обратно на Главная Zig Software Foundation Спонсирование Zig Software FoundationПожалуйста, рассмотрите возможность регулярного пожертвования. Поддержка и развитие качественного программного обеспечения требуют постоянной работы! Пожертвовать function zsfCreateWidget() { everyDotOrgDonateButton.createButton({ selector: "#zsf-every-donate-btn", nonprofitSlug: "zig-software-foundation-inc", fontSize: "32px", label: "Спонсировать" }); everyDotOrgDonateButton.createWidget({ selector: "#zsf-every-donate-btn", nonprofitSlug: "zig-software-foundation-inc", defaultDonationAmount: 10, defaultFrequency: 'monthly' }); // Workaround for https://github.com/everydotorg/donate-button/issues/384 let style = document.createElement('style'); style.innerHTML = '#donation-input { color: black; } #privateNote { color: black }'; document.getElementById("shadow-wrapper").shadowRoot.appendChild(style); } if (window.everyDotOrgDonateButton) { zsfCreateWidget(); } else { document.getElementById("every-donate-btn-js").addEventListener('load', zsfCreateWidget); } МиссияМиссия Zig Software Foundation (ZSF) заключается в продвижении, защите и развитии языка программирования Zig, поддержке и укреплении международного сообщества Zig-программистов, а также в предоставлении образовательных и наставнических программ для студентов с целью формирования следующего поколения компетентных и требовательных друг к другу программистов.ZSF является некоммерческой корпорацией 501(c)(3). Финансовые отчёты, протоколы заседаний и другие детали общедоступны.Члены советаЭндрю Келли (Президент)Джош Вулф (Секретарь)Мейсон Ремали (Казначей)СпонсорствоЖертвуя ZSF, вы финансируете развитие языка программирования Zig и его экосистемы, что, в свою очередь, приносит пользу более широкому сообществу свободного программного обеспечения за пределами ZSF. Участники сообщества Zig внесли ряд исправлений в LLVM, Wine, QEMU, musl libc, GDB и другие проекты.ZSF — небольшая организация, которая эффективно распоряжается своими финансовыми ресурсами. Мы намерены сохранить её такой, и при этом стремимся превратить наших волонтёров в оплачиваемых мейнтейнеров, чтобы помочь со слиянием пулл-реквествов и ускорить продвижение к версии 1.0. Наша цель как некоммерческой организации — приносить пользу людям, поэтому мы считаем важным вознаграждать мейнтейнеров за их труд.Информация о пожертвованияхНиже приведена важная информация для тех, кто предпочитает делать пожертвования не через GitHub Sponsors. Рекомендуем также ознакомиться с вашим местным законодательством, чтобы узнать, можно ли вычитать пожертвования из ваших налогов.EIN84-5105214АдресZig Software Foundation 1632 1st Ave #21385New York, NY 10028Другие доступные способы пожертвованийEveryGitHub SponsorsBenevity (рекомендуется, если ваш работодатель предлагает программу софинансирования!)Банковские переводы (включая из-за пределов США — можете связаться с нами для получения дополнительной информации)Физические чеки (см. адрес для отправки выше)WiseПожалуйста, не стесняйтесь обращаться к нам по адресу donations@ziglang.org, если у вас есть вопросы или особые пожелания.Корпоративные спонсорыДенежные пожертвованияСледующие компании оказывают прямую финансовую поддержку Zig Software Foundation, жертвуя более $1000 в месяц. @media (prefers-color-scheme:light) { #zml { filter: invert(); } }'''
