title = "Übersicht  ⚡  Zig Programmiersprache"
full_description = '''← Zurück zu Lernen Übersicht FunktionshighlightsKleine, einfache SpracheDer Fokus liegt darauf die Anwendung zu debuggen, anstatt seine Kenntnisse der Programmiersprache zu debuggen.Die gesamte Syntax von Zig wird mit einer 580-zeiligen PEG-Grammatikdatei angegeben.Es gibt keinen versteckten Kontrollfluss, keine versteckten Speicherzuweisungen, keinen Präprozessor und keine Makros. Wenn es nicht so aussieht, als würde der Zig-Code verzweigen, um eine Funktion aufzurufen, dann tut er das auch nicht. Das bedeutet, dass man sicher sein kann, dass der folgende Code nur foo() und dann bar() aufruft, und das ist garantiert, ohne dass man die Typen von irgendetwas kennen müsste:var a = b + c.d; foo(); bar(); Beispiele versteckten Kontrollflusses:D hat @property-Funktionen, das sind Methoden, die man mit etwas aufruft, das wie ein Feldzugriff aussieht, im obigen Beispiel könnte also c.d eine Funktion aufrufen.C++, D und Rust haben Operatorüberladung, so dass der Operator „+“ eine Funktion aufrufen kann.C++, D und Go haben 'throw/catch'-Ausnahmen, also könnte foo() eine Ausnahme auslösen und verhindern, dass bar() aufgerufen wird.Zig fördert die Code-Wartung und Lesbarkeit, indem der gesamte Kontrollfluss ausschließlich mit Sprachschlüsselwörtern und Funktionsaufrufen verwaltet wird.Leistung und Sicherheit: Wähle zweiZig hat vier Build-Modi, und sie können alle bis zur Granularität des Geltungsbereichs gemischt und angepasst werden. Parameter Debug ReleaseSafe ReleaseFast ReleaseSmall Optimierungen – verbessern die Geschwindigkeit, beeinträchtigen das Debugging, beeinträchtigen die Kompilierzeit -O3 -O3 -Os Laufzeitsicherheitsprüfungen – beeinträchtigen die Geschwindigkeit, beeinträchtigen die Größe, führen zu Abstürzen statt undefiniertem Verhalten On On So sieht Integerüberlauf zur Kompilierungszeit aus, unabhängig vom Build-Modus:1-integer-overflow.zigtest "integer overflow at compile time" { const x: u8 = 255; _ = x + 1; }Shell$ zig test 1-integer-overflow.zig assets/zig-code/features/1-integer-overflow.zig:3:11: error: overflow of integer type 'u8' with value '256' So sieht es zur Laufzeit in sicherheitsgeprüften Builds aus:2-integer-overflow-runtime.zigtest "integer overflow at runtime" { var x: u8 = 255; x += 1; }Shell$ zig test 2-integer-overflow-runtime.zig 1/1 2-integer-overflow-runtime.test.integer overflow at runtime...thread 3030394 panic: integer overflow /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/2-integer-overflow-runtime.zig:3:7: 0x103cc2e in test.integer overflow at runtime (test) x += 1; ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/compiler/test_runner.zig:157:25: 0x1047f99 in mainTerminal (test) if (test_fn.func()) |_| { ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/compiler/test_runner.zig:37:28: 0x103e01b in main (test) return mainTerminal(); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:22: 0x103d159 in posixCallMainAndExit (test) root.main(); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:266:5: 0x103ccc1 in _start (test) asm volatile (switch (native_arch) { ^ ???:?:?: 0x0 in ??? (???) error: the following test command crashed: /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/.zig-cache/o/9e3bfcb661c1ce3251fa44aa9886f390/test Diese Stacktraces funktionieren auf allen Zielplatformen, einschließlich freistehender Systeme.Mit Zig kann man sich auf einen sicherheitsaktivierten Build-Modus verlassen und die Sicherheit an Leistungsengpässen selektiv deaktivieren. Das vorherige Beispiel könnte beispielsweise wie folgt geändert werden:3-undefined-behavior.zigtest "actually undefined behavior" { @setRuntimeSafety(false); var x: u8 = 255; x += 1; // XXX undefined behavior! }Zig verwendet undefiniertes Verhalten als messerscharfes Werkzeug sowohl zur Fehlerprävention als auch zur Leistungssteigerung.Apropos Leistung: Zig ist schneller als C.– Die Referenzimplementierung verwendet LLVM als Backend für modernste Optimierungen.Was andere Projekte "Link Time Optimization" nennen, macht Zig automatisch.Für native Ziele sind erweiterte CPU-Funktionen aktiviert (-march=native), dank der Tatsache, dass Cross-Compiling ein erstklassiger Anwendungsfall ist.Sorgfältig ausgewähltes undefiniertes Verhalten. Beispielsweise haben in Zig sowohl vorzeichenbehaftete als auch vorzeichenlose Ganzzahlen ein undefiniertes Verhalten bei Überlauf, im Gegensatz zu ausschließlich vorzeichenbehafteten Ganzzahlen in C. Dies erleichtert Optimierungen, die in C nicht verfügbar sind.Zig stellt direkt einen SIMD-Vektortyp bereit, wodurch das Schreiben von portablem vektorisiertem Code erleichtert wird.Es gilt zu beachten, dass Zig keine völlig sichere Sprache ist. Wer die Sicherheitsgeschichte von Zig verfolgen möchte, kann diese Ausgaben abonnieren:enumerate all kinds of undefined behavior, even that which cannot be safety-checkedmake Debug and ReleaseSafe modes fully safeZig konkurriert mit C, anstatt davon abhängig zu seinDie Zig-Standardbibliothek ist in libc integriert, aber nicht davon abhängig. Hier ist "Hello World":4-hello.zigconst std = @import("std"); pub fn main() void { std.debug.print("Hello, world!\n", .{}); }Shell$ zig build-exe 4-hello.zig $ ./4-hello Hello, world! Bei der Kompilierung mit -O ReleaseSmall, ohne Debugsymbole und im Single-Thread-Modus entsteht eine statische ausführbare Datei mit 9,8 KiB für das Ziel x86_64-linux:$ zig build-exe hello.zig -O ReleaseSmall -fstrip -fsingle-threaded $ wc -c hello 9944 hello $ ldd hello not a dynamic executable Ein Windows-Build ist sogar noch kleiner und umfasst nur 4096 Bytes:$ zig build-exe hello.zig -O ReleaseSmall -fstrip -fsingle-threaded -target x86_64-windows $ wc -c hello.exe 4096 hello.exe $ file hello.exe hello.exe: PE32+ executable (console) x86-64, for MS Windows Reihenfolgeunabhängige Top-Level-DeklarationenDeklarationen auf oberster Ebene wie globale Variablen sind reihenfolgeunabhängig und werden verzögert analysiert. Die Initialisierungswerte globaler Variablen werden zur Kompilierzeit ausgewertet.5-global-variables.zigvar y: i32 = add(10, x); const x: i32 = add(12, 34); test "global variables" { assert(x == 46); assert(y == 56); } fn add(a: i32, b: i32) i32 { return a + b; } const std = @import("std"); const assert = std.debug.assert;Shell$ zig test 5-global-variables.zig 1/1 5-global-variables.test.global variables...OK All 1 tests passed. Optionaler Typ anstelle von NullzeigernIn anderen Programmiersprachen sind Nullzeiger (null pointer) die Quelle vieler Laufzeitausnahmen und werden sogar als der schlimmste Fehler der Informatik bezeichnet.Unmodifizierte Zig-Zeiger können nicht NULL sein:6-null-to-ptr.zigtest "null @intToPtr" { const foo: *i32 = @ptrFromInt(0x0); _ = foo; }Shell$ zig test 6-null-to-ptr.zig assets/zig-code/features/6-null-to-ptr.zig:2:35: error: pointer type '*i32' does not allow address zero Allerdings kann jeder Typ zu einem optionalen Typ gemacht werden, indem man ihm ein ? voranstellt:7-optional-syntax.zigconst std = @import("std"); const assert = std.debug.assert; test "null @intToPtr" { const ptr: ?*i32 = @ptrFromInt(0x0); assert(ptr == null); }Shell$ zig test 7-optional-syntax.zig 1/1 7-optional-syntax.test.null @intToPtr...OK All 1 tests passed. Um auf einen optionalen Wert zuzugreifen, kann man orelse verwenden, um einen Standardwert zu liefern:8-optional-orelse.zig// malloc prototype included for reference extern fn malloc(size: size_t) ?*u8; fn doAThing() ?*Foo { const ptr = malloc(1234) orelse return null; // ... }Eine weitere Möglichkeit ist die Verwendung von if:9-optional-if.zigfn doAThing(optional_foo: ?*Foo) void { // do some stuff if (optional_foo) |foo| { doSomethingWithFoo(foo); } // do some stuff }Der gleiche Ausdruck funktioniert mit while:10-optional-while.zigconst std = @import("std"); pub fn main() void { const msg = "hello this is dog"; var it = std.mem.tokenize(u8, msg, " "); while (it.next()) |item| { std.debug.print("{s}\n", .{item}); } }Shell$ zig build-exe 10-optional-while.zig $ ./10-optional-while hello this is dog Manuelle SpeicherverwaltungEine in Zig geschriebene Bibliothek kann überall verwendet werden:DesktopanwendungenServer mit geringer LatenzBetriebssystemkernelEmbedded devicesEchtzeitanwendungen, z. B. Live-Auftritte, Flugzeuge, HerzschrittmacherIn Web-Browsern oder anderen Erweiterungen mit WebAssemblyDurch andere Programmiersprachen, unter Verwendung des C-ABIUm dies zu erreichen, müssen Zig-Programmierer ihren eigenen Speicher verwalten und Fehler bei der Speicherzuweisung beheben.Das gilt auch für die Zig-Standardbibliothek. Alle Funktionen, die Speicher zuweisen müssen, akzeptieren einen Allocator-Parameter. Daher kann die Zig-Standardbibliothek auch für ein "freistehende Ziel" verwendet werden.Zusätzlich zu Einem neuen Ansatz zur Fehlerbehandlung bietet Zig defer und errdefer, um die gesamte Ressourcenverwaltung – nicht nur die des Speichers – einfach und leicht überprüfbar zu machen.Ein Beispiel für „defer“ findet man unter Integration mit C-Bibliotheken ohne FFI/Bindings. Hier ist ein Beispiel für die Verwendung von errdefer: 11-errdefer.zigconst Device = struct { name: []u8, fn create(allocator: *Allocator, id: u32) !Device { const device = try allocator.create(Device); errdefer allocator.destroy(device); device.name = try std.fmt.allocPrint(allocator, "Device(id={d})", id); errdefer allocator.free(device.name); if (id == 0) return error.ReservedDeviceId; return device; } };Ein neuer Ansatz zur FehlerbehandlungFehler sind Werte und dürfen nicht ignoriert werden:12-errors-as-values.zigconst std = @import("std"); pub fn main() void { _ = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); }Shell$ zig build-exe 12-errors-as-values.zig /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/12-errors-as-values.zig:4:30: error: error union is discarded _ = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); ~~~~~~~~~~~~~~~~~~~~~^~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/12-errors-as-values.zig:4:30: note: consider using 'try', 'catch', or 'if' referenced by: callMain: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:17 callMainWithArgs: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:482:12 remaining reference traces hidden; use '-freference-trace' to see all reference traces Fehler können mit catch behandelt werden:13-errors-catch.zigconst std = @import("std"); pub fn main() void { const file = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}) catch |err| label: { std.debug.print("unable to open file: {}\n", .{err}); const stderr = std.io.getStdErr(); break :label stderr; }; file.writeAll("all your codebase are belong to us\n") catch return; }Shell$ zig build-exe 13-errors-catch.zig $ ./13-errors-catch unable to open file: error.FileNotFound all your codebase are belong to us Das Schlüsselwort try ist eine Abkürzung für catch |err| return err:14-errors-try.zigconst std = @import("std"); pub fn main() !void { const file = try std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); defer file.close(); try file.writeAll("all your codebase are belong to us\n"); }Shell$ zig build-exe 14-errors-try.zig $ ./14-errors-try error: FileNotFound /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/posix.zig:1768:23: 0x1066a70 in openatZ (14-errors-try) .NOENT => return error.FileNotFound, ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:880:16: 0x1038294 in openFileZ (14-errors-try) const fd = try posix.openatZ(self.fd, sub_path, os_flags, 0); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:827:5: 0x1034d9e in openFile (14-errors-try) return self.openFileZ(&path_c, flags); ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/14-errors-try.zig:4:18: 0x1034be8 in main (14-errors-try) const file = try std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); ^ Es gilt zu beachten, dass es sich um einen Error-Return-Trace und nicht um einen Stack-Trace handelt. Der Code hat nicht den Preis für das Abwickeln des Stacks bezahlt, um diesen Trace zu erstellen.Das bei einem Fehler verwendete Schlüsselwort switch stellt sicher, dass alle möglichen Fehler behandelt werden:15-errors-switch.zigconst std = @import("std"); test "switch on error" { _ = parseInt("hi", 10) catch |err| switch (err) {}; } fn parseInt(buf: []const u8, radix: u8) !u64 { var x: u64 = 0; for (buf) |c| { const digit = try charToDigit(c); if (digit >= radix) { return error.DigitExceedsRadix; } x = try std.math.mul(u64, x, radix); x = try std.math.add(u64, x, digit); } return x; } fn charToDigit(c: u8) !u8 { const value = switch (c) { '0'...'9' => c - '0', 'A'...'Z' => c - 'A' + 10, 'a'...'z' => c - 'a' + 10, else => return error.InvalidCharacter, }; return value; }Shell$ zig build-exe 15-errors-switch.zig /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:509:45: error: root struct of file '15-errors-switch' has no member named 'main' switch (@typeInfo(@typeInfo(@TypeOf(root.main)).Fn.return_type.?)) { ~~~~^~~~~ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/15-errors-switch.zig:1:1: note: struct declared here const std = @import("std"); ^~~~~ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:482:20: note: called from here return callMain(); ~~~~~~~~^~ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:438:36: note: called from here std.posix.exit(callMainWithArgs(argc, argv, envp)); ~~~~~~~~~~~~~~~~^~~~~~~~~~~~~~~~~~ referenced by: _start: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:351:40 remaining reference traces hidden; use '-freference-trace' to see all reference traces Das Schlüsselwort unreachable wird verwendet, um sicherzustellen, dass keine Fehler auftreten:16-unreachable.zigconst std = @import("std"); pub fn main() void { const file = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}) catch unreachable; file.writeAll("all your codebase are belong to us\n") catch unreachable; }Shell$ zig build-exe 16-unreachable.zig $ ./16-unreachable thread 3030318 panic: attempt to unwrap error: FileNotFound /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/posix.zig:1768:23: 0x10699b0 in openatZ (16-unreachable) .NOENT => return error.FileNotFound, ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:880:16: 0x1039a94 in openFileZ (16-unreachable) const fd = try posix.openatZ(self.fd, sub_path, os_flags, 0); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:827:5: 0x103723e in openFile (16-unreachable) return self.openFileZ(&path_c, flags); ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/16-unreachable.zig:4:77: 0x1034fcf in main (16-unreachable) const file = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}) catch unreachable; ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:22: 0x10347d9 in posixCallMainAnd'''
