["https://ziglang.org/download/0.13.0/release-notes.html"]
title = "0.13.0 Release Notes ⚡ The Zig Programming Language"
full_description = "Zig is a general-purpose programming language and toolchain for maintaining robust, optimal, and reusable software. Zig development is funded via Zig Software Foundation, a 501(c)(3) non-profit organization. Please consider a recurring donation so that we can offer more billable hours to our core team members. This is the most straightforward way to accelerate the project along the Roadmap to 1.0. This release features 2 months of work: changes from 73 different contributors, spread among 415 commits. This is a relatively short release cycle, primarily motivated by Toolchain upgrades, such as upgrading to LLVM 18. A green check mark (✅) indicates the target meets all the requirements for the support tier. The other icons indicate what is preventing the target from reaching the support tier. In other words, the icons are to-do items. std.process.Child: Mitigate arbitrary command execution vulnerability on Windows (BatBadBut) (#19698) This removes the two original implementations in favour of the single generic one based on the Algorithm type. Previously we had three, very similar implementations which was somewhat confusing when knowing what one should actually be used. The Koopman polynomial did not have an exact equivalent so one has been added to the catalog.txt file. This does mean we have patched this file but this will be clear if updated in future and tests will catch this. This is a breaking change for direct users of the old polynomial api. Specifically when using a custom or non-standard polynomial (the Crc32 alias will continue to work). There are clear compile errors indicating what is required in order to retain existing functionality, this may require a small code-change from the user. Custom polynomials require a bit more interaction and will require a user to define their own Algorithm type. If used note that the previous implementation expected a pre-reflected polynomial and used the following parameters: Loose performance measurements below. Table sizes are indicated to the right. Nothing new, helps rationalise the overlap that was present."
