["https://ziglang.org/documentation/0.1.1"]
title = "Documentation - The Zig Programming Language"
full_description = '''Often the most efficient way to learn something new is to see examples, so this documentation shows how to use each of Zig's features. It is all on one page so you can search with your browser's search tool. Multiline string literals have no escapes and can span across multiple lines. To start a multiline string literal, use the \\ token. Just like a comment, the string literal goes until the end of the line. The end of the line is not included in the string literal. However, if the next line begins with \\ then a newline is appended and the string literal continues. Integer literals have no size limitation, and if any undefined behavior occurs, the compiler catches it. However, once an integer value is no longer known at compile-time, it must have a known size, and is vulnerable to undefined behavior. In this function, values a and b are known only at runtime, and thus this division operation is vulnerable to both integer overflow and division by zero. Operators such as + and - cause undefined behavior on integer overflow. Also available are operations such as +% and -% which are defined to have wrapping arithmetic on all targets. By default floating point operations use Optimized mode, but you can switch to Strict mode on a per-block basis: For this test we have to separate code into two object files - otherwise the optimizer figures out all the values at compile-time, which operates in strict mode. Each type has an alignment - a number of bytes such that, when a value of the type is loaded from or stored to memory, the memory address must be evenly divisible by this number. You can use @alignOf to find out this value for any type. In Zig, a pointer type has an alignment value. If the value is equal to the alignment of the underlying type, it can be omitted from the type: In the same way that a &i32 can be implicitly cast to a &const i32, a pointer with a larger alignment can be implicitly cast to a pointer with a smaller alignment, but not vice versa. You can specify alignment on variables and functions. If you do this, then pointers to them get the specified alignment:'''
year_published = 2025
