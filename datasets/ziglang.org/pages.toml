["https://ziglang.org/download/0.9.0/release-notes.html"]
title = "0.9.0 Release Notes ⚡ The Zig Programming Language"
full_description = 'Zig is a general-purpose programming language and toolchain for maintaining robust, optimal, and reusable software. Backed by the Zig Software Foundation, the project is financially sustainable. These core team members work on Zig full-time: This release features 6 months of work: changes from 177 different contributors, spread among 2023 commits. One sentence summary: The Toolchain "just works" in more cases, many bugs were fixed, the Self-Hosted Compiler is 44% complete, the Support Table is expanded, there were a handful of Language Changes, the project started Performance Tracking, and the Standard Library, although unstable, became more useful. To many, the reaction to this announcement will be something like, "Oh? I thought he was already on the core zig team." This goes to show how obvious this decision was. Isaac is a level-headed, talented, careful, patient, and diligent programmer. You might be viewing these release notes through his dynamic tiling Wayland compositor, River. In addition to lending his technical expertise to the Zig project, Isaac has proven to be a steadfast community leader, setting an example for how to treat others with kindness and respect. A green check mark (✅) indicates the target meets all the requirements for the support tier. The other icons indicate what is preventing the target from reaching the support tier. In other words, the icons are to-do items. If you find any wrong data here please submit a pull request! During this release we hit some major milestones. The Self-Hosted Linker for wasm was rewritten, with knowledge gained from building a stand-alone wasm linker. The linker is now capable of building a memory layout with a virtual stack, as well as perform relocations. Those are some of the neccesary features required to be able to implement zig test. As of today, the self-hosted wasm backend is now capable of passing 13% of all the behavioral tests. With all of those changes, contributing to the wasm backend is made a lot easier. The linker is now capable enough where only knowledge about wasm is required to contribute to the backend.'
year_published = 2025
