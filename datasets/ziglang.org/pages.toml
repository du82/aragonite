full_description = '''← Back to 学ぶ 詳細な概要 機能ハイライト小さく、シンプルな言語プログラミング言語の知識をデバッグするよりも、アプリケーションのデバッグに重点を置いてください。Zigの全文法は、580行のPEG文法ファイルで指定されています。隠された制御フローも、隠されたメモリ確保も、プリプロセッサも、マクロも存在しないのです。もしZigのコードが関数を呼び出すために飛び出しているように見えないなら、それは違います。つまり、次のコードはfoo()とbar()のみを呼び出し、何も型を知らなくてもこれが保証されることを意味します：var a = b + c.d; foo(); bar(); 隠された制御フローの例：Dには@property関数があります。これは、フィールドアクセスのように見えるメソッドで、上記の例ではc.dが関数を呼び出すかもしれません。C++、D、Rustには演算子のオーバーローディングがあるので、+演算子は関数を呼び出すかもしれません。C++、D、Goにはthrow/catch 例外機能があるので、foo()は例外をスローしてbar()が呼ばれないようにするかもしれません。Zigは、すべての制御フローを言語キーワードと関数呼び出しのみで管理することで、コードの保守性と可読性を高めています。性能と安全性：2つの選択Zigには4つのビルドモードがあり、これらはすべてスコープ粒度に至るまで混在させることが可能です。 パラメータ Debug ReleaseSafe ReleaseFast ReleaseSmall 最適化 - 速度の向上、デバッグの悪影響、コンパイル時の悪影響 -O3 -O3 -Os ランタイムセーフティチェック - 危険速度、危険サイズ、未定義動作の代わりのクラッシュ On On 以下は、ビルドモードに関係なく、コンパイル時の整数オーバーフローの様子です：1-integer-overflow.zigtest "integer overflow at compile time" { const x: u8 = 255; _ = x + 1; }Shell$ zig test 1-integer-overflow.zig assets/zig-code/features/1-integer-overflow.zig:3:11: error: overflow of integer type 'u8' with value '256' 以下は、安全性を確認したビルドにおける、実行時の様子です：2-integer-overflow-runtime.zigtest "integer overflow at runtime" { var x: u8 = 255; x += 1; }Shell$ zig test 2-integer-overflow-runtime.zig 1/1 2-integer-overflow-runtime.test.integer overflow at runtime...thread 3030394 panic: integer overflow /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/2-integer-overflow-runtime.zig:3:7: 0x103cc2e in test.integer overflow at runtime (test) x += 1; ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/compiler/test_runner.zig:157:25: 0x1047f99 in mainTerminal (test) if (test_fn.func()) |_| { ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/compiler/test_runner.zig:37:28: 0x103e01b in main (test) return mainTerminal(); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:22: 0x103d159 in posixCallMainAndExit (test) root.main(); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:266:5: 0x103ccc1 in _start (test) asm volatile (switch (native_arch) { ^ ???:?:?: 0x0 in ??? (???) error: the following test command crashed: /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/.zig-cache/o/9e3bfcb661c1ce3251fa44aa9886f390/test これらは、freestandingを含むすべてのターゲットでスタックトレースが動作します。Zigでは、安全性を有効にしたビルドモードに依存し、パフォーマンスのボトルネックとなる部分の安全性を選択的に無効化することができます。例えば、前の例はこのように修正することができます：3-undefined-behavior.zigtest "actually undefined behavior" { @setRuntimeSafety(false); var x: u8 = 255; x += 1; // XXX undefined behavior! }Zigは、未定義の動作を、バグ対策とパフォーマンス向上の両面で、剃刀のように鋭い道具として使っています。パフォーマンスについて言えば、ZigはCよりも速いです。リファレンス実装では、最先端の最適化のためのバックエンドとしてLLVMを使用しています。他のプロジェクトが「リンクタイム最適化」と呼ぶものを、Zigは自動的に行うのです。ネイティブターゲットでは、クロスコンパイルは第一級の使用例のおかげで、高度なCPU機能が有効になります(-march=native)。未定義の挙動を慎重に選択する。例えば、Zigでは符号付き整数も符号なし整数もオーバーフロー時の挙動が未定義であるのに対し、C言語では符号付き整数だけです。これにより、C言語ではできない最適化が容易になります。ZigはSIMDベクトル型を直接公開しており、移植性の高いベクトル化コードを簡単に記述することができます。Zigは完全な安全言語ではありませんのでご注意ください。Zigの安全性に関するストーリーを追いたい方は、これらの号をご購読ください：安全確認ができないものも含め、あらゆる種類の未定義の動作を列挙するDebug および ReleaseSafe モードを完全に安全なものにするZigはC言語に依存するのではなく、C言語と競争するZig標準ライブラリはlibcと統合されていますが、libcに依存しているわけではありません。以下はHello Worldです：4-hello.zigconst std = @import("std"); pub fn main() void { std.debug.print("Hello, world!\n", .{}); }Shell$ zig build-exe 4-hello.zig $ ./4-hello Hello, world! -O ReleaseSmall、デバッグシンボル除去、シングルスレッドでコンパイルすると、x86_64-linuxターゲットで9.8 KiBの静的実行ファイルが作成されます：$ zig build-exe hello.zig -O ReleaseSmall -fstrip -fsingle-threaded $ wc -c hello 9944 hello $ ldd hello not a dynamic executable Windowsでのビルドはさらに小さく、4096バイトになります：$ zig build-exe hello.zig -O ReleaseSmall -fstrip -fsingle-threaded -target x86_64-windows $ wc -c hello.exe 4096 hello.exe $ file hello.exe hello.exe: PE32+ executable (console) x86-64, for MS Windows 順序に依存しないトップレベル宣言グローバル変数のようなトップレベルの宣言は、順序に依存せず、遅延的に解析される。グローバル変数の初期化値はコンパイル時に評価されます。5-global-variables.zigvar y: i32 = add(10, x); const x: i32 = add(12, 34); test "global variables" { assert(x == 46); assert(y == 56); } fn add(a: i32, b: i32) i32 { return a + b; } const std = @import("std"); const assert = std.debug.assert;Shell$ zig test 5-global-variables.zig 1/1 5-global-variables.test.global variables...OK All 1 tests passed. nullポインタの代わりにオプショナル型他のプログラミング言語では、null参照は多くの実行時例外の原因となり、コンピュータサイエンスの最悪の過ちとまで非難されています。飾り気のないZigポインタはnullにできません：6-null-to-ptr.zigtest "null @intToPtr" { const foo: *i32 = @ptrFromInt(0x0); _ = foo; }Shell$ zig test 6-null-to-ptr.zig assets/zig-code/features/6-null-to-ptr.zig:2:35: error: pointer type '*i32' does not allow address zero しかし、どのような型でもその前に?を付けることによってオプショナル型にすることができます：7-optional-syntax.zigconst std = @import("std"); const assert = std.debug.assert; test "null @intToPtr" { const ptr: ?*i32 = @ptrFromInt(0x0); assert(ptr == null); }Shell$ zig test 7-optional-syntax.zig 1/1 7-optional-syntax.test.null @intToPtr...OK All 1 tests passed. オプションの値をアンラップするには、orelseを使ってデフォルト値を指定することができます：8-optional-orelse.zig// malloc prototype included for reference extern fn malloc(size: size_t) ?*u8; fn doAThing() ?*Foo { const ptr = malloc(1234) orelse return null; // ... }また、ifを使うという選択肢もあります：9-optional-if.zigfn doAThing(optional_foo: ?*Foo) void { // do some stuff if (optional_foo) |foo| { doSomethingWithFoo(foo); } // do some stuff }whileでも同じ構文が使えます：10-optional-while.zigconst std = @import("std"); pub fn main() void { const msg = "hello this is dog"; var it = std.mem.tokenize(u8, msg, " "); while (it.next()) |item| { std.debug.print("{s}\n", .{item}); } }Shell$ zig build-exe 10-optional-while.zig $ ./10-optional-while hello this is dog 手動のメモリ管理Zigで書かれたライブラリは、どこでも使用することができます：デスクトップアプリケーション低レイテンシーサーバOSカーネル組込み機器リアルタイムソフトウェア（例：ライブ、飛行機、ペースメーカーなど）WebAssemblyを搭載したWebブラウザやその他プラグインCのABIを使用するその他プログラミング言語呼び出しこれらを実現するために、Zigのプログラマは自分自身のメモリを管理しなければならず、メモリ割り当ての失敗を処理しなければなりません。これは、Zig標準ライブラリにも当てはまります。メモリを確保する必要がある関数はすべてアロケータパラメータを受け取ります。その結果、Zig標準ライブラリは、独立したターゲットに対しても使用することができます。Zigではエラー処理を見直すに加えて、defer とerrdeferを提供して、メモリに限らずあらゆるリソース管理をシンプルかつ容易に検証できるようにしています。deferの例については、FFI/バインディングを使わないCライブラリとの統合を参照してください。ここでは、errdeferを使用した例を示します：11-errdefer.zigconst Device = struct { name: []u8, fn create(allocator: *Allocator, id: u32) !Device { const device = try allocator.create(Device); errdefer allocator.destroy(device); device.name = try std.fmt.allocPrint(allocator, "Device(id={d})", id); errdefer allocator.free(device.name); if (id == 0) return error.ReservedDeviceId; return device; } };エラー処理を見直すエラーは値であり、無視できない場合があります：12-errors-as-values.zigconst std = @import("std"); pub fn main() void { _ = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); }Shell$ zig build-exe 12-errors-as-values.zig /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/12-errors-as-values.zig:4:30: error: error union is discarded _ = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); ~~~~~~~~~~~~~~~~~~~~~^~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/12-errors-as-values.zig:4:30: note: consider using 'try', 'catch', or 'if' referenced by: callMain: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:17 callMainWithArgs: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:482:12 remaining reference traces hidden; use '-freference-trace' to see all reference traces エラーはcatchで処理することができます：13-errors-catch.zigconst std = @import("std"); pub fn main() void { const file = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}) catch |err| label: { std.debug.print("unable to open file: {}\n", .{err}); const stderr = std.io.getStdErr(); break :label stderr; }; file.writeAll("all your codebase are belong to us\n") catch return; }Shell$ zig build-exe 13-errors-catch.zig $ ./13-errors-catch unable to open file: error.FileNotFound all your codebase are belong to us キーワードtryはcatch |err| return errのショートカットです：14-errors-try.zigconst std = @import("std"); pub fn main() !void { const file = try std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); defer file.close(); try file.writeAll("all your codebase are belong to us\n"); }Shell$ zig build-exe 14-errors-try.zig $ ./14-errors-try error: FileNotFound /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/posix.zig:1768:23: 0x1066a70 in openatZ (14-errors-try) .NOENT => return error.FileNotFound, ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:880:16: 0x1038294 in openFileZ (14-errors-try) const fd = try posix.openatZ(self.fd, sub_path, os_flags, 0); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:827:5: 0x1034d9e in openFile (14-errors-try) return self.openFileZ(&path_c, flags); ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/14-errors-try.zig:4:18: 0x1034be8 in main (14-errors-try) const file = try std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); ^ これはスタックトレースではなくエラーリターントレースであることに注意しましょう。コードはそのトレースを得るためにスタックを巻き戻すという代償を支払わなかったのです。エラー時に使用されるswitchキーワードは、起こりうるすべてのエラーを確実に処理するものです：15-errors-switch.zigconst std = @import("std"); test "switch on error" { _ = parseInt("hi", 10) catch |err| switch (err) {}; } fn parseInt(buf: []const u8, radix: u8) !u64 { var x: u64 = 0; for (buf) |c| { const digit = try charToDigit(c); if (digit >= radix) { return error.DigitExceedsRadix; } x = try std.math.mul(u64, x, radix); x = try std.math.add(u64, x, digit); } return x; } fn charToDigit(c: u8) !u8 { const value = switch (c) { '0'...'9' => c - '0', 'A'...'Z' => c - 'A' + 10, 'a'...'z' => c - 'a' + 10, else => return error.InvalidCharacter, }; return value; }Shell$ zig build-exe 15-errors-switch.zig /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:509:45: error: root struct of file '15-errors-switch' has no member named 'main' switch (@typeInfo(@typeInfo(@TypeOf(root.main)).Fn.return_type.?)) { ~~~~^~~~~ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/15-errors-switch.zig:1:1: note: struct declared here const std = @import("std"); ^~~~~ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:482:20: note: called from here return callMain(); ~~~~~~~~^~ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:438:36: note: called from here std.posix.exit(callMainWithArgs(argc, argv, envp)); ~~~~~~~~~~~~~~~~^~~~~~~~~~~~~~~~~~ referenced by: _start: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:351:40 remaining reference traces hidden; use '-freference-trace' to see all reference traces キーワードunreachableは、エラーが発生しないことを表明するために使用されます：16-unreachable.zigconst std = @import("std"); pub fn main() void { const file = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}) catch unreachable; file.writeAll("all your codebase are belong to us\n") catch unreachable; }Shell$ zig build-exe 16-unreachable.zig $ ./16-unreachable thread 3030318 panic: attempt to unwrap error: FileNotFound /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/posix.zig:1768:23: 0x10699b0 in openatZ (16-unreachable) .NOENT => return error.FileNotFound, ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:880:16: 0x1039a94 in openFileZ (16-unreachable) const fd = try posix.openatZ(self.fd, sub_path, os_flags, 0); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:827:5: 0x103723e in openFile (16-unreachable) return self.openFileZ(&path_c, flags); ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/16-unreachable.zig:4:77: 0x1034fcf in main (16-unreachable) const file = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}) catch unreachable; ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:22: 0x10347d9 in posixCallMainAndExit (16-unreachable) root.main(); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:266:5: 0x1034341 in _start (16-unreachable) asm volatile (switch (native_arch) { ^ ???:?:?: 0x0 in ??? (???) (process terminated by signal) 安全でないビルドモードではundefined behaviorを呼び出すので、成功が保証されている場合にのみ使用するようにしてください。すべてのターゲットのスタックトレースこのページで紹介するスタックトレースとエラーリターントレースは、すべてのTier 1サポート及びいくつかのTier 2サポートターゲットで機能します。自立型も！さらに、標準ライブラリには、任意の時点でスタックトレースをキャプチャし、後で標準エラーにダンプする機能があります：17-stack-traces.zigconst std = @import("std"); var address_buffer: [8]usize = undefined; var trace1 = std.builtin.StackTrace{ .instruction_addresses = address_buffer[0..4], .index = 0, }; var trace2 = std.builtin.StackTrace{ .instruction_addresses = address_buffer[4..], .index = 0, }; pub fn main() void { foo(); bar(); std.debug.print("first one:\n", .{}); std.debug.dumpStackTrace(trace1); std.debug.print("\n\nsecond one:\n", .{}); std.debug.dumpStackTrace(trace2); } fn foo() void { std.debug.captureStackTrace(null, &trace1); } fn bar() void { std.debug.captureStackTrace(null, &trace2); }Shell$ zig build-exe 17-stack-traces.zig $ ./17-stack-traces first one: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/debug.zig:365:29: 0x10396e7 in captureStackTrace (17-stack-traces) addr.* = it.next() orelse { ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/17-stack-traces.zig:26:32: 0x103717c in foo (17-stack-traces) std.debug.captureStackTrace(null, &trace1); ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/17-stack-traces.zig:16:8: 0x10350c8 in main (17-stack-traces) foo(); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:22: 0x1034979 in posixCallMainAndExit (17-stack-traces) root.main(); ^ second one: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/debug.zig:365:29: 0x10396e7 in captureStackTrace (17-stack-traces) addr.* = it.next() orelse { ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/17-stack-traces.zig:30:32: 0x103719c in bar (17-stack-traces) std.debug.captureStackTrace(null, &trace2); ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/17-stack-traces.zig:17:8: 0x10350cd in main (17-stack-traces) bar(); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:22: 0x1034979 in posixCallMainAndExit (17-stack-traces) root.main(); ^ この手法は、現在進行中のGeneralPurposeDebugAllocatorプロジェクトで使用されているのを見ることができます。ジェネリックなデータ構造と関数型とは、コンパイル時に知っておかなければならない値です：18-types.zigconst std = @import("std"); const assert = std.debug.assert; test "types are values" { const T1 = u8; const T2 = bool; assert(T1 != T2); const x: T2 = true; assert(x); }Shell$ zig test 18-types.zig 1/1 18-types.test.types are values...OK All 1 tests passed. ジェナリックなデータ構造は、単にtypeを返す関数です：19-generics.zigconst std = @import("std"); fn List(comptime T: type) type { return struct { items: []T, len: usize, }; } pub fn main() void { var buffer: [10]i32 = undefined; var list = List(i32){ .items = &buffer, .len = 0, }; list.items[0] = 1234; list.len += 1; std.debug.print("{d}\n", .{list.items.len}); }Shell$ zig build-exe 19-generics.zig $ ./19-generics 10 コンパイル時反映とコンパイル時コード実行@typeInfoビルトイン関数でリフレクションを実現します：20-reflection.zigconst std = @import("std"); const Header = struct { magic: u32, name: []const u8, }; pub fn main() void { printInfoAboutStruct(Header); } fn printInfoAboutStruct(comptime T: type) void { const info '''
