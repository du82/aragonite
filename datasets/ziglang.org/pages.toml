title = "Приклади  ⚡  Zig Programming Language"
full_description = '''← Назад до Вчитися Приклади Hello worldВиклик функцій зовнішньої бібліотекиВиявлення витоків пам'ятіСумісність з CZigg ZaggУзагальнені типиВикористання cURL з середини Zig Hello worldA minimal example printing hello world.hello-world.zigconst std = @import("std"); pub fn main() !void { const stdout = std.io.getStdOut().writer(); try stdout.print("hello world!\n", .{}); }Shell$ zig build-exe hello-world.zig $ ./hello-world hello world! Виклик функцій зовнішньої бібліотекиТаким чином можна викликати всі функції системного API, вам не потрібні бібліотечні прив’язки для взаємодії з ними.windows-msgbox.zigconst win = @import("std").os.windows; extern "user32" fn MessageBoxA(?win.HWND, [*:0]const u8, [*:0]const u8, u32) callconv(win.WINAPI) i32; pub fn main() !void { _ = MessageBoxA(null, "world!", "Hello", 0); }Shell$ zig test windows-msgbox.zig All 0 tests passed. Виявлення витоків пам'ятіЗа допомогою std.heap.GeneralPurposeAllocator ви можете відстежувати подвійне звільнення та витік пам'яті.memory-leak.zigconst std = @import("std"); pub fn main() !void { var general_purpose_allocator = std.heap.GeneralPurposeAllocator(.{}){}; defer std.debug.assert(general_purpose_allocator.deinit() == .ok); const gpa = general_purpose_allocator.allocator(); const u32_ptr = try gpa.create(u32); _ = u32_ptr; // silences unused variable error // oops I forgot to free! }Shell$ zig build-exe memory-leak.zig $ ./memory-leak error(gpa): memory address 0x7f5d23a98000 leaked: /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/samples/memory-leak.zig:9:35: 0x10378f0 in main (memory-leak) const u32_ptr = try gpa.create(u32); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:524:37: 0x10377d5 in posixCallMainAndExit (memory-leak) const result = root.main() catch |err| { ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:266:5: 0x10372f1 in _start (memory-leak) asm volatile (switch (native_arch) { ^ thread 1241960 panic: reached unreachable code /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/debug.zig:412:14: 0x1037b5d in assert (memory-leak) if (!ok) unreachable; // assertion failure ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/samples/memory-leak.zig:5:27: 0x1037952 in main (memory-leak) defer std.debug.assert(general_purpose_allocator.deinit() == .ok); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:524:37: 0x10377d5 in posixCallMainAndExit (memory-leak) const result = root.main() catch |err| { ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:266:5: 0x10372f1 in _start (memory-leak) asm volatile (switch (native_arch) { ^ ???:?:?: 0x0 in ??? (???) (process terminated by signal) Сумісність з CПриклад імпорту файлу заголовка C і компонування з libc і raylib.c-interop.zig// build with `zig build-exe cimport.zig -lc -lraylib` const ray = @cImport({ @cInclude("raylib.h"); }); pub fn main() void { const screenWidth = 800; const screenHeight = 450; ray.InitWindow(screenWidth, screenHeight, "raylib [core] example - basic window"); defer ray.CloseWindow(); ray.SetTargetFPS(60); while (!ray.WindowShouldClose()) { ray.BeginDrawing(); defer ray.EndDrawing(); ray.ClearBackground(ray.RAYWHITE); ray.DrawText("Hello, World!", 190, 200, 20, ray.LIGHTGRAY); } }Zigg ZaggZig оптимізований для проходження код-інтерв’ю (не зовсім).ziggzagg.zigconst std = @import("std"); pub fn main() !void { const stdout = std.io.getStdOut().writer(); var i: usize = 1; while (i <= 16) : (i += 1) { if (i % 15 == 0) { try stdout.writeAll("ZiggZagg\n"); } else if (i % 3 == 0) { try stdout.writeAll("Zigg\n"); } else if (i % 5 == 0) { try stdout.writeAll("Zagg\n"); } else { try stdout.print("{d}\n", .{i}); } } }Shell$ zig build-exe ziggzagg.zig $ ./ziggzagg 1 2 Zigg 4 Zagg Zigg 7 8 Zigg Zagg 11 Zigg 13 14 ZiggZagg 16 Узагальнені типиУ Zig типи є значеннями comptime, і ми використовуємо функції, які повертають тип для реалізації загальних алгоритмів і структур даних. У цьому прикладі ми реалізуємо просту узагальнену чергу та перевіримо її поведінку.generic-type.zigconst std = @import("std"); pub fn Queue(comptime Child: type) type { return struct { const This = @This(); const Node = struct { data: Child, next: ?*Node, }; gpa: std.mem.Allocator, start: ?*Node, end: ?*Node, pub fn init(gpa: std.mem.Allocator) This { return This{ .gpa = gpa, .start = null, .end = null, }; } pub fn enqueue(this: *This, value: Child) !void { const node = try this.gpa.create(Node); node.* = .{ .data = value, .next = null }; if (this.end) |end| end.next = node // else this.start = node; this.end = node; } pub fn dequeue(this: *This) ?Child { const start = this.start orelse return null; defer this.gpa.destroy(start); if (start.next) |next| this.start = next else { this.start = null; this.end = null; } return start.data; } }; } test "queue" { var int_queue = Queue(i32).init(std.testing.allocator); try int_queue.enqueue(25); try int_queue.enqueue(50); try int_queue.enqueue(75); try int_queue.enqueue(100); try std.testing.expectEqual(int_queue.dequeue(), 25); try std.testing.expectEqual(int_queue.dequeue(), 50); try std.testing.expectEqual(int_queue.dequeue(), 75); try std.testing.expectEqual(int_queue.dequeue(), 100); try std.testing.expectEqual(int_queue.dequeue(), null); try int_queue.enqueue(5); try std.testing.expectEqual(int_queue.dequeue(), 5); try std.testing.expectEqual(int_queue.dequeue(), null); }Shell$ zig test generic-type.zig 1/1 generic-type.test.queue...OK All 1 tests passed. Використання cURL з середини Zigcurl.zig// compile with `zig build-exe zig-curl-test.zig --library curl --library c $(pkg-config --cflags libcurl)` const std = @import("std"); const cURL = @cImport({ @cInclude("curl/curl.h"); }); pub fn main() !void { var arena_state = std.heap.ArenaAllocator.init(std.heap.c_allocator); defer arena_state.deinit(); const allocator = arena_state.allocator(); // global curl init, or fail if (cURL.curl_global_init(cURL.CURL_GLOBAL_ALL) != cURL.CURLE_OK) return error.CURLGlobalInitFailed; defer cURL.curl_global_cleanup(); // curl easy handle init, or fail const handle = cURL.curl_easy_init() orelse return error.CURLHandleInitFailed; defer cURL.curl_easy_cleanup(handle); var response_buffer = std.ArrayList(u8).init(allocator); // superfluous when using an arena allocator, but // important if the allocator implementation changes defer response_buffer.deinit(); // setup curl options if (cURL.curl_easy_setopt(handle, cURL.CURLOPT_URL, "https://ziglang.org") != cURL.CURLE_OK) return error.CouldNotSetURL; // set write function callbacks if (cURL.curl_easy_setopt(handle, cURL.CURLOPT_WRITEFUNCTION, writeToArrayListCallback) != cURL.CURLE_OK) return error.CouldNotSetWriteCallback; if (cURL.curl_easy_setopt(handle, cURL.CURLOPT_WRITEDATA, &response_buffer) != cURL.CURLE_OK) return error.CouldNotSetWriteCallback; // perform if (cURL.curl_easy_perform(handle) != cURL.CURLE_OK) return error.FailedToPerformRequest; std.log.info("Got response of {d} bytes", .{response_buffer.items.len}); std.debug.print("{s}\n", .{response_buffer.items}); } fn writeToArrayListCallback(data: *anyopaque, size: c_uint, nmemb: c_uint, user_data: *anyopaque) callconv(.C) c_uint { var buffer: *std.ArrayList(u8) = @alignCast(@ptrCast(user_data)); var typed_data: [*]u8 = @ptrCast(data); buffer.appendSlice(typed_data[0 .. nmemb * size]) catch return 0; return nmemb * size; }'''
