["https://ziglang.org/ja-JP/learn/getting-started"]
title = "始めましょう  ⚡  Zig Programming Language"
full_description = '← Back to 学ぶ 始めましょう タグ付きリリースかナイトリービルドか？Zigをインストールする 直接ダウンロード WindowsでのPATHの設定Linux、macOS、BSDでのPATHの設定パッケージマネージャ WindowsmacOSLinuxソースからのビルド推奨ツール シンタックスハイライターとLSPHello Worldを実行する次のステップ タグ付きリリースかナイトリービルドか？Zigはまだv1.0に到達しておらず、現在のリリースサイクルはLLVMの新リリースに連動しており、その周期は6ヶ月程度となっています。 現実的には、Zigのリリースは間隔が開きがちで、現在の開発スピードからするといずれ陳腐化すると言われています。タグ付きバージョンを使ってZigを評価するのは良いのですが、もしZigが好きでもっと深く知りたいと思ったら ナイトリービルドにアップグレードすることをお勧めします 。 そうすれば、助けを得るのがより簡単になるからです：zig.guideのようなサイトは、上記の理由から master ブランチを追跡しています。Zigのバージョンを切り替えるのはとても簡単で、同時に複数のバージョンをシステム上に存在させることも可能です。Zigのリリースは自己完結型のアーカイブで、システムのどこにでも配置することができます。Zigをインストールする直接ダウンロードこれが最もストレートなZigの入手方法です：Downloadsページから、あなたのプラットフォーム用のZigバンドルを取得し、 ディレクトリに解凍してPATHに追加すれば、どの場所からでもzigを呼び出すことができるようになります。WindowsでのPATHの設定Windowsでパスを設定するには、Powershellインスタンスで次のコードのスニペットのうち1つを実行します。 この変更をシステム全体に適用するか（管理者権限でPowershellを実行する必要があります）、自分のユーザーだけに適用するかを選択します。 また、必ず、あなたのZigのコピーがある場所を指すようにスニペットを変更してください。 C:の前の;はタイプミスではありません。システム全体(管理者 Powershell):[Environment]::SetEnvironmentVariable( "Path", [Environment]::GetEnvironmentVariable("Path", "Machine") + ";C:\your-path\zig-windows-x86_64-your-version", "Machine" ) ユーザーレベル（Powershell）：[Environment]::SetEnvironmentVariable( "Path", [Environment]::GetEnvironmentVariable("Path", "User") + ";C:\your-path\zig-windows-x86_64-your-version", "User" ) 完了後、Powershellインスタンスを再起動します。Linux、macOS、BSDでのPATHの設定zigバイナリの場所をPATH環境変数に追加してください。これは通常、シェルのスタートアップスクリプト(.profile, .zshrc, ...)にexport行を追加することで行われます。export PATH=$PATH:~/path/to/zig 終了後、スタートアップファイルをsourceするか、シェルを再起動します。パッケージマネージャWindowsWinGetZigはWinGetで使用できます。winget install -e --id zig.zig ChocolateyZigはChocolateyで使用できます。choco install zig ScoopZigはScoopで使用できます。scoop install zig 最新の開発版：scoop bucket add versions scoop install versions/zig-dev macOSHomebrew 最新のタグ付きリリース：brew install zig MacPortsport install zig LinuxZigはLinux用の多くのパッケージマネージャにも含まれています。こちらには最新のリストがありますが、 パッケージによっては古いバージョンのZigがバンドルされている場合があることに留意してください。ソースからのビルドこちらには、 Linux、macOS、Windows用のZigをソースからビルドする方法についての詳細情報が掲載されています。推奨ツールシンタックスハイライターとLSP主要なテキストエディタは、Zigのシンタックスハイライトをサポートしています。 バンドルされているものもあれば、プラグインをインストールする必要があるものもあります。もし、Zigとエディタとのより深い統合に興味があるなら、 zigtools/zlsをチェックアウトしてください。他にどんなものがあるか興味がある方は、ツールのセクションをチェックしてみてください。Hello Worldを実行するインストールが正しく完了すれば、シェルからZigコンパイラを呼び出すことができるはずです。 それでは、最初のZigプログラムを作ってテストしてみましょう!プロジェクトディレクトリに移動し、実行します：mkdir hello-world cd hello-world zig init これが出力されるはずです：info: created build.zig info: created build.zig.zon info: created src/main.zig info: created src/root.zig info: see `zig build --help` for a menu of options zig build runを実行すると、実行ファイルがコンパイルされて実行され、最終的に以下のような結果になります：All your codebase are belong to us. Run `zig build test` to run the tests. おめでとうございます！これでZigのインストールは完了です！次のステップ学ぶ セクションにある他のリソースもチェックし、あなたのバージョンのZigのドキュメントを見つけてください（注意：ナイトリービルドは master ドキュメントを使うべきです）、 そして、zig.guideを読んでみてください。Zigは若いプロジェクトであり、残念ながら、すべてのことについて広範な文書や学習資料を作成する能力はまだありません。 したがって、行き詰まったときに助けを得るために既存のZigコミュニティのいずれかに参加することや、 Zig SHOWTIMEといった取り組みも検討してみてください。最後に、もしあなたがZigを楽しんでいて開発のスピードアップに貢献したいとお考えなら、Zigソフトウェア財団への寄付をご検討ください .'
year_published = 2025
clearnet = "https://ziglang.org/ja-JP/learn/getting-started"
