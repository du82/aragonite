["https://ziglang.org/news/welcome-jacob-young"]
title = "Jacob Young Joins the Core Zig Team  ⚡  Zig Programming Language"
full_description = "← Back to News page Jacob Young Joins the Core Zig Team July 31, 2023 I am pleased to announce our newest Zig team member, Jacob Young (screenname: jacobly0).Jacob has already contributed significant, valuable improvements to various parts of the Zig project, including the C backend, x86 backend, frontend, and countless bug fixes. He played a central role in helping us eliminate our C++ bootstrap compiler and is already playing a similar role for our reliance on LLVM. He is a truly formidable contributor who gets to the bottom of things and is not afraid to diagnose and report Linux kernel bugs, or land patches directly in Clang.Additionally, Jacob has proven to be a steadfast community leader, setting an example for how to treat others with kindness and respect. I've watched him be consistently patient with newbies, helping mentor their contributions to areas of code that he maintains. I've also noticed him eager to unblock fellow contributors, setting others up for success by eliminating the difficulties they face.Jacob is now able to bill hours to the Zig Software Foundation. It is thanks to recurring donations from our many sponsors that we can offer this. If your employer offers charity donation matching, please consider choosing ZSF, a 501(c)(3) non-profit.Most importantly, please give Jacob a warm welcome to the core Zig team.-Andrew"
