["https://ziglang.org/documentation/0.7.1"]
title = "Documentation - The Zig Programming Language"
full_description = '''Zig is a general-purpose programming language and toolchain for maintaining robust, optimal, and reusable software. Often the most efficient way to learn something new is to see examples, so this documentation shows how to use each of Zig's features. It is all on one page so you can search with your browser's search tool. The code sample shows the contents of a file named hello.zig. Files storing Zig source code are UTF-8 encoded text files. The files storing Zig source code are usually named with the .zig extension. Following the hello.zig Zig code sample, the Zig Build System is used to build an executable program from the hello.zig source code. Then, the hello program is executed showing its output Hello, world!. The lines beginning with $ represent command line prompts and a command. Everything else is program output. The code sample begins by adding Zig's Standard Library to the build using the @import builtin function. The @import("std") function call creates a structure to represent the Standard Library. The code then makes a top-level declaration of a constant identifier, named std, for easy access to Zig's standard library. Next, a public function, pub fn, named main is declared. The main function is necessary because it tells the Zig compiler where the start of the program exists. Programs designed to be executed will need a pub fn main function. For more advanced use cases, Zig offers other features to inform the compiler where the start of the program exists. Libraries, on the other hand, do not need a main function because library code is usually called by other programs. A function is a block of any number of statements and expressions that, as a whole, perform a task. Functions may or may not return data after they are done performing their task. If a function cannot perform its task, it might return an error. Zig makes all of this explicit. In the hello.zig code sample, the main function is declared with the !void return type. This return type is known as an Error Union Type. This syntax tells the Zig compiler that the function will either return an error or a value. An error union type combines an Error Set Type and a Primitive Type. The full form of an error union type is <error set type>!<primitive type>. In the code sample, the error set type is not explicitly written on the left side of the ! operator. When written this way, the error set type is a special kind of error union type that has an inferred error set type. The void after the ! operator tells the compiler that the function will not return a value under normal circumstances (i.e. no errors occur).'''
year_published = 2025
clearnet = "https://ziglang.org/documentation/0.7.1"
