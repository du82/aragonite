title = "Zig Software Foundation  ⚡  Zig Programming Language"
full_description = '''← Torna a Pagina principale Zig Software Foundation Sostenere la Zig Software FoundationIl modo migliore per sostenerci sono le donazioni ricorrenti. Mantenere e supportare software di alta qualità richiede lavoro continuo! Donate function zsfCreateWidget() { everyDotOrgDonateButton.createButton({ selector: "#zsf-every-donate-btn", nonprofitSlug: "zig-software-foundation-inc", fontSize: "32px", label: "Sponsor" }); everyDotOrgDonateButton.createWidget({ selector: "#zsf-every-donate-btn", nonprofitSlug: "zig-software-foundation-inc", defaultDonationAmount: 10, defaultFrequency: 'monthly' }); // Workaround for https://github.com/everydotorg/donate-button/issues/384 let style = document.createElement('style'); style.innerHTML = '#donation-input { color: black; } #privateNote { color: black }'; document.getElementById("shadow-wrapper").shadowRoot.appendChild(style); } if (window.everyDotOrgDonateButton) { zsfCreateWidget(); } else { document.getElementById("every-donate-btn-js").addEventListener('load', zsfCreateWidget); } La missioneLa missione della Zig Software Foundation è di promuovere, proteggere e far progredire il linguaggio di programmazione Zig; di supportare e facilitare la crescita di una comunità variegata e internazionale di programmatori Zig; di offrire formazione e direzione ad eventuali studenti, al fine di insegnare alla nuova generazione di programmatori ad essere competenti, etici, e a spronarsi reciprocamente a tenere degli standard alti.ZSF è un'associazione non-profit statunitense 501(c)(3). Rendiconto finanziario, verbali delle riunioni e ulteriopri dettagli sono pubblici e disponibili.Membri del consiglio direttivoAndrew Kelley (Presidente)Josh Wolfe (Segretario)Mason Remaley (Tesoriere)Diventare sponsorDonando alla ZSF, puoi finanziare lo sviluppo del linguaggio di programmazione Zig e il suo ecosistema, che a sua volta porta benefici al resto della comunità open-source. Membri della comunità di Zig hanno scoperto e corretto bug in LLVM, Wine, QEMU, musl libc, GDB e altri progetti.La Zig Software Foundation è una piccola associazione che fa un uso efficiente delle proprie risorse monetarie. Il piano è di rimanere piccoli ed agili, ma abbiamo comunque intenzione di convertire i nostri volontari in collaboratori stipendiati per aiutare a gestire il progetto e velocizzare i progressi verso la versione 1.0. La ZSF è una non-profit proprio per valorizzare le persone. Stiamo cercando di fare in modo che i volontari dell'open source vengano pagati per il proprio tempo.Come donareEcco alcune informazioni utili a donare.EIN84-5105214IndirizzoZig Software Foundation1632 1st Ave #21385New York, NY 10028Alcuni metodi di donazione supportatiEvery (supporta criptovalute!)GitHub SponsorsBenevityTrasferimento bancario (disponibile da ogni istituto che supporta SWIFT, contattateci per ulteriori informazioni)Invio di assegni cartacei per posta (metodo supportato solo negli Stati Uniti)WiseSe hai delle domande o esigenze particolari, non esitare a contattarci all'indirizzo donations@ziglang.org, puoi scriverci in italiano.Aziende sponsorDonazioni monetarieLe seguenti compagnie offrono supporto finanziario diretto alla Zig Software Foundation donando più di 1000$ (USD) al mese. @media (prefers-color-scheme:light) { #zml { filter: invert(); } }'''
