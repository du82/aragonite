["https://ziglang.org/ru-RU/learn/getting-started"]
title = "Начало работы  ⚡  Язык программирования Zig"
full_description = '← Вернуться обратно на Изучение Начало работы Релиз или ночная сборка?Установка Zig Прямое скачивание Настройка PATH в WindowsНастройка PATH в Linux, macOS, BSDМенеджеры пакетов WindowsmacOSLinuxСборка из исходниковРекомендуемые инструменты Подсветка синтаксиса и языковые серверы (LSP)Запуск Hello, World!Следующие шаги Релиз или ночная сборка?Zig еще не достиг версии 1.0, и текущий цикл релизов связан с новыми версиями LLVM, которые выходят примерно раз в шесть месяцев. На практике это означает, что релизы Zig происходят с большими промежутками и быстро устаревают, учитывая текущую скорость разработки.Чтобы оценить Zig, можно воспользоваться релизом, но если вы решите, что вам нравится Zig и захотите в него углубиться, мы рекомендуем обновиться до ночной сборки. В основном потому, что таким образом вам будет легче получать помощь: большинство сообществ и такие сайты, как zig.guide, отслеживают ветку master по указанным выше причинам.Хорошая новость заключается в том, что очень легко переключаться с одной версии Zig на другую или даже иметь несколько версий на системе одновременно: релизы Zig — это автономные архивы, которые можно разместить в любом месте вашей системы.Установка ZigПрямое скачиваниеЭто самый простой способ получения Zig: скачайте пакет Zig для вашей платформы со страницы загрузок, распакуйте его и добавьте в переменную PATH, чтобы zig можно было вызывать из любого места.Настройка PATH в WindowsЧтобы настроить PATH в Windows, выполните один из следующих фрагментов кода в Powershell. Выберите, хотите ли вы применить это изменение на уровне всей системы (необходимо запустить Powershell с правами администратора) или только для текущего пользователя. Убедитесь, что вы правильно указали расположение вашей копии Zig. ; перед C: — это не ошибка.На уровне всей системы (Powershell с правами администратора):[Environment]::SetEnvironmentVariable( "Path", [Environment]::GetEnvironmentVariable("Path", "Machine") + ";C:\your-path\zig-windows-x86_64-your-version", "Machine" ) Только для текущего пользователя (Powershell):[Environment]::SetEnvironmentVariable( "Path", [Environment]::GetEnvironmentVariable("Path", "User") + ";C:\your-path\zig-windows-x86_64-your-version", "User" ) По завершении перезапустите Powershell.Настройка PATH в Linux, macOS, BSDДобавьте расположение исполняемого файла zig в переменную окружения PATH.Это обычно делается добавлением строки export в файл инициализации командной оболочки (например, .profile или .zshrc).export PATH=$PATH:~/path/to/zig По завершении выполните source файла инициализации командной оболочки или просто перезапустите командную оболочку.Менеджеры пакетовWindowsWinGetZig доступен в WinGet.winget install -e --id zig.zig ChocolateyZig доступен на Chocolatey.choco install zig ScoopZig доступен на Scoop.scoop install zig Последняя dev-сборка:scoop bucket add versions scoop install versions/zig-dev macOSHomebrewПоследний релиз:brew install zig MacPortsport install zig LinuxZig также представлен во многих менеджерах пакетов для Linux. Здесь можно найти обновлённый список, но имейте в виду, что некоторые пакеты могут содержать устаревшие версии Zig.Сборка из исходниковЗдесь можно найти больше информации о том, как собрать Zig из исходников на Linux, macOS и Windows.Рекомендуемые инструментыПодсветка синтаксиса и языковые серверы (LSP)Все основные текстовые редакторы поддерживают подсветку синтаксиса для Zig. Некоторые поставляются сразу с ним, для других требуется установка соответствующего плагина.Если вас интересует более глубокая интеграция между Zig и вашим редактором, ознакомьтесь с zigtools/zls.Если вас интересует, что доступно ещё, ознакомьтесь с разделом Инструменты.Запуск Hello, World!Если процесс установки прошёл успешно, вы должны иметь возможность вызвать компилятор Zig из вашей командной оболочки. Давайте проверим это, создав вашу первую программу!Перейдите в директорию вашего проекта и выполните:mkdir hello-world cd hello-world zig init Это должно вывести:info: created build.zig info: created build.zig.zon info: created src/main.zig info: created src/root.zig info: see `zig build --help` for a menu of options Выполнение команды zig build run должно скомпилировать исполняемый файл и запустить его, выведя:All your codebase are belong to us. Run `zig build test` to run the tests. Поздравляем, вы успешно установили Zig!Следующие шагиИзучите дополнительные ресурсы, представленные в разделе Изучение. Не забудьте выбрать документацию для вашей версии Zig (для ночных сборок используйте документацию master). Также рекомендуется ознакомиться с zig.guide для более глубокого изучения языка.Zig — это молодой проект, и, к сожалению, у нас пока нет возможности создать обширную документацию и учебные материалы на все случаи жизни. Поэтому рекомендуется присоединиться к одному из сообществ Zig, чтобы получать помощь в случае затруднений. Также рекомендуем ознакомиться с такими инициативами, какZig SHOWTIME.И в заключение, если Zig вызывает у вас интерес и вы хотите внести свой вклад в его развитие, мы будем признательны за любую поддержку. Рассмотрите возможность сделать пожертвование в Zig Software Foundation , чтобы помочь проекту ещё более активно расти и развиваться.'
year_published = 2025
