title = "Zig 软件基金会  ⚡  Zig 编程语言"
full_description = '''← 返回 主页 Zig 软件基金会 赞助 Zig 软件基金会请考虑进行定期捐赠。维护和支持高质量软件需要持续的努力！ 捐赠 function zsfCreateWidget() { everyDotOrgDonateButton.createButton({ selector: "#zsf-every-donate-btn", nonprofitSlug: "zig-software-foundation-inc", fontSize: "32px", label: "Sponsor" }); everyDotOrgDonateButton.createWidget({ selector: "#zsf-every-donate-btn", nonprofitSlug: "zig-software-foundation-inc", defaultDonationAmount: 10, defaultFrequency: 'monthly' }); // Workaround for https://github.com/everydotorg/donate-button/issues/384 let style = document.createElement('style'); style.innerHTML = '#donation-input { color: black; } #privateNote { color: black }'; document.getElementById("shadow-wrapper").shadowRoot.appendChild(style); } if (window.everyDotOrgDonateButton) { zsfCreateWidget(); } else { document.getElementById("every-donate-btn-js").addEventListener('load', zsfCreateWidget); } 目标说明Zig 软件基金会的使命是促进、保护和发展 Zig 编程语言，支持和促进 Zig 程序员的多元化和国际化社区的发展，并为学生提供教育和指导，教育下一代程序员具备能力，有道德，并相互保持高标准。ZSF 是一家 501(c)(3) 非营利公司。 财务、会议记录和其他细节都是公开的.董事会成员Andrew Kelley (主席)Josh Wolfe (秘书)Mason Remaley (财务主管)赞助活动通过向 ZSF 捐款，你是在资助 Zig 编程语言及其生态系统的开发，从而使广大开源社区受益。Zig 社区成员已经在 LLVM, Wine, QEMU, musl libc, GDB 等项目中提交了大量 bug 的修复。ZSF 是一个小组织，并且有效地利用了货币资源。我们的计划是保持这种方式，但我们确实想把我们的无偿志愿者变成有偿的维护者，以帮助合并拉取请求，使 1.0 的进展更加迅速。ZSF 作为一个非营利性的组织，其目的就是为了造福于人们。我们正在尝试让开源维护者为他们的时间获得报酬。捐赠信息这里有一些有用的信息，可以通过 GitHub 赞助商以外的方式进行捐赠。请确认你所在地的法律，以确定你是否可以从你的税收中扣除捐款。EIN84-5105214地址Zig Software Foundation 1632 1st Ave #21385 New York, NY 10028其他支持的捐赠方式EveryGitHub SponsorsBenevity (如果你的雇主想要捐款，建议使用这个方法！)Bank transfers (包括美国以外的银行，请联系我们了解更多信息)Physical checks (见上述传统邮件地址)Wise如果您有任何问题或特殊需求，请毫不犹豫地与我们联系：donations@ziglang.org。企业赞助商货币捐款以下公司通过捐赠 1000 美元/月以上的方式，为 Zig 软件基金会提供直接的资金支持。 @media (prefers-color-scheme:light) { #zml { filter: invert(); } }'''
