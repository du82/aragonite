["https://ziglang.org/download/0.5.0/release-notes.html"]
title = "0.5.0 Release Notes · The Zig Programming Language"
full_description = '''Zig is a general-purpose programming language designed for robustness, optimality, and maintainability. Zig is aggressively pursuing its goal of overthrowing C as the de facto language for system programming. Zig intends to be so practical that people find themselves using it, because it "just works". This release features 6 months of work and changes from 67 different contributors, spread among 1541 commits. This release of Zig upgrades to LLVM 9. Zig operates in lockstep with LLVM; Zig 0.5.0 is not compatible with LLVM 8. Zig also gains emscripten as a target OS. emscripten cannot self-host yet, but when it can, it will be interesting to explore this as an option for a Zig-in-the-browser sandbox, using WebAssembly. A support table for master branch can be found on the home page. Here the support table for 0.5.0 is reproduced: This release updates to LLVM 9, musl 1.1.23 with patches, and glibc 2.30. This plus updates to the Standard Library means that Zig's (64-bit) RISC-V support has gone from Tier 4 Support to Tier 3 Support in this release. RISC-V is a very flexible target, with features such as atomics, and even integer multiplication being optional. Since Zig does not yet have ability to specify target CPU features, the default set of cross-compilation features are "+a,+c,+d,+f,+m,+relax", which matches Clang. The next step for all these issues is to create test case reductions and then file upstream bug reports. However, I did work with Rich Felker to get musl building with Clang for the RISC-V target, which means that we can do this: Zig 0.5.0 carries a few patches to musl which makes this work. A new musl release is expected soon which contains these patches. To be clear - the above simple example also works in Zig - it's just that all the language features such as f16 are not working, and there is no automated Test Coverage for this target. Although glibc 2.30 gained RISC-V support, Zig is not able to build glibc for this target yet. See #3340 for more details. Looks like it could be as simple as importing a couple more .h files from the glibc source tree.'''
