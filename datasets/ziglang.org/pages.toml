full_description = '''← Назад до Головна Zig Software Foundation Спонсорування Zig Software FoundationБудь ласка, розгляньте регулярну пожертву. Потрібна постійна праця для того щоб підтримувати якісне та надійне програмне забезпечення! Donate function zsfCreateWidget() { everyDotOrgDonateButton.createButton({ selector: "#zsf-every-donate-btn", nonprofitSlug: "zig-software-foundation-inc", fontSize: "32px", label: "Sponsor" }); everyDotOrgDonateButton.createWidget({ selector: "#zsf-every-donate-btn", nonprofitSlug: "zig-software-foundation-inc", defaultDonationAmount: 10, defaultFrequency: 'monthly' }); // Workaround for https://github.com/everydotorg/donate-button/issues/384 let style = document.createElement('style'); style.innerHTML = '#donation-input { color: black; } #privateNote { color: black }'; document.getElementById("shadow-wrapper").shadowRoot.appendChild(style); } if (window.everyDotOrgDonateButton) { zsfCreateWidget(); } else { document.getElementById("every-donate-btn-js").addEventListener('load', zsfCreateWidget); } МісіяМісія Zig Software Foundation — популяризувати, захищати та розвивати мову програмування Zig, підтримувати та сприяти зростанню різноманітної міжнародної спільноти програмістів Zig, а також надавати освіту та керівництво студентам, навчаючи наступне покоління програмісти повинні бути компетентними, етичними та підтримувати один одного високими стандартами.ZSF є некомерційною корпорацією 501(c)(3). Фінанси, протоколи зустрічей та інші деталі доступні для громадськості.Члени радиAndrew Kelley (Президент)Josh Wolfe (Секретар)Mason Remaley (Скарбник)СпонсорствоРоблячи пожертву ZSF, ви фінансуєте розвиток мови програмування Zig та її екосистеми, що, у свою чергу, приносить користь більшій опен-сорс спільноті.Члени спільноти Zig виправили помилки LLVM, Wine, QEMU, musl libc, GDB та інші.ZSF є невеликою організацією і ефективно використовує грошові ресурси. План полягає в тому, щоб продовжувати в тому ж дусі, але ми хочемо перетворити наших неоплачуваних волонтерів на платних супроводжуючих, щоб допомогти об’єднати запити на отримання та швидше просуватися до версії 1.0. Весь сенс того, що ZSF є некомерційним, полягає в тому, щоб приносити користь людям. Ми намагаємося платити людям, які супроводжують програми з відкритим кодом.Інформація про пожертвиОсь корисна інформація для пожертвувань через інші засоби, окрім спонсорів GitHub. Перевірте місцеве законодавство, щоб дізнатися, чи можете ви вираховувати пожертви зі своїх податків.EIN84-5105214АдресаZig Software Foundation1632 1st Ave #21385New York, NY 10028Підтримуються додаткові методи пожертвуваньEveryGitHub SponsorsBenevity (рекомендується, якщо ваш роботодавець перераховує пожертви!)Банківські перекази (у тому числі з-за меж США, зв’яжіться з нами для отримання додаткової інформації)Фізичні чеки (див. загальну поштову адресу, указану вище)WiseБудь ласка, не соромтеся зв’язуватися з нами за адресою donations@ziglang.org, якщо у вас є запитання чи особливі потреби.Корпоративні спонсориГрошові пожертвиНаступні компанії надають пряму фінансову підтримку фонду Zig Software, жертвуючи понад 1000 доларів США на місяць. @media (prefers-color-scheme:light) { #zml { filter: invert(); } }'''
