title = "Система сборки Zig  ⚡  Язык программирования Zig"
full_description = '← Вернуться обратно на Изучение Система сборки Zig Когда стоит использовать систему сборки Zig?Начало работы Простое исполняемое приложениеУстановка артефактов сборкиЭтап запуска приложенияОсновы Опции, задаваемые пользователемСтандартные параметры конфигурацииУсловная компиляцияСтатические библиотекиДинамические библиотекиТестированиеПодключение системных библиотекГенерация файлов Запуск системных инструментовЗапуск инструментов проектаСоздание ресурсов для @embedFileГенерация исходного кода ZigРабота с одним или несколькими сгенерированными файламиМутирование исходных файловПолезные примеры Сборка для нескольких целевых платформ с целью создания релиза Когда стоит использовать систему сборки Zig?Для выполнения основных задач обычно достаточно команд zig build-exe, zig build-lib, zig build-obj и zig test. Тем не менее, в некоторых случаях проекту может понадобиться дополнительный уровень абстракции для более эффективного управления сложностью процесса сборки.Система сборки Zig может значительно упростить процесс разработки и сборки в следующих ситуациях:Если команды в терминале становятся слишком громоздкими и сложными для запоминания, использование системы сборки позволит сохранить их в одном месте.При наличии множества компонентов или этапов сборки Zig поможет организовать процесс, разбив его на более управляемые части.Если вы хотите сократить время сборки, система сборки Zig поддерживает конкурентность и кэширование, что значительно ускоряет процесс.Zig позволяет легко задавать параметры конфигурации для вашего проекта, что делает его более гибким и адаптируемым к различным условиям.Если процесс сборки варьируется в зависимости от целевой системы или других параметров, Zig поможет вам настроить его под конкретные нужды.При наличии зависимостей от других проектов система сборки Zig упростит управление ими и обеспечит правильную интеграцию.Если вы стремитесь уменьшить зависимость от таких инструментов, как CMake, Make, Shell, MSVC или Python, Zig поможет сделать ваш проект более универсальным и доступным.Если вы хотите упростить процесс создания пакетов для использования другими разработчиками, система сборки Zig обеспечит удобные механизмы для этого.С помощью Zig вы сможете предложить стандартизированный подход к сборке проекта, что облегчит интеграцию с различными IDE и инструментами разработки.Если хотя бы один из перечисленных пунктов имеет отношение к вашему проекту, применение системы сборки Zig может существенно облегчить процесс разработки.Начало работыПростое исполняемое приложениеЭтот скрипт сборки создаёт исполняемый файл из Zig-файла, который содержит определение публичной функции main.hello.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("hello.zig"), .target = b.host, }); b.installArtifact(exe); }Shell$ zig build--summary all Build Summary: 3/3 steps succeeded install cached └─ install hello cached └─ zig build-exe hello Debug native cached 66ms MaxRSS:36M Установка артефактов сборкиСистема сборки Zig, подобно большинству других систем сборки, моделирует проект как направленный ациклический граф (DAG), где этапы выполняются независимо и параллельно.По умолчанию основным этапом в графе является этап Установки (Install), который предназначен для копирования артефактов сборки в их конечное местоположение. Этот этап не имеет зависимостей, поэтому при выполнении команды zig build ничего не произойдёт. Скрипт сборки проекта должен дополнительно указать, какие элементы необходимо установить, и именно это делает вызов функции installArtifact, представленный выше.Вывод├── build.zig ├── hello.zig ├── .zig-cache └── zig-out └── bin └── hello В этом выводе можно увидеть две сгенерированные директории: .zig-cache и zig-out. Первая из них содержит файлы, которые ускоряют последующие сборки. Эти файлы не предназначены для добавления в систему контроля версий, и данную директорию можно удалить в любое время без каких-либо негативных последствий.Вторая директория, zig-out, является целевой директорией установки. Она соответствует стандартной структуре файловой системы. Выбор этой директории осуществляется не проектом, а пользователем команды zig build с помощью флага --prefix (сокращенно -p).Вы, как разработчик проекта, определяете, что будет помещено в эту директорию, но пользователь решает, куда установить её на своём компьютере. Скрипт сборки не должен жёстко задавать пути вывода, так как это может нарушить кэширование, конкурентное выполнение и совместимость, а также вызвать недовольство у конечного пользователя.Этап запуска приложенияОбычно этап Запуска (Run) добавляют, чтобы упростить процесс запуска основного приложения непосредственно через команду сборки.hello.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("hello.zig"), .target = b.host, }); b.installArtifact(exe); const run_exe = b.addRunArtifact(exe); const run_step = b.step("run", "Run the application"); run_step.dependOn(&run_exe.step); }Shell$ zig buildrun --summary all Hello World! Build Summary: 3/3 steps succeeded run success └─ run hello success 14ms MaxRSS:1M └─ zig build-exe hello Debug native cached 44ms MaxRSS:36M ОсновыОпции, задаваемые пользователемМожно использовать b.option, чтобы сделать скрипт сборки настраиваемым для конечных пользователей и других проектов, которые используют данный проект в качестве пакета.build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const windows = b.option(bool, "windows", "Target Microsoft Windows") orelse false; const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("example.zig"), .target = b.resolveTargetQuery(.{ .os_tag = if (windows) .windows else null, }), }); b.installArtifact(exe); }Shell$ zig build--help Usage: /home/ci/deps/zig-linux-x86_64-0.13.0/zig build [steps] [options] Steps: install (default) Copy build artifacts to prefix path uninstall Remove build artifacts from prefix path General Options: -p, --prefix [path] Where to install files (default: zig-out) --prefix-lib-dir [path] Where to install libraries --prefix-exe-dir [path] Where to install executables --prefix-include-dir [path] Where to install C header files --release[=mode] Request release mode, optionally specifying a preferred optimization mode: fast, safe, small -fdarling, -fno-darling Integration with system-installed Darling to execute macOS programs on Linux hosts (default: no) -fqemu, -fno-qemu Integration with system-installed QEMU to execute foreign-architecture programs on Linux hosts (default: no) --glibc-runtimes [path] Enhances QEMU integration by providing glibc built for multiple foreign architectures, allowing execution of non-native programs that link with glibc. -frosetta, -fno-rosetta Rely on Rosetta to execute x86_64 programs on ARM64 macOS hosts. (default: no) -fwasmtime, -fno-wasmtime Integration with system-installed wasmtime to execute WASI binaries. (default: no) -fwine, -fno-wine Integration with system-installed Wine to execute Windows programs on Linux hosts. (default: no) -h, --help Print this help and exit -l, --list-steps Print available steps --verbose Print commands before executing them --color [auto|off|on] Enable or disable colored error messages --prominent-compile-errors Buffer compile errors and display at end --summary [mode] Control the printing of the build summary all Print the build summary in its entirety new Omit cached steps failures (Default) Only print failed steps none Do not print the build summary -j<N> Limit concurrent jobs (default is to use all CPU cores) --maxrss <bytes> Limit memory usage (default is to use available memory) --skip-oom-steps Instead of failing, skip steps that would exceed --maxrss --fetch Exit after fetching dependency tree Project-Specific Options: -Dwindows=[bool] Target Microsoft Windows System Integration Options: --search-prefix [path] Add a path to look for binaries, libraries, headers --sysroot [path] Set the system root directory (usually /) --libc [file] Provide a file which specifies libc paths --system [pkgdir] Disable package fetching; enable all integrations -fsys=[name] Enable a system integration -fno-sys=[name] Disable a system integration Available System Integrations: Enabled: (none) - Advanced Options: -freference-trace[=num] How many lines of reference trace should be shown per compile error -fno-reference-trace Disable reference trace --build-file [file] Override path to build.zig --cache-dir [path] Override path to local Zig cache directory --global-cache-dir [path] Override path to global Zig cache directory --zig-lib-dir [arg] Override path to Zig lib directory --build-runner [file] Override path to build runner --seed [integer] For shuffling dependency traversal order (default: random) --debug-log [scope] Enable debugging the compiler --debug-pkg-config Fail if unknown pkg-config flags encountered --verbose-link Enable compiler debug output for linking --verbose-air Enable compiler debug output for Zig AIR --verbose-llvm-ir[=file] Enable compiler debug output for LLVM IR --verbose-llvm-bc=[file] Enable compiler debug output for LLVM BC --verbose-cimport Enable compiler debug output for C imports --verbose-cc Enable compiler debug output for C compilation --verbose-llvm-cpu-features Enable compiler debug output for LLVM CPU features example.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); }Обратите внимание на эти строки:Project-Specific Options: -Dwindows=[bool] Target Microsoft Windows Эта секция меню помощи создаётся автоматически в результате выполнения build.zig, чтобы пользователи могли ознакомиться с параметрами конфигурации скрипта сборки.Стандартные параметры конфигурацииРанее мы применяли булев флаг для обозначения сборки под Windows. Однако, существует более эффективный подход.Большинство проектов стремятся предоставить возможность изменять целевую платформу и параметры оптимизации. Для стандартизации названий этих параметров Zig предлагает вспомогательные функции standardTargetOptions и standardOptimizeOption.Стандартные параметры для выбора целевой платформы позволяют пользователю, выполняющему команду zig build, указать, для какой платформы будет осуществляться сборка проекта. По умолчанию поддерживаются все платформы, и если выбор не сделан, проект будет собран для текущей системы. Существуют дополнительные опции для ограничения списка поддерживаемых платформ.Параметры оптимизации по умолчанию позволяют пользователю выбрать один из следующих режимов: Debug, ReleaseSafe, ReleaseFast и ReleaseSmall. Поскольку ни один из этих режимов по умолчанию не является предпочтительным, пользователю следует самостоятельно решить, какой из них использовать.hello.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const target = b.standardTargetOptions(.{}); const optimize = b.standardOptimizeOption(.{}); const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("hello.zig"), .target = target, .optimize = optimize, }); b.installArtifact(exe); }Shell$ zig build-Dtarget=x86_64-windows -Doptimize=ReleaseSmall --summary all Build Summary: 3/3 steps succeeded install cached └─ install hello cached └─ zig build-exe hello ReleaseSmall x86_64-windows cached 44ms MaxRSS:36M Теперь меню --help содержит больше пунктов:Project-Specific Options: -Dtarget=[string] The CPU architecture, OS, and ABI to build for -Dcpu=[string] Target CPU features to add or subtract -Doptimize=[enum] Prioritize performance, safety, or binary size (-O flag) Supported Values: Debug ReleaseSafe ReleaseFast ReleaseSmall Хотя эти параметры можно задать напрямую с помощью b.option, данный API предоставляет стандартные наименования для часто используемых настроек.Обратите внимание на вывод в терминале, где мы указали -Dtarget=x86_64-windows -Doptimize=ReleaseSmall. В отличие от первого примера, теперь в целевой директории появляются дополнительные файлы:zig-out/ └── bin └── hello.exe Условная компиляцияДля передачи параметров из скрипта сборки в Zig-код вашего проекта используйте Options.app.zigconst std = @import("std"); const config = @import("config"); const semver = std.SemanticVersion.parse(config.version) catch unreachable; extern fn foo_bar() void; pub fn main() !void { if (semver.major < 1) { @compileError("too old"); } std.debug.print("version: {s}\n", .{config.version}); if (config.have_libfoo) { foo_bar(); } } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const exe = b.addExecutable(.{ .name = "app", .root_source_file = b.path("app.zig"), .target = b.host, }); const version = b.option([]const u8, "version", "application version string") orelse "0.0.0"; const enable_foo = detectWhetherToEnableLibFoo(); const options = b.addOptions(); options.addOption([]const u8, "version", version); options.addOption(bool, "have_libfoo", enable_foo); exe.root_module.addOptions("config", options); b.installArtifact(exe); } fn detectWhetherToEnableLibFoo() bool { return false; }Shell$ zig build-Dversion=1.2.3 --summary all Build Summary: 4/4 steps succeeded install cached └─ install app cached └─ zig build-exe app Debug native cached 33ms MaxRSS:36M └─ options cached В этом примере данные, предоставленные через @import("config"), известны на этапе компиляции, что предотвращает срабатывание @compileError. Если бы мы передали -Dversion=0.2.3 или пропустили эту опцию, то компиляция app.zig завершилась бы ошибкой "too old".Статические библиотекиЭтот скрипт сборки создаёт статическую библиотеку из кода на Zig, а затем и исполняемый файл из другого кода на Zig, который использует эту библиотеку.fizzbuzz.zigexport fn fizzbuzz(n: usize) ?[*:0]const u8 { if (n % 5 == 0) { if (n % 3 == 0) { return "fizzbuzz"; } else { return "fizz"; } } else if (n % 3 == 0) { return "buzz"; } return null; } demo.zigconst std = @import("std"); extern fn fizzbuzz(n: usize) ?[*:0]const u8; pub fn main() !void { const stdout = std.io.getStdOut(); var bw = std.io.bufferedWriter(stdout.writer()); const w = bw.writer(); for (0..100) |n| { if (fizzbuzz(n)) |s| { try w.print("{s}\n", .{s}); } else { try w.print("{d}\n", .{n}); } } try bw.flush(); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const target = b.standardTargetOptions(.{}); const optimize = b.standardOptimizeOption(.{}); const libfizzbuzz = b.addStaticLibrary(.{ .name = "fizzbuzz", .root_source_file = b.path("fizzbuzz.zig"), .target = target, .optimize = optimize, }); const exe = b.addExecutable(.{ .name = "demo", .root_source_file = b.path("demo.zig"), .target = target, .optimize = optimize, }); exe.linkLibra'
