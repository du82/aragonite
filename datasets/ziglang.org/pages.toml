full_description = '''← Back to Home Zig Software Foundation Sponsoring the Zig Software FoundationPlease consider a recurring donation. It takes ongoing labor to maintain and support high-quality software! Donate function zsfCreateWidget() { everyDotOrgDonateButton.createButton({ selector: "#zsf-every-donate-btn", nonprofitSlug: "zig-software-foundation-inc", fontSize: "32px", label: "Sponsor" }); everyDotOrgDonateButton.createWidget({ selector: "#zsf-every-donate-btn", nonprofitSlug: "zig-software-foundation-inc", defaultDonationAmount: 10, defaultFrequency: 'monthly' }); // Workaround for https://github.com/everydotorg/donate-button/issues/384 let style = document.createElement('style'); style.innerHTML = '#donation-input { color: black; } #privateNote { color: black }'; document.getElementById("shadow-wrapper").shadowRoot.appendChild(style); } if (window.everyDotOrgDonateButton) { zsfCreateWidget(); } else { document.getElementById("every-donate-btn-js").addEventListener('load', zsfCreateWidget); } Mission statementThe mission of the Zig Software Foundation is to promote, protect, and advance the Zig programming language, to support and facilitate the growth of a diverse and international community of Zig programmers, and to provide education and guidance to students, teaching the next generation of programmers to be competent, ethical, and to hold each other to high standards.ZSF is a 501(c)(3) non-profit corporation. Finances, meeting minutes, and other details are available to the public.Board membersAndrew Kelley (President)Josh Wolfe (Secretary)Mason Remaley (Treasurer)SponsorshipBy donating to ZSF, you are funding development of the Zig Programming Language and its ecosystem, which in turn benefits the greater open source community. Zig community members have landed bug fixes in LLVM, Wine, QEMU, musl libc, GDB and others.ZSF is a small organization and makes efficient use of monetary resources. The plan is to keep it that way, but we do want to turn our unpaid volunteers into paid maintainers to help merge pull requests and make swifter progress towards 1.0. The whole point of ZSF being non-profit is to benefit people. We're trying to get open source maintainers paid for their time.Donation informationHere's useful information to donate through means other than GitHub Sponsors. Make sure to check your local law to see if you can deduct donations from your taxes.EIN84-5105214AddressZig Software Foundation1632 1st Ave #21385New York, NY 10028Additional donation methods supportedEveryGitHub SponsorsBenevity (recommended if your employer matches donations!)Bank transfers (including from outside of the US, contact us for more info)Physical checks (see the snail mail address listed above)WisePlease don't hesitate to contact us at donations@ziglang.org if you have questions or specific needs.Corporate sponsorsMonetary donationsThe following companies are providing direct financial support to the Zig Software foundation by donating more than $1000/mo. @media (prefers-color-scheme:light) { #zml { filter: invert(); } }'''
