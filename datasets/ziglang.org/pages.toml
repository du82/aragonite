full_description = "← Ir a Inicio AprenderEsta sección incluye recursos útiles que te llevan de no saber nada a entender la filosofía del lenguaje. Documentación Inestable (master) Referencia del Lenguaje Documentación de la Librería Estándar Estable Más Reciente (0.13.0) Referencia del Lenguaje Documentación de la Librería Estándar GuíasEsta sección eventualmente va a estar incluida en la documentación de la librería estándar de Zig, pero por ahora puedes consultarla aquí.El sistema de Armado de Zig Introducción al sistema de armado de Zig(Build System).IntroducciónEstos recursos de introducción a Zig están orientados a programadores con diferentes niveles de experiencia.Revisión a fondo Esta es una vista a fondo de las características de Zig desde la perspectiva de un programador de sistemas.¿Por qué Zig, cuando ya existen C++, D, y Rust? Una introducción a Zig para desarrolladores de C++, D y Rust.Ejemplos de código Una lista de ejemplos que muestran como luce el código Zig.Herramientas Una lista de herramientas útiles al escribir código Zig.Primeros pasosSi estás listo para comenzar a programar con Zig, esta guía te ayudará a poner en marcha el ambiente necesario.Primeros pasosRecursos de aprendizaje en líneaIntroducción a Zig: un libro basado en proyectoszig.guide Una introducción estructurada a Zig por Sobeston.Ziglings Aprende Zig corrigiendo pequeños errores en programas.Zig en Exercism Resuelve ejercicios de código y ten mentoría para desarrollar fluencia en Zig.Aprende Zig Una introducción corta a Zig para desarrolladores que vienen de lenguajes con recolector-de-basura.Videos relevantes y artículos de blogLa ruta a Zig 1.0 [video] Video por Andrew Kelley introducción a Zig y su filosofía.La nueva relación de Zig con LLVM Un artículo sobre el trabajo de construir el compilador auto-hospedado de Zig, también incluido en un artículo de lwn.net."
