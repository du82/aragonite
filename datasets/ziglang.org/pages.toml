title = "Zig Software Foundation  ⚡  El Lenguaje de Programación Zig"
full_description = '''← Ir a Inicio Zig Software Foundation Apoya a la Zig Software FoundationPor favor, considera hacer una donación recurrente. ¡Mantener y respaldar software de alta calidad requiere de un trabajo constante! Donate function zsfCreateWidget() { everyDotOrgDonateButton.createButton({ selector: "#zsf-every-donate-btn", nonprofitSlug: "zig-software-foundation-inc", fontSize: "32px", label: "Sponsor" }); everyDotOrgDonateButton.createWidget({ selector: "#zsf-every-donate-btn", nonprofitSlug: "zig-software-foundation-inc", defaultDonationAmount: 10, defaultFrequency: 'monthly' }); // Workaround for https://github.com/everydotorg/donate-button/issues/384 let style = document.createElement('style'); style.innerHTML = '#donation-input { color: black; } #privateNote { color: black }'; document.getElementById("shadow-wrapper").shadowRoot.appendChild(style); } if (window.everyDotOrgDonateButton) { zsfCreateWidget(); } else { document.getElementById("every-donate-btn-js").addEventListener('load', zsfCreateWidget); } MisiónLa misión de la Zig Software Foundation es la de promover, proteger y desarrollar el lenguaje de programación Zig, de facilitar y contribuir al crecimiento de una comunidad de programadores diversa e internacional y de proveer educación y orientación a estudiantes; enseñándole a las nuevas generaciones de programadores a ser competentes, éticas y a exigirse un alto estándar de calidad.La ZSF es una corporación 501(c)(3) sin ánimo de lucro. Sus finanzas, minutas de reuniones y otros detalles están disponibles al público.Miembros de la junta directivaAndrew Kelley (Presidente)Josh Wolfe (Secretario)Mason Remaley (Tesorero)MecenazgoAl donar a la ZSF estás financiando el desarrollo del lenguaje de programación Zig y su ecosistema, que a su vez beneficia a la comunidad open source en general. Los miembros de la comunidad de Zig han contribuido con la solución de defectos en proyectos como LLVM, Wine, QEMU, musl libc o GDB, entre otros.La ZSF es una organización pequeña que hace un uso eficiente de sus recursos monetarios. El plan es continuar de esta forma, pero al mismo tiempo queremos convertir a nuestros voluntarios en colaboradores pagados que ayuden a integrar pull requests y a agilizar los progresos hacia la versión 1.0. El propósito de la ZSF como organización sin ánimo de lucro es beneficiar al público. Intentamos que los colaboradores open source reciban un pago por su tiempo.Información sobre donacionesAdemás de GitHub Sponsors, hay más formas de poder realizar donaciones. Asegúrate de revisar la ley local vigente de tu lugar de residencia para saber si tus donativos son deducibles de impuestos.Número de Identificación del Empleador (EIN)84-5105214DirecciónZig Software Foundation1632 1st Ave #21385New York, NY 10028Métodos de donación adicionalesEveryGitHub SponsorsBenevity (¡recomendado en caso de que tu empleador iguale donativos!)Transferencias bancarias (contáctanos si vives fuera de Estados Unidos para más información)Cheques físicos (la dirección postal es la indicada arriba)WiseNo dudes en contactarnos en donations@ziglang.org si tienes preguntas o necesidades específicas.Mecenas corporativosDonativos monetariosLas empresas a continuación proveen apoyo económico directo a la Zig Software Foundation donando al menos $1000 USD al mes. @media (prefers-color-scheme:light) { #zml { filter: invert(); } }'''
