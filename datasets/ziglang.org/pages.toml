title = "Sistema de Armado de Zig  ⚡  El Lenguaje de Programación Zig"
full_description = '← Ir a Aprender Sistema de Armado de Zig ¿Cómo sacarle provecho al Sistema de Armado(build system) de Zig?Iniciando Un ejecutable sencilloInstalar artefactos armadosAñadir un paso útil para ejecutar la AplicaciónLo Básico Opciones dadas por el usuarioOpciones estándar de configuraciónOpciones para compilación condicionalBiblioteca estáticaBiblioteca estáticaPruebasEnlazar hacia bibliotecas del sistemaGenerar archivos Ejecutar herramientas del sistemaEjecutar herramientas del proyectoProducir insumos para @embedFileGenerar código fuente ZigTratar con uno o más archivos generadosMutar archivos directamente(in place)Ejemplos útiles Armar múltiples arquitecturas al crear una versión ¿Cómo sacarle provecho al Sistema de Armado(build system) de Zig?Los comandos fundamentales zig build-exe, zig build-lib, zig build-obj, y zig test en el mayor de los casos son suficientes. Sin embargo, hay ocasiones en las que un proyecto necesita otra capa de abstracción para manejar la complejidad de construir desde las fuentes.Por ejemplo, puede que alguna de estas situaciones aplique:La línea de comandos se hace muy larga y difícil de manejar, y deseas un lugar donde quede escrita.Quieres armar muchos artefactos, o el proceso de armado contiene muchos pasos.Quieres aprovechar concurrencia y caché para reducir el tiempo de armado.Quieres exponer las opciones de configuración para el proyecto.El proceso de armado es diferente dependiendo del sistema objetivo(target) y otras opciones.Tienes dependencias de otros proyectos.Quieres evitar dependencias innecesarias con cmake, make, shell, msvc, python, etc., haciendo tu proyecto asequible a más contribuyentesQuieres proveer un paquete que otros puedan consumir.Quieres proveer una forma estandarizada para que herramientas tales como IDEs puedan entender semánticamente cómo armar el proyecto.Si cualquiera de estas aplican, el proyecto se beneficiará al usar el sistema de armado de Zig.IniciandoUn ejecutable sencilloEste guión de armado(build script) crea un ejecutable desde un archivo Zig que contiene la definición de una función pública main.hello.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("hello.zig"), .target = b.host, }); b.installArtifact(exe); }Shell$ zig build--summary all Build Summary: 3/3 steps succeeded install cached └─ install hello cached └─ zig build-exe hello Debug native cached 66ms MaxRSS:36M Instalar artefactos armadosEl sistema de armado de Zig, como la mayoría de sistemas de armado se basa en modelar el proyecto como un grafo acíclico dirigido(DAG) de pasos que son independientes y se ejecutan concurrentemente.De forma predeterminada el paso principal en el grafo es el paso Install, cuyo propósito es copiar los artefactos en el lugar donde deberían quedar. El paso de instalación comienza sin dependencias, y por lo tanto nada sucederá cuando se ejecute zig build. El guión de armado de un proyecto debe incluir el conjunto de cosas a instalar, que es lo que hace la función installArtifact.Resultado├── build.zig ├── hello.zig ├── .zig-cache └── zig-out └── bin └── hello Hay dos directorios generados en este resultado: .zig-cache y zig-out. El primero contiene archivos que harán subsecuentes armados más rápidos, aunque estos archivos no se espera que estén incluidos en el control de versiones(source-control) y este directorio puede eliminarse completamente en cualquier momento sin consecuencias.El segundo, zig-out, es un "prefijo de instalación". Se mapea al concepto de la jerarquía del sistema estándar de archivos. Este directorio no lo elige el proyecto y si por el usuario de zig build con la opción bandera(flag) --prefix (-p en corto).Tú, como el mantenedor del proyecto elige lo que se debe colocar en este directorio, pero el usuario elige dónde instalarlo en su sistema. El guión de armado no puede establecer los paths de salida porque esto rompería el caché, la concurrencia y la componibilidad molestando al usuario final.Añadir un paso útil para ejecutar la AplicaciónEs común añadir el paso Run para ofrecer una forma de ejecutar nuestra aplicación directamente desde el comando de armado.hello.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("hello.zig"), .target = b.host, }); b.installArtifact(exe); const run_exe = b.addRunArtifact(exe); const run_step = b.step("run", "Run the application"); run_step.dependOn(&run_exe.step); }Shell$ zig buildrun --summary all Hello World! Build Summary: 3/3 steps succeeded run success └─ run hello success 14ms MaxRSS:1M └─ zig build-exe hello Debug native cached 44ms MaxRSS:36M Lo BásicoOpciones dadas por el usuarioUse b.option para hacer que el guión de armado sea configurable para usuarios finales y otros proyectos que dependan del proyecto como un paquete.build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const windows = b.option(bool, "windows", "Target Microsoft Windows") orelse false; const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("example.zig"), .target = b.resolveTargetQuery(.{ .os_tag = if (windows) .windows else null, }), }); b.installArtifact(exe); }Shell$ zig build--help Usage: /home/ci/deps/zig-linux-x86_64-0.13.0/zig build [steps] [options] Steps: install (default) Copy build artifacts to prefix path uninstall Remove build artifacts from prefix path General Options: -p, --prefix [path] Where to install files (default: zig-out) --prefix-lib-dir [path] Where to install libraries --prefix-exe-dir [path] Where to install executables --prefix-include-dir [path] Where to install C header files --release[=mode] Request release mode, optionally specifying a preferred optimization mode: fast, safe, small -fdarling, -fno-darling Integration with system-installed Darling to execute macOS programs on Linux hosts (default: no) -fqemu, -fno-qemu Integration with system-installed QEMU to execute foreign-architecture programs on Linux hosts (default: no) --glibc-runtimes [path] Enhances QEMU integration by providing glibc built for multiple foreign architectures, allowing execution of non-native programs that link with glibc. -frosetta, -fno-rosetta Rely on Rosetta to execute x86_64 programs on ARM64 macOS hosts. (default: no) -fwasmtime, -fno-wasmtime Integration with system-installed wasmtime to execute WASI binaries. (default: no) -fwine, -fno-wine Integration with system-installed Wine to execute Windows programs on Linux hosts. (default: no) -h, --help Print this help and exit -l, --list-steps Print available steps --verbose Print commands before executing them --color [auto|off|on] Enable or disable colored error messages --prominent-compile-errors Buffer compile errors and display at end --summary [mode] Control the printing of the build summary all Print the build summary in its entirety new Omit cached steps failures (Default) Only print failed steps none Do not print the build summary -j<N> Limit concurrent jobs (default is to use all CPU cores) --maxrss <bytes> Limit memory usage (default is to use available memory) --skip-oom-steps Instead of failing, skip steps that would exceed --maxrss --fetch Exit after fetching dependency tree Project-Specific Options: -Dwindows=[bool] Target Microsoft Windows System Integration Options: --search-prefix [path] Add a path to look for binaries, libraries, headers --sysroot [path] Set the system root directory (usually /) --libc [file] Provide a file which specifies libc paths --system [pkgdir] Disable package fetching; enable all integrations -fsys=[name] Enable a system integration -fno-sys=[name] Disable a system integration Available System Integrations: Enabled: (none) - Advanced Options: -freference-trace[=num] How many lines of reference trace should be shown per compile error -fno-reference-trace Disable reference trace --build-file [file] Override path to build.zig --cache-dir [path] Override path to local Zig cache directory --global-cache-dir [path] Override path to global Zig cache directory --zig-lib-dir [arg] Override path to Zig lib directory --build-runner [file] Override path to build runner --seed [integer] For shuffling dependency traversal order (default: random) --debug-log [scope] Enable debugging the compiler --debug-pkg-config Fail if unknown pkg-config flags encountered --verbose-link Enable compiler debug output for linking --verbose-air Enable compiler debug output for Zig AIR --verbose-llvm-ir[=file] Enable compiler debug output for LLVM IR --verbose-llvm-bc=[file] Enable compiler debug output for LLVM BC --verbose-cimport Enable compiler debug output for C imports --verbose-cc Enable compiler debug output for C compilation --verbose-llvm-cpu-features Enable compiler debug output for LLVM CPU features example.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); }Por favor fija tu atención a estas líneas:Project-Specific Options: -Dwindows=[bool] Target Microsoft Windows Esta parte del menú de ayuda es auto-generada basada en la ejecución de la lógica de build.zig. Los usuarios pueden descubrir las opciones de configuración del guión de armado de esta forma.Opciones estándar de configuraciónPreviamente usamos la bandera booleana para indicar el armado para Windows. Sin embargo, podemos hacerlo mejor.La mayoría de proyectos desean ofrecer la habilidad de cambiar el objetivo(arquitectura objetivo) y los ajustes de optimización. Para estimular la convención de nombramiento estándar de estas opciones Zig provee las funciones de ayuda standardTargetOptions y standardOptimizeOption.Las opciones estándar de arquitectura le permiten a la persona que ejecuta zig build elegir la arquitectura para generar. De forma predeterminada, se permite cualquier arquitectura y no elegir significa apuntar al sistema en el que se ejecuta(host system). Se proveen otras opciones para restringir las arquitecturas soportadas.Las opciones de optimizaciones estándar le permiten a la persona que ejecuta zig build seleccionar entre Debug, ReleaseSafe, ReleaseFast, y ReleaseSmall. De forma predeterminada ninguna de las opciones versión(release) se considera una opción preferible por el guión de armado, y el usuario debe tomar una decisión para crear una versión.hello.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const target = b.standardTargetOptions(.{}); const optimize = b.standardOptimizeOption(.{}); const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("hello.zig"), .target = target, .optimize = optimize, }); b.installArtifact(exe); }Shell$ zig build-Dtarget=x86_64-windows -Doptimize=ReleaseSmall --summary all Build Summary: 3/3 steps succeeded install cached └─ install hello cached └─ zig build-exe hello ReleaseSmall x86_64-windows cached 44ms MaxRSS:36M Ahora nuestro menú --help contiene más entradas:Project-Specific Options: -Dtarget=[string] The CPU architecture, OS, and ABI to build for -Dcpu=[string] Target CPU features to add or subtract -Doptimize=[enum] Prioritize performance, safety, or binary size (-O flag) Supported Values: Debug ReleaseSafe ReleaseFast ReleaseSmall Es totalmente posible crear estas opciones vía b.option directamente, pero este API provee una convención comúnmente usada para nombrar estas opciones frecuentemente usadas.En nuestra salida de la terminal, observa que pasamos -Dtarget=x86_64-windows -Doptimize=ReleaseSmall. Comparado con el primer ejemplo, ahora vemos archivos diferentes en el prefijo de instalación(installation prefix):zig-out/ └── bin └── hello.exe Opciones para compilación condicionalPara pasar opciones desde el guión de armado y en el código del proyecto Zig, usa el paso Options.app.zigconst std = @import("std"); const config = @import("config"); const semver = std.SemanticVersion.parse(config.version) catch unreachable; extern fn foo_bar() void; pub fn main() !void { if (semver.major < 1) { @compileError("too old"); } std.debug.print("version: {s}\n", .{config.version}); if (config.have_libfoo) { foo_bar(); } } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const exe = b.addExecutable(.{ .name = "app", .root_source_file = b.path("app.zig"), .target = b.host, }); const version = b.option([]const u8, "version", "application version string") orelse "0.0.0"; const enable_foo = detectWhetherToEnableLibFoo(); const options = b.addOptions(); options.addOption([]const u8, "version", version); options.addOption(bool, "have_libfoo", enable_foo); exe.root_module.addOptions("config", options); b.installArtifact(exe); } fn detectWhetherToEnableLibFoo() bool { return false; }Shell$ zig build-Dversion=1.2.3 --summary all Build Summary: 4/4 steps succeeded install cached └─ install app cached └─ zig build-exe app Debug native cached 33ms MaxRSS:36M └─ options cached En este ejemplo, el dato proveído por @import("config") se sabe en tiempo de compilación (comptime-known), previendo que se lance @compileError. Si hubiéramos pasado la opción -Dversion=0.2.3 u omitido la opción, hubiéramos visto fallar la compilación de app.zig fallar con el error "too old".Biblioteca estáticaEste guión de armado crea una biblioteca estática de código Zig, y también un ejecutable de otro código Zig que la consume.fizzbuzz.zigexport fn fizzbuzz(n: usize) ?[*:0]const u8 { if (n % 5 == 0) { if (n % 3 == 0) { return "fizzbuzz"; } else { return "fizz"; } } else if (n % 3 == 0) { return "buzz"; } return null; } demo.zigconst std = @import("std"); extern fn fizzbuzz(n: usize) ?[*:0]const u8; pub fn main() !void { const stdout = std.io.getStdOut(); var bw = std.io.bufferedWriter(stdout.writer()); const w = bw.writer(); for (0..100) |n| { if (fizzbuzz(n)) |s| { try w.print("{s}\n", .{s}); } else { try w.print("{d}\n", .{n}); } } try bw.flush(); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const target = b.standardTargetOptions(.{}); const optimize = b.standardOptimizeOption(.{}); const libfizzbuzz = b.addStaticLibrary(.{ .name = "fizzbuzz", .root_source_file = b.path("fizzbuzz.zig"), .target = target, .optimize = optimize, }); const exe = b.addExecutable(.{ .name = "demo", .root_source_file = b.path("demo.zig"), .target = target, .optimize = optimize, }); exe.linkLibrary(libfizzbuzz); b.installArtifact(libfizzbuzz); if (b.option(bool, "enable-demo", "install the demo too") orelse false) { b.installArtifact(exe); } }Shell$ zig build--summary all Build Summary: 3/3 steps succeeded install cached └─ install fizzbuzz cached └─ zig build-lib fizzbuzz Debug native cached 56ms MaxRSS:36M En este caso, solamente se instala la librería e'
