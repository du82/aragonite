["https://ziglang.org/de-DE/zsf"]
title = "Zig Software Foundation  ⚡  Zig Programmiersprache"
full_description = '''← Zurück zu Home Zig Software Foundation Unterstütze die Zig Software FoundationBitte denke über eine regelmäßige Spende nach. Die Wartung und Unterstützung hochwertiger Software erfordert kontinuierliche Arbeit! Donate function zsfCreateWidget() { everyDotOrgDonateButton.createButton({ selector: "#zsf-every-donate-btn", nonprofitSlug: "zig-software-foundation-inc", fontSize: "32px", label: "Sponsor" }); everyDotOrgDonateButton.createWidget({ selector: "#zsf-every-donate-btn", nonprofitSlug: "zig-software-foundation-inc", defaultDonationAmount: 10, defaultFrequency: 'monthly' }); // Workaround for https://github.com/everydotorg/donate-button/issues/384 let style = document.createElement('style'); style.innerHTML = '#donation-input { color: black; } #privateNote { color: black }'; document.getElementById("shadow-wrapper").shadowRoot.appendChild(style); } if (window.everyDotOrgDonateButton) { zsfCreateWidget(); } else { document.getElementById("every-donate-btn-js").addEventListener('load', zsfCreateWidget); } MissionDie Mission der Zig Software Foundation ist es, die Zig-Programmiersprache zu fördern, zu schützen und voranzubringen, das Wachstum einer vielfältigen und internationalen Gemeinschaft von Zig-Programmierern zu unterstützen und zu erleichtern sowie Studenten auszubilden und anzuleiten, damit die nächste Generation von Programmierern kompetent und ethisch korrekt arbeitet und sich gegenseitig an hohe Standards hält.Die ZSF ist eine amerikanische 501(c)(3) organization. Das entspricht einer gemeinnützigen Organisation. Finanzen, Sitzungsprotokolle und andere Details sind öffentlich verfügbar.VorstandsmitgliederAndrew Kelley (Präsident)Josh Wolfe (Sekretär)Mason Remaley (Schatzmeister)FörderungMit einer Spende an die ZSF finanzierst du die Entwicklung der Programmiersprache Zig und ihres Ökosystems, was wiederum der gesamten Open-Source-Gemeinschaft zugute kommt. Mitglieder der Zig-Community haben zu Fehlerbehebungen in LLVM, Wine, QEMU, musl libc, GDB und anderen Projekten beigetragen.Die ZSF ist eine kleine Organisation, die ihre finanziellen Mittel effizient einsetzt. Das soll auch so bleiben, aber wir wollen unsere unbezahlten Freiwilligen zu bezahlten Helfern machen, um die Zusammenführung von Pull Requests zu unterstützen und schnellere Fortschritte in Richtung Version 1.0 zu machen. Der Sinn der Gemeinnützigkeit der ZSF ist es, den Menschen zu helfen. Wir versuchen, dass Open-Source-Betreuer für ihre Zeit bezahlt werden.SpendeninformationenNützliche Informationen um auf anderem Wege als durch GitHub-Sponsors zu spenden. Informiere dich, ob du deine Spende von der Steuer absetzen kannst.EIN84-5105214AdresseZig Software Foundation1632 1st Ave #21385New York, NY 10028Weitere unterstützte SpendenwegeEveryGitHub SponsorsBenevity (recommended if your employer matches donations!)Banküberweisungen (auch von außerhalb der US, kontaktiere uns für weitere Informationen)Schecks (s. Postadresse oben)WiseWende dich mit weiteren Nachfragen gerne an donations@ziglang.org.UnternehmenssponsorenGeldspendenDie folgenden Unternehmen bieten der Zig Software Foundation direkte finanzielle Unterstützung, indem sie mehr als $1000 monatlich spenden. @media (prefers-color-scheme:light) { #zml { filter: invert(); } }'''
year_published = 2025
