title = "Impara  ⚡  Zig Programming Language"
full_description = "← Torna a Pagina principale ImparaQuesta sezione contiene alcune risorse utili per iniziare ad imparare Zig e la filosofia con cui è sviluppato. Documentazione In sviluppo (master) Documentazione del linguaggio Documentazione della libreria standard Ultimo rilascio stabile (0.13.0) Documentazione del linguaggio Documentazione della libreria standard GuideQuesta sezione in futuro verrà integrata nella documentazione della libreria standard, ma nel frattempo è disponibile qui.Zig Build System Introduzione al build system di Zig.IntroduzionePagine di introduzione a Zig, ognuna dedicata a programmatori con diversi livelli di esperienza.Panoramica approfondita Una panoramica completa delle caratteristiche di Zig, con una prospettiva da programmazione di sistemi.Perchè Zig quando ci sono già C++, D e Rust? Un'introduzione a Zig per programmatori C++, D, o Rust.Esempi Una lista di esempi di codice per farsi un'idea di Zig.Strumenti Una lista di strumenti utili per facilitare la scrittura di codice in Zig.Inizia qui!Se hai deciso di iniziare a programmare in Zig, questa guida ti aiuterà ad ottenere e configurare tutto il necessario.Inizia quiMateriale didattico onlineIntroduction to Zig: a project-based book Un libro aperto, tecnico e introduttivo per Zig.zig.guide Un'introduzione strutturata a Zig, creata da Sobeston.Ziglings Impara Zig risolvendo problemi in una serie di piccoli programmi.Zig su Exercism Completa degli esercizi di programmazione e ricevi supporto dagli esperti per padroneggiare Zig.Learning Zig Breve introduzione a Zig adatta a sviluppatori che vengono da linguaggi con gestione automatica della memoria (garbage-collection).Video e articoli consigliatiRoad to Zig 1.0 [video] Video di Andrew Kelley che presenta il linguaggio Zig e la sua filosofia.Zig's New Relationship with LLVM Un articolo sulla realizzazione del compilatore self-hosted di Zig, citato anche in un articolo di lwn.net."
