["https://ziglang.org/uk-UA/learn/overview"]
title = "Огляд  ⚡  Zig Programming Language"
full_description = '''← Назад до Вчитися Огляд Основні функціїМаленька, проста моваЗосередьтеся на налагодженні програми, а не на налагодженні своїх знань мови програмування.Весь синтаксис Zig указано в 580-рядковому файлі граматики PEG.Немає прихованого потоку керування, прихованого розподілу пам’яті, препроцесора та макросів. Якщо Zig-код не виглядає так, ніби він відскакує, щоб викликати функцію, це не так. Це означає, що ви можете бути впевнені, що наступний код викликає лише foo(), а потім bar(), і це гарантовано без необхідності знати типи чогось:var a = b + c.d; foo(); bar(); Приклади прихованого потоку керування:У D є функції @property, тобто методи, які ви викликаєте за допомогою того, що виглядає як доступ до поля, тому в наведеному вище прикладі c.d може викликати функцію..C++, D і Rust мають перевантаження операторів, тому оператор + може викликати функцію.C++, D і Go мають винятки throw/catch, тому foo() може викликати виняток і запобігти виклику bar().Zig сприяє підтримці та читабельності коду, керуючи всіма потоками керування виключно за допомогою ключових слів мови та викликів функцій.Продуктивність і Безпека: Виберіть ДваZig має чотири режими збірки, і всі їх можеа комбінувати і узгоджувати аж до scope гранулярності. Parameter Debug ReleaseSafe ReleaseFast ReleaseSmall Оптимізація - покращує швидкість, шкодить налагодженню, шкодить часу компіляції -O3 -O3 -Os Перевірки безпеки під час виконання – швидкість шкоди, розмір шкоди, збій замість невизначеної поведінки На На Ось як Переповнення Цілого Числа виглядає під час компіляції, незалежно від режиму збирання:1-integer-overflow.zigtest "integer overflow at compile time" { const x: u8 = 255; _ = x + 1; }Shell$ zig test 1-integer-overflow.zig assets/zig-code/features/1-integer-overflow.zig:3:11: error: overflow of integer type 'u8' with value '256' Ось як це виглядає під час виконання, у збірках з перевірками безпеки:2-integer-overflow-runtime.zigtest "integer overflow at runtime" { var x: u8 = 255; x += 1; }Shell$ zig test 2-integer-overflow-runtime.zig 1/1 2-integer-overflow-runtime.test.integer overflow at runtime...thread 3030394 panic: integer overflow /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/2-integer-overflow-runtime.zig:3:7: 0x103cc2e in test.integer overflow at runtime (test) x += 1; ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/compiler/test_runner.zig:157:25: 0x1047f99 in mainTerminal (test) if (test_fn.func()) |_| { ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/compiler/test_runner.zig:37:28: 0x103e01b in main (test) return mainTerminal(); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:22: 0x103d159 in posixCallMainAndExit (test) root.main(); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:266:5: 0x103ccc1 in _start (test) asm volatile (switch (native_arch) { ^ ???:?:?: 0x0 in ??? (???) error: the following test command crashed: /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/.zig-cache/o/9e3bfcb661c1ce3251fa44aa9886f390/test Ці стек-трейси працюють на всіх цілях, включаючи окремі.Використовуючи Zig можна покластися на безпечний режим збірки та вибірково вимикати безпеку у вузьких місцях для покращення продуктивності. Наприклад, попередній приклад можна змінити так:3-undefined-behavior.zigtest "actually undefined behavior" { @setRuntimeSafety(false); var x: u8 = 255; x += 1; // XXX undefined behavior! }Zig пикористовує Невизначену поведінку як гострий як бритва інструмент як задля запобігання помилкам, так і для підвищення продуктивності.Говорячи про швидкість роботи, Zig швидше, ніж C.Еталонна реалізація використовує LLVM як бекенд для найсучаснішої оптимізації.Те, що інші проекти називають «Оптимізацією Консолідації» (Link Time Optimization), Zig робить автоматично.Для нативних цілей увімкнено розширені функції ЦП (-march=native), завдяки тому, що Крос-компіляція є першокласним випадком використання.Ретельно підібрана невизначена поведінка. Наприклад, у Zig і знакові, і беззнакові цілі мають невизначену поведінку при переповненні, на відміну від лише знакових цілих чисел у C. Це сприяє оптимізації, недоступній у C.Zig безпосередньо відкриває тип вектора SIMD, що полегшує написання переносного векторизованого коду.Зверніть увагу, що Zig не є повністю безпечною мовою. Для тих, хто хоче стежити за історією безпеки Zig, підпишіться на ці випуски:перелік всіх видів невизначеної поведінки, навіть тих, які не можна перевірити на безпекузробити режими Debug і ReleaseSafe повністю безпечнимиZig конкурує з C замість того, щоб залежати від ньогоСтандартна бібліотека Zig інтегрується з libc, але не залежить від неї. Ось "Hello World":4-hello.zigconst std = @import("std"); pub fn main() void { std.debug.print("Hello, world!\n", .{}); }Shell$ zig build-exe 4-hello.zig $ ./4-hello Hello, world! При компіляції з -O ReleaseSmall, символи налагодження видалені, однопоточний режим, це створює статичний виконуваний файл розміром 9,8 КБ для цілі x86_64-linux:$ zig build-exe hello.zig -O ReleaseSmall -fstrip -fsingle-threaded $ wc -c hello 9944 hello $ ldd hello not a dynamic executable Збірка Windows ще менша, досягає 4096 байт:$ zig build-exe hello.zig -O ReleaseSmall -fstrip -fsingle-threaded -target x86_64-windows $ wc -c hello.exe 4096 hello.exe $ file hello.exe hello.exe: PE32+ executable (console) x86-64, for MS Windows Порядок незалежні декларації верхнього рівняОголошення верхнього рівня, такі як глобальні змінні, не залежать від порядку та "ліниво" аналізуються. Значення ініціалізації глобальних змінних оцінюються під час компіляції.5-global-variables.zigvar y: i32 = add(10, x); const x: i32 = add(12, 34); test "global variables" { assert(x == 46); assert(y == 56); } fn add(a: i32, b: i32) i32 { return a + b; } const std = @import("std"); const assert = std.debug.assert;Shell$ zig test 5-global-variables.zig 1/1 5-global-variables.test.global variables...OK All 1 tests passed. Необовʼязковий тип замість null-вказівниківВ інших мовах програмування null-вказівники є джерелом багатьох винятків під час виконання, і їх навіть звинувачують як найгіршу помилку інформатики.Неприкрашені вказівники Zig не можуть мати значення null:6-null-to-ptr.zigtest "null @intToPtr" { const foo: *i32 = @ptrFromInt(0x0); _ = foo; }Shell$ zig test 6-null-to-ptr.zig assets/zig-code/features/6-null-to-ptr.zig:2:35: error: pointer type '*i32' does not allow address zero Однак будь-який тип можна перетворити на необов’язковий тип, додавши до нього префікс ?:7-optional-syntax.zigconst std = @import("std"); const assert = std.debug.assert; test "null @intToPtr" { const ptr: ?*i32 = @ptrFromInt(0x0); assert(ptr == null); }Shell$ zig test 7-optional-syntax.zig 1/1 7-optional-syntax.test.null @intToPtr...OK All 1 tests passed. Щоб розгорнути необов’язкове значення, можна використати orelse, щоб надати значення за замовчуванням:8-optional-orelse.zig// malloc prototype included for reference extern fn malloc(size: size_t) ?*u8; fn doAThing() ?*Foo { const ptr = malloc(1234) orelse return null; // ... }Інший варіант - використовувати if:9-optional-if.zigfn doAThing(optional_foo: ?*Foo) void { // do some stuff if (optional_foo) |foo| { doSomethingWithFoo(foo); } // do some stuff }Той самий синтаксис працює з while:10-optional-while.zigconst std = @import("std"); pub fn main() void { const msg = "hello this is dog"; var it = std.mem.tokenize(u8, msg, " "); while (it.next()) |item| { std.debug.print("{s}\n", .{item}); } }Shell$ zig build-exe 10-optional-while.zig $ ./10-optional-while hello this is dog Керування пам'яттю вручнуБібліотеку, написану мовою Zig, можна використовувати будь-де:Настільні програмиСервери з низькою затримкоюЯдро операційної системиВбудовані пристроїПрограмне забезпечення реального часу, напр. живі виступи, літаки, кардіостимуляториУ веб-браузерах або інших плагінах із WebAssemblyІншими мовами програмування, використовуючи C ABIЩоб досягти цього, програмісти Zig повинні керувати пам’яттю власноруч та вирішувати проблеми розподілу пам’яті самостійно.Це також стосується стандартної бібліотеки Zig. Будь-які функції, яким потрібно виділити пам’ять, приймають параметр розподільника. У результаті стандартну бібліотеку Zig можна використовувати навіть для окремою цілі.Окрім Новий погляду на обробку помилок, Zig надає defer і errdefer , щоб зробити керування всіма ресурсами, а не лише пам’яттю, простим і легким для перевірки.Для прикладу defer див. Інтеграція з бібліотеками C без FFI/bindings. Ось приклад використання errdefer: 11-errdefer.zigconst Device = struct { name: []u8, fn create(allocator: *Allocator, id: u32) !Device { const device = try allocator.create(Device); errdefer allocator.destroy(device); device.name = try std.fmt.allocPrint(allocator, "Device(id={d})", id); errdefer allocator.free(device.name); if (id == 0) return error.ReservedDeviceId; return device; } };Новий погляд на обробку помилокПомилки є значеннями, і їх не можна ігнорувати:12-errors-as-values.zigconst std = @import("std"); pub fn main() void { _ = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); }Shell$ zig build-exe 12-errors-as-values.zig /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/12-errors-as-values.zig:4:30: error: error union is discarded _ = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); ~~~~~~~~~~~~~~~~~~~~~^~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/12-errors-as-values.zig:4:30: note: consider using 'try', 'catch', or 'if' referenced by: callMain: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:17 callMainWithArgs: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:482:12 remaining reference traces hidden; use '-freference-trace' to see all reference traces Помилки можна обробляти за допомогою catch:13-errors-catch.zigconst std = @import("std"); pub fn main() void { const file = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}) catch |err| label: { std.debug.print("unable to open file: {}\n", .{err}); const stderr = std.io.getStdErr(); break :label stderr; }; file.writeAll("all your codebase are belong to us\n") catch return; }Shell$ zig build-exe 13-errors-catch.zig $ ./13-errors-catch unable to open file: error.FileNotFound all your codebase are belong to us Ключове слово try is a shortcut for catch |err| return err:14-errors-try.zigconst std = @import("std"); pub fn main() !void { const file = try std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); defer file.close(); try file.writeAll("all your codebase are belong to us\n"); }Shell$ zig build-exe 14-errors-try.zig $ ./14-errors-try error: FileNotFound /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/posix.zig:1768:23: 0x1066a70 in openatZ (14-errors-try) .NOENT => return error.FileNotFound, ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:880:16: 0x1038294 in openFileZ (14-errors-try) const fd = try posix.openatZ(self.fd, sub_path, os_flags, 0); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:827:5: 0x1034d9e in openFile (14-errors-try) return self.openFileZ(&path_c, flags); ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/14-errors-try.zig:4:18: 0x1034be8 in main (14-errors-try) const file = try std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); ^ Зауважте, що це трасування повернення помилки, а не стек-трейс. Код не заплатив ціну розмотування стека, щоб отримати це трасування.Якщо ключове слово switch використовується до помилки - це забезпечує обробку всіх можливих помилок:15-errors-switch.zigconst std = @import("std"); test "switch on error" { _ = parseInt("hi", 10) catch |err| switch (err) {}; } fn parseInt(buf: []const u8, radix: u8) !u64 { var x: u64 = 0; for (buf) |c| { const digit = try charToDigit(c); if (digit >= radix) { return error.DigitExceedsRadix; } x = try std.math.mul(u64, x, radix); x = try std.math.add(u64, x, digit); } return x; } fn charToDigit(c: u8) !u8 { const value = switch (c) { '0'...'9' => c - '0', 'A'...'Z' => c - 'A' + 10, 'a'...'z' => c - 'a' + 10, else => return error.InvalidCharacter, }; return value; }Shell$ zig build-exe 15-errors-switch.zig /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:509:45: error: root struct of file '15-errors-switch' has no member named 'main' switch (@typeInfo(@typeInfo(@TypeOf(root.main)).Fn.return_type.?)) { ~~~~^~~~~ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/15-errors-switch.zig:1:1: note: struct declared here const std = @import("std"); ^~~~~ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:482:20: note: called from here return callMain(); ~~~~~~~~^~ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:438:36: note: called from here std.posix.exit(callMainWithArgs(argc, argv, envp)); ~~~~~~~~~~~~~~~~^~~~~~~~~~~~~~~~~~ referenced by: _start: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:351:40 remaining reference traces hidden; use '-freference-trace' to see all reference traces Ключове слово unreachable використовується, щоб стверджувати, що помилок не буде:16-unreachable.zigconst std = @import("std"); pub fn main() void { const file = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}) catch unreachable; file.writeAll("all your codebase are belong to us\n") catch unreachable; }Shell$ zig build-exe 16-unreachable.zig $ ./16-unreachable thread 3030318 panic: attempt to unwrap error: FileNotFound /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/posix.zig:1768:23: 0x10699b0 in openatZ (16-unreachable) .NOENT => return error.FileNotFound, ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:880:16: 0x1039a94 in openFileZ (16-unreachable) const fd = try posix.openatZ(self.fd, sub_path, os_flags, 0); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:827:5: 0x103723e in openFile (16-unreachable) return self.openFileZ(&path_c, flags); ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/16-unreachable.zig:4:77: 0x1034fcf in main (16-unreachable) const file = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}) catch unreachable; ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:22: 0x10347d9 in posixCallMainAndExit (16-unreachable) root.main(); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:266:5: 0x1034341 in _start (16-unreachable) asm volatile (switch (native_arch) { ^ ???:?:?: 0x0 in ??? (???) (process terminated by signal) Це викликає невизначену поведінку у небезпечних режимах збирання, тому використовуйте його лише тоді, коли успіх гарантований.Трасування стека на всіх ціляхтрасування стека та повернення помилок, показані на цій сторінці, працюють на всіх цілях 1-го рівня і на деяких цілях 2-го рівня підтримки. Навіть окремо!Крім того, стандартна бібліотека має можливість захопити трасування стека в будь-якій точці, а потім скинути його до стандартної помилки пізніше:17-stack-traces.zigconst std = '''
