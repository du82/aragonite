["https://ziglang.org/ja-JP/learn/build-system"]
title = "Zig Build System  ⚡  Zig Programming Language"
full_description = '''← Back to 学ぶ Zig Build System When to bust out the Zig Build System?Getting Started Simple ExecutableInstalling Build ArtifactsAdding a Convenience Step for Running the ApplicationThe Basics User-Provided OptionsStandard Configuration OptionsOptions for Conditional CompilationStatic LibraryDynamic LibraryTestingLinking to System LibrariesGenerating Files Running System ToolsRunning the Project's ToolsProducing Assets for @embedFileGenerating Zig Source CodeDealing With One or More Generated FilesMutating Source Files in PlaceHandy Examples Build for multiple targets to make a release When to bust out the Zig Build System?The fundamental commands zig build-exe, zig build-lib, zig build-obj, and zig test are often sufficient. However, sometimes a project needs another layer of abstraction to manage the complexity of building from source.For example, perhaps one of these situations applies:The command line becomes too long and unwieldly, and you want some place to write it down.You want to build many things, or the build process contains many steps.You want to take advantage of concurrency and caching to reduce build time.You want to expose configuration options for the project.The build process is different depending on the target system and other options.You have dependencies on other projects.You want to avoid an unnecessary dependency on cmake, make, shell, msvc, python, etc., making the project accessible to more contributors.You want to provide a package to be consumed by third parties.You want to provide a standardized way for tools such as IDEs to semantically understand how to build the project.If any of these apply, the project will benefit from using the Zig Build System.Getting StartedSimple ExecutableThis build script creates an executable from a Zig file that contains a public main function definition.hello.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("hello.zig"), .target = b.host, }); b.installArtifact(exe); }Shell$ zig build--summary all Build Summary: 3/3 steps succeeded install cached └─ install hello cached └─ zig build-exe hello Debug native cached 66ms MaxRSS:36M Installing Build ArtifactsThe Zig build system, like most build systems, is based on modeling the project as a directed acyclic graph (DAG) of steps, which are independently and concurrently run.By default, the main step in the graph is the Install step, whose purpose is to copy build artifacts into their final resting place. The Install step starts with no dependencies, and therefore nothing will happen when zig build is run. A project's build script must add to the set of things to install, which is what the installArtifact function call does above.Output├── build.zig ├── hello.zig ├── .zig-cache └── zig-out └── bin └── hello There are two generated directories in this output: .zig-cache and zig-out. The first one contains files that will make subsequent builds faster, but these files are not intended to be checked into source-control and this directory can be completely deleted at any time with no consequences.The second one, zig-out, is an "installation prefix". This maps to the standard file system hierarchy concept. This directory is not chosen by the project, but by the user of zig build with the --prefix flag (-p for short).You, as the project maintainer, pick what gets put in this directory, but the user chooses where to install it in their system. The build script cannot hardcode output paths because this would break caching, concurrency, and composability, as well as annoy the final user.Adding a Convenience Step for Running the ApplicationIt is common to add a Run step to provide a way to run one's main application directly from the build command.hello.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("hello.zig"), .target = b.host, }); b.installArtifact(exe); const run_exe = b.addRunArtifact(exe); const run_step = b.step("run", "Run the application"); run_step.dependOn(&run_exe.step); }Shell$ zig buildrun --summary all Hello World! Build Summary: 3/3 steps succeeded run success └─ run hello success 14ms MaxRSS:1M └─ zig build-exe hello Debug native cached 44ms MaxRSS:36M The BasicsUser-Provided OptionsUse b.option to make the build script configurable to end users as well as other projects that depend on the project as a package.build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const windows = b.option(bool, "windows", "Target Microsoft Windows") orelse false; const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("example.zig"), .target = b.resolveTargetQuery(.{ .os_tag = if (windows) .windows else null, }), }); b.installArtifact(exe); }Shell$ zig build--help Usage: /home/ci/deps/zig-linux-x86_64-0.13.0/zig build [steps] [options] Steps: install (default) Copy build artifacts to prefix path uninstall Remove build artifacts from prefix path General Options: -p, --prefix [path] Where to install files (default: zig-out) --prefix-lib-dir [path] Where to install libraries --prefix-exe-dir [path] Where to install executables --prefix-include-dir [path] Where to install C header files --release[=mode] Request release mode, optionally specifying a preferred optimization mode: fast, safe, small -fdarling, -fno-darling Integration with system-installed Darling to execute macOS programs on Linux hosts (default: no) -fqemu, -fno-qemu Integration with system-installed QEMU to execute foreign-architecture programs on Linux hosts (default: no) --glibc-runtimes [path] Enhances QEMU integration by providing glibc built for multiple foreign architectures, allowing execution of non-native programs that link with glibc. -frosetta, -fno-rosetta Rely on Rosetta to execute x86_64 programs on ARM64 macOS hosts. (default: no) -fwasmtime, -fno-wasmtime Integration with system-installed wasmtime to execute WASI binaries. (default: no) -fwine, -fno-wine Integration with system-installed Wine to execute Windows programs on Linux hosts. (default: no) -h, --help Print this help and exit -l, --list-steps Print available steps --verbose Print commands before executing them --color [auto|off|on] Enable or disable colored error messages --prominent-compile-errors Buffer compile errors and display at end --summary [mode] Control the printing of the build summary all Print the build summary in its entirety new Omit cached steps failures (Default) Only print failed steps none Do not print the build summary -j<N> Limit concurrent jobs (default is to use all CPU cores) --maxrss <bytes> Limit memory usage (default is to use available memory) --skip-oom-steps Instead of failing, skip steps that would exceed --maxrss --fetch Exit after fetching dependency tree Project-Specific Options: -Dwindows=[bool] Target Microsoft Windows System Integration Options: --search-prefix [path] Add a path to look for binaries, libraries, headers --sysroot [path] Set the system root directory (usually /) --libc [file] Provide a file which specifies libc paths --system [pkgdir] Disable package fetching; enable all integrations -fsys=[name] Enable a system integration -fno-sys=[name] Disable a system integration Available System Integrations: Enabled: (none) - Advanced Options: -freference-trace[=num] How many lines of reference trace should be shown per compile error -fno-reference-trace Disable reference trace --build-file [file] Override path to build.zig --cache-dir [path] Override path to local Zig cache directory --global-cache-dir [path] Override path to global Zig cache directory --zig-lib-dir [arg] Override path to Zig lib directory --build-runner [file] Override path to build runner --seed [integer] For shuffling dependency traversal order (default: random) --debug-log [scope] Enable debugging the compiler --debug-pkg-config Fail if unknown pkg-config flags encountered --verbose-link Enable compiler debug output for linking --verbose-air Enable compiler debug output for Zig AIR --verbose-llvm-ir[=file] Enable compiler debug output for LLVM IR --verbose-llvm-bc=[file] Enable compiler debug output for LLVM BC --verbose-cimport Enable compiler debug output for C imports --verbose-cc Enable compiler debug output for C compilation --verbose-llvm-cpu-features Enable compiler debug output for LLVM CPU features example.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); }Please direct your attention to these lines:Project-Specific Options: -Dwindows=[bool] Target Microsoft Windows This part of the help menu is auto-generated based on running the build.zig logic. Users can discover configuration options of the build script this way.Standard Configuration OptionsPreviously, we used a boolean flag to indicate building for Windows. However, we can do better.Most projects want to provide the ability to change the target and optimization settings. In order to encourage standard naming conventions for these options, Zig provides the helper functions, standardTargetOptions and standardOptimizeOption.Standard target options allows the person running zig build to choose what target to build for. By default, any target is allowed, and no choice means to target the host system. Other options for restricting supported target set are available.Standard optimization options allow the person running zig build to select between Debug, ReleaseSafe, ReleaseFast, and ReleaseSmall. By default none of the release options are considered the preferable choice by the build script, and the user must make a decision in order to create a release build.hello.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const target = b.standardTargetOptions(.{}); const optimize = b.standardOptimizeOption(.{}); const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("hello.zig"), .target = target, .optimize = optimize, }); b.installArtifact(exe); }Shell$ zig build-Dtarget=x86_64-windows -Doptimize=ReleaseSmall --summary all Build Summary: 3/3 steps succeeded install cached └─ install hello cached └─ zig build-exe hello ReleaseSmall x86_64-windows cached 44ms MaxRSS:36M Now, our --help menu contains more items:Project-Specific Options: -Dtarget=[string] The CPU architecture, OS, and ABI to build for -Dcpu=[string] Target CPU features to add or subtract -Doptimize=[enum] Prioritize performance, safety, or binary size (-O flag) Supported Values: Debug ReleaseSafe ReleaseFast ReleaseSmall It is entirely possible to create these options via b.option directly, but this API provides a commonly used naming convention for these frequently used settings.In our terminal output, observe that we passed -Dtarget=x86_64-windows -Doptimize=ReleaseSmall. Compared to the first example, now we see different files in the installation prefix:zig-out/ └── bin └── hello.exe Options for Conditional CompilationTo pass options from the build script and into the project's Zig code, use the Options step.app.zigconst std = @import("std"); const config = @import("config"); const semver = std.SemanticVersion.parse(config.version) catch unreachable; extern fn foo_bar() void; pub fn main() !void { if (semver.major < 1) { @compileError("too old"); } std.debug.print("version: {s}\n", .{config.version}); if (config.have_libfoo) { foo_bar(); } } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const exe = b.addExecutable(.{ .name = "app", .root_source_file = b.path("app.zig"), .target = b.host, }); const version = b.option([]const u8, "version", "application version string") orelse "0.0.0"; const enable_foo = detectWhetherToEnableLibFoo(); const options = b.addOptions(); options.addOption([]const u8, "version", version); options.addOption(bool, "have_libfoo", enable_foo); exe.root_module.addOptions("config", options); b.installArtifact(exe); } fn detectWhetherToEnableLibFoo() bool { return false; }Shell$ zig build-Dversion=1.2.3 --summary all Build Summary: 4/4 steps succeeded install cached └─ install app cached └─ zig build-exe app Debug native cached 33ms MaxRSS:36M └─ options cached In this example, the data provided by @import("config") is comptime-known, preventing the @compileError from triggering. If we had passed -Dversion=0.2.3 or omitted the option, then we would have seen the compilation of app.zig fail with the "too old" error.Static LibraryThis build script creates a static library from Zig code, and then also an executable from other Zig code that consumes it.fizzbuzz.zigexport fn fizzbuzz(n: usize) ?[*:0]const u8 { if (n % 5 == 0) { if (n % 3 == 0) { return "fizzbuzz"; } else { return "fizz"; } } else if (n % 3 == 0) { return "buzz"; } return null; } demo.zigconst std = @import("std"); extern fn fizzbuzz(n: usize) ?[*:0]const u8; pub fn main() !void { const stdout = std.io.getStdOut(); var bw = std.io.bufferedWriter(stdout.writer()); const w = bw.writer(); for (0..100) |n| { if (fizzbuzz(n)) |s| { try w.print("{s}\n", .{s}); } else { try w.print("{d}\n", .{n}); } } try bw.flush(); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const target = b.standardTargetOptions(.{}); const optimize = b.standardOptimizeOption(.{}); const libfizzbuzz = b.addStaticLibrary(.{ .name = "fizzbuzz", .root_source_file = b.path("fizzbuzz.zig"), .target = target, .optimize = optimize, }); const exe = b.addExecutable(.{ .name = "demo", .root_source_file = b.path("demo.zig"), .target = target, .optimize = optimize, }); exe.linkLibrary(libfizzbuzz); b.installArtifact(libfizzbuzz); if (b.option(bool, "enable-demo", "install the demo too") orelse false) { b.installArtifact(exe); } }Shell$ zig build--summary all Build Summary: 3/3 steps succeeded install cached └─ install fizzbuzz cached └─ zig build-lib fizzbuzz Debug native cached 56ms MaxRSS:36M In this case, only the static library ends up being installed:zig-out/ └── lib └── libfizzbuzz.a However, if you look closely, the build script contains an option to also install the demo. If we additionally pass -Denable-demo, then we see this in the installation prefix:zig-out/ ├── bin │ └── demo └── lib └── libfizzbuzz.a Note that despite the unconditional call to addExecutable, the build system in fact does not waste any time building the demo executable unless it is requested with -Denable-demo, because the build system is based on a Directed Acyclic Graph with dependency edges.Dynamic LibraryHere we keep all the files the same from the Static Library example, except the build.zig file is changed.build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const targ'''
