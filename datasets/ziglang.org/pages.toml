["https://ziglang.org/uk-UA/learn"]
title = "Вчитися  ⚡  Zig Programming Language"
full_description = '''← Назад до Головна ВчитисяУ цьому розділі наведено корисні ресурси, щоб пройти від "не знати нічого про Zig" аж до розуміння його філософії. Документація Unstable (master) Довідник мови Документація Стандартної Бібліотеки Latest Stable (0.13.0) Довідник мови Документація Стандартної Бібліотеки ПосібникиЗгодом цей розділ буде додано до документації стандартної бібліотеки Zig, але тим часом ви можете переглядати його тут.Система Zig Build Знайомство з системою збірки Zig.ВступУвесь цей вступ до Zig призначений для програмістів із різним досвідом.Поглиблений оглядОсь поглиблений огляд функцій Zig з точки зору системного програмування.Чому Zig, коли вже є C++, D і Rust?Вступ до Zig для програмістів C++, D та Rust.Приклади КодуСписок фрагментів коду, щоб зрозуміти, як виглядає Zig-код.ІнструментиСписок корисних інструментів, які можуть допомогти вам писати код на Zig.Початок РоботиЯкщо ви готові почати програмувати в Zig, цей посібник допоможе вам налаштувати ваше середовище.Початок РоботиОнлайн-ресурси навчанняIntroduction to Zig: a project-based book Відкрита технічна вступна книга для Zig.zig.guideСтруктурований вступ до Zig від Sobeston.ZiglingsВивчайте Zig, виправляючи крихітні зламані програми.Zig on Exercism Розв’яжіть вправи з кодування та отримайте наставництво, щоб розвивати вільне володіння Zig.Learning Zig Короткий вступ до Zig, який добре підходить для розробників, які працюють із мовами зі збиранням сміття.Відповідні відео та публікації в блогахRoad to Zig 1.0 [video]Відео від Andrew Kelley представляючи Zig та його філософію.Zig's New Relationship with LLVMПовідомлення в блозі про роботу над створенням самостійного компілятора Zig, також представлене в статті від lwn.net.'''
