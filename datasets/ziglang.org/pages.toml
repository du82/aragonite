["https://ziglang.org/download/0.10.0/release-notes.html"]
title = "0.10.0 Release Notes ⚡ The Zig Programming Language"
full_description = "Zig is a general-purpose programming language and toolchain for maintaining robust, optimal, and reusable software. Backed by the Zig Software Foundation, the project is financially sustainable. These core team members work on Zig full-time: This release features 10 months of work: changes from 272 different contributors, spread among 4737 commits. It is the début of the Self-Hosted Compiler. Cody excels at troubleshooting and debugging. He fearlessly deep dives into unfamiliar areas of code, relentlessly attacking the problem until a solution presents itself. In addition, Cody has proven to be a steadfast community leader, setting an example for how to treat others with kindness and respect. If you have been following along with Zig's development process lately, you might have noticed a distinct uptick in pull requests being merged, Bug Fixes to the Self-Hosted Compiler, and implementation of Language Changes. Vexu has been doing brilliant work, and we are all fortunate that, one, he has decided to take on full-time hours lately, and two, donations have been steadily rising so that there are enough funds to offer the hours. A green check mark (✅) indicates the target meets all the requirements for the support tier. The other icons indicate what is preventing the target from reaching the support tier. In other words, the icons are to-do items. If you find any wrong data here please submit a pull request! During this release cycle, a lot of time was spent on both visible and invisible improvements. Refactors were done to increase readability, maintainability, and also the performance of the backend and its generated code. With this release, we're one step closer to being able to make the WebAssembly Backend the default for debug mode. The 32-bit Windows tarball is missing for this release due to #12886. It will be available again in the 0.10.1 bugfix release. Previously, updating the SYS enum for each architecture required manually looking at the syscall tables and inserting any new additions. Now there is a tool, generate_linux_syscalls.zig, that automates this process using the syscall tables in the Linux source tree. On architectures without a table, it runs zig cc as a pre-processor to extract the system-call numbers from the Linux headers."
