["https://ziglang.org/download/0.1.1/release-notes.html"]
title = "0.1.1 Release Notes · The Zig Programming Language"
full_description = "Zig has numerous cases of assertions built into the language itself, such as asserting that arithmetic overflow will not happen for most operations. When an assertion fails with safety checks enabled, the program crashes; this helps catch bugs. When an assertion fails with safety checks disabled, undefined behavior ensues; this helps optimization. In LLVM, bitshifting too far is undefined behavior. Zig requires that you bitshift by a number whose type is the exactly correct size. For shifting a 32-bit integer, you must shift by a 5-bit integer. Out-of-memory situations are commonly treated with crashes in most development communities. In Zig, this corner case needs to be supported. All standard library APIs return errors for out-of-memory situations, and when you call a function that can return an error, you must explicitly handle or ignore the error in some way. User applications are encouraged to handle memory errors gracefully through syntactic sugar such as %return. Zig encourages code writers to be verbose and explicit for the sake of making the code easier to read by humans. Zig language features are designed to avoid hidden control flow. All cases where control flow jumps out of a function body are clearly visible in the source code, such as a function call. Zig does not support RAII or operator overloading because both make it very difficult to tell where function calls happen just by looking at a function body. Zig tends to avoid syntactic sugar except where it would have a significant effect on the semantics of a program. Zig does not have a C-style for loop, because you can just use the more general-purpose while loop instead with only a little bit of extra code. By contrast, Zig does support the `defer` statement, because it has a significant effect on the semantics. Flesh out the standard library for Windows, streamline Zig installation and distribution for Windows. Work with LLVM and LLD teams to improve PDB/CodeView/MSVC debugging. Implement stack traces for Windows in the MinGW environment and the MSVC environment."
