["https://ziglang.org/learn/getting-started"]
title = "Getting Started  ⚡  Zig Programming Language"
full_description = '''← Back to Learn Getting Started Tagged release or nightly build?Installing Zig Direct download Setting up PATH on WindowsSetting up PATH on Linux, macOS, BSDPackage managers WindowsmacOSLinuxBuilding from sourceRecommended tools Syntax Highlighters and LSPRun Hello WorldNext steps Tagged release or nightly build?Zig has not yet reached v1.0 and the current release cycle is tied to new releases of LLVM, which have a ~6 months cadence. In practical terms, Zig releases tend to be far apart and eventually become stale given the current speed of development.It's fine to evaluate Zig using a tagged version, but if you decide that you like Zig and want to dive deeper, we encourage you to upgrade to a nightly build, mainly because that way it will be easier for you to get help: most of the community and sites like zig.guide track the master branch for the reasons stated above.The good news is that it's very easy to switch from one Zig version to another, or even have multiple versions present on the system at the same time: Zig releases are self-contained archives that can be placed anywhere in your system.Installing ZigDirect downloadThis is the most straight-forward way of obtaining Zig: grab a Zig bundle for your platform from the Downloads page, extract it in a directory and add it to your PATH to be able to call zig from any location.Setting up PATH on WindowsTo setup your path on Windows run one of the following snippets of code in a Powershell instance. Choose if you want to apply this change on a system-wide level (requires running Powershell with admin privileges) or just for your user, and make sure to change the snippet to point at the location where your copy of Zig lies. The ; before C: is not a typo.System wide (admin Powershell):[Environment]::SetEnvironmentVariable( "Path", [Environment]::GetEnvironmentVariable("Path", "Machine") + ";C:\your-path\zig-windows-x86_64-your-version", "Machine" ) User level (Powershell):[Environment]::SetEnvironmentVariable( "Path", [Environment]::GetEnvironmentVariable("Path", "User") + ";C:\your-path\zig-windows-x86_64-your-version", "User" ) After you're done, restart your Powershell instance.Setting up PATH on Linux, macOS, BSDAdd the location of your zig binary to your PATH environment variable.This is generally done by adding an export line to your shell startup script (.profile, .zshrc, ...)export PATH=$PATH:~/path/to/zig After you're done, either source your startup file or restart your shell.Package managersWindowsWinGetZig is available on WinGet.winget install -e --id zig.zig ChocolateyZig is available on Chocolatey.choco install zig ScoopZig is available on Scoop.scoop install zig Latest dev build:scoop bucket add versions scoop install versions/zig-dev macOSHomebrewLatest tagged release:brew install zig MacPortsport install zig LinuxZig is also present in many package managers for Linux. Here you can find an updated list but keep in mind that some packages might bundle outdated versions of Zig.Building from sourceHere you can find more information on how to build Zig from source for Linux, macOS and Windows.Recommended toolsSyntax Highlighters and LSPAll major text editors have syntax highlight support for Zig. Some bundle it, some others require installing a plugin.If you're interested in a deeper integration between Zig and your editor, checkout zigtools/zls.If you're interested in what else is available, checkout the Tools section.Run Hello WorldIf you completed the installation process correctly, you should now be able to invoke the Zig compiler from your shell.Let's test this by creating your first Zig program!Navigate to your projects directory and run:mkdir hello-world cd hello-world zig init This should output:info: created build.zig info: created build.zig.zon info: created src/main.zig info: created src/root.zig info: see `zig build --help` for a menu of options Running zig build run should then compile the executable and run it, ultimately resulting in:All your codebase are belong to us. Run `zig build test` to run the tests. Congratulations, you have a working Zig installation!Next stepsCheck out other resources present in the Learn section, make sure to find the Documentation for your version of Zig (note: nightly builds should use master docs) and consider giving zig.guide a read.Zig is a young project and unfortunately we don't have yet the capacity to produce extensive documentation and learning materials for everything, so you should consider joining one of the existing Zig communities to get help when you get stuck, as well as checking out initiatives like Zig SHOWTIME.Finally, if you enjoy Zig and want to help speed up the development, consider donating to the Zig Software Foundation .'''
year_published = 2025
clearnet = "https://ziglang.org/learn/getting-started"
