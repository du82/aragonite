title = "Home  ⚡  Zig Programming Language"
full_description = '''Zig is a general-purpose programming language and toolchain for maintaining robust, optimal and reusable software. GET STARTED Latest Release: 0.13.0 Documentation Changes ⚡ A Simple LanguageFocus on debugging your application rather than debugging your programming language knowledge.No hidden control flow.No hidden memory allocations.No preprocessor, no macros.⚡ ComptimeA fresh approach to metaprogramming based on compile-time code execution and lazy evaluation.Call any function at compile-time.Manipulate types as values without runtime overhead.Comptime emulates the target architecture.⚡ Maintain it with ZigIncrementally improve your C/C++/Zig codebase.Use Zig as a zero-dependency, drop-in C/C++ compiler that supports cross-compilation out-of-the-box.Leverage zig build to create a consistent development environment across all platforms.Add a Zig compilation unit to C/C++ projects, exposing the rich standard library to your C/C++ code. Full overview More code samples index.zigconst std = @import("std"); const parseInt = std.fmt.parseInt; test "parse integers" { const input = "123 67 89,99"; const ally = std.testing.allocator; var list = std.ArrayList(u32).init(ally); // Ensure the list is freed at scope exit. // Try commenting out this line! defer list.deinit(); var it = std.mem.tokenizeAny(u8, input, " ,"); while (it.next()) |num| { const n = try parseInt(u32, num, 10); try list.append(n); } const expected = [_]u32{ 123, 67, 89, 99 }; for (expected, list.items) |exp, actual| { try std.testing.expectEqual(exp, actual); } }Shell$ zig test index.zig 1/1 index.test.parse integers...OK All 1 tests passed. Community The Zig community is decentralizedAnyone is free to start and maintain their own space for the community to gather.There is no concept of "official" or "unofficial", however, each gathering place has its own moderators and rules. See all Communities Main developmentThe Zig repository can be found at https://github.com/ziglang/zig, where we also host the issue tracker and discuss proposals.Contributors are expected to follow Zig's Code of Conduct. Zig Software FoundationThe ZSF is a 501(c)(3) non-profit corporation.The Zig Software Foundation is a non-profit corporation founded in 2020 by Andrew Kelley, the creator of Zig, with the goal of supporting the development of the language. Currently, the ZSF is able to offer paid work at competitive rates to a small number of core contributors. We hope to be able to extend this offer to more core contributors in the future.The Zig Software Foundation is sustained by donations. Learn More Sponsors Corporate SponsorsThe following companies are providing direct financial support to the Zig Software foundation. @media (prefers-color-scheme:light) { #zml { filter: invert(); } } GitHub SponsorsThanks to people who sponsor Zig, the project is accountable to the open source community rather than corporate shareholders. In particular, these fine folks sponsor Zig for $200/month or more: José M Rico drfuchs Kirk Scheibelhut Bun Huly® Platform™ Stevie Hryciw Karrick McDermott Joran Dirk Greef bfredl Simon A. Nielsen Knights Emi Derek Collison Paul Harrington Clark Gaebel Marcus Eagan Ken Chilton Will Manning Spiral Alex Mackenzie at Tapestry VC Alok Parlikar Keygen This section is updated daily.'''
