full_description = "← Back to ホーム ドキュメントThis section lists resources useful to go from knowing nothing about Zig up to understanding its philosophy. ドキュメント Unstable (master) 言語リファレンス 標準ライブラリのドキュメント Latest Stable (0.13.0) 言語リファレンス 標準ライブラリのドキュメント GuidesThis section is eventually going to be bundled with Zig's standard library documentation, but in the meantime you can browse it from here.Zig Build System Introduction to the Zig build system.はじめにこれらはすべて、さまざまなバックグラウンドを持つプログラマーを対象としたZigの入門書です。詳細な概要 ここでは、システム・プログラミングの観点から、Zigの詳細な機能概要を説明します。C++、D、Rustがあるのに、なぜZigなのか C++、D、RustプログラマのためのZigの紹介です。コード例 Zigのコードがどのように見えるかを感じるためのスニペットのリストです。ツール Zigコードを書くのに便利なツールの一覧です。始めましょうZigでプログラミングを始める準備ができたら、このガイドで環境を整えましょう。始めましょうオンライン学習リソースIntroduction to Zig: a project-based book Zig のオープンな技術入門書。Zigを学ぶ SobestonによるZigの構造的な紹介。Ziglings 小さな壊れたプログラムを修正することでZigを学ぶ。Zig on Exercism Zigで演習を解いて、メンターの批評を受けて学ぶ。Learning Zig Short introduction to Zig well suited for developers coming from garbage-collected languages.関連する動画やブログ記事Zig 1.0への道のり [video] Andrew Kelleyによる、Zigとその哲学を紹介するビデオ。ZigのLLVMとの新しい関係 Zigセルフホストコンパイラの構築に向けた作業についてのブログ記事。lwn.netの記事でも紹介されています。"
