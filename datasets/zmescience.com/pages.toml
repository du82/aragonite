["https://www.zmescience.com/about"]
title = "About us"
description = "About ZME Science and other important information about our brand."
full_description = 'What is ZME Science? Welcome to ZME Science, a popular science website known for delivering engaging and informative science content to its readers since 2007. With over a million monthly engaged readers, ZME Science has become one of the go-to sources for trusted science news online. OUR MISSION ZME Science is all about science and how it affects our lives. Our mission is to make science accessible to everyone, regardless of their level of expertise. We are committed to reporting recent scientific research and findings in a lucid and comprehensible manner. We strongly believe that an informed understanding of science empowers individuals to make better choices and fosters a deeper appreciation of the world we inhabit. ZME Science covers a wide range of topics, from space exploration to environmental science, from medicine to technology, and from psychology to engineering across our archive of more than 25,000 articles produced by our dedicated staff of science journalists. We strive to provide our readers with the most up-to-date and accurate information, and we take great care to ensure that our content is well-researched and factual. Hey, don’t trust our word for it. Why you should trust ZME Science We’re proud to say that our commitment to accuracy and reliability has been recognized by independent media reviewers, who have ranked ZME Science as a “highly factual and highly credible” source of scientific information. We take this responsibility very seriously, and we work hard every day to maintain our reputation as a trusted source of science news. Over the years, the ZME Science brand has been mentioned by several large publishers, including the New York Times, National Geographic, Gizmodo, and the BBC. We have been quoted in policy reports; we’re often referred to by universities; we’ve changed how a basketball team trains. We’re proud to have earned this respect and we’re committed to continuing to provide our readers with the high-quality content they’ve come to expect from us. We’re constantly working to improve our website and our content, and we welcome feedback and suggestions from our readers. So whether you’re a science enthusiast, a curious layperson, or a professional in the scientific community, we invite you to join us at ZME Science and explore the wonders of the world around us. We care about making diverse voices heard. Whether it’s geographical diversity, gender diversity, racial diversity, or anything else, we strive for true representation, both in our newsroom and our coverage. Learn more about how we publish on ZME Science in our editorial policy. If you want to reach out for feedback, complaints, or anything else, don’t hesitate to contact us. If you’re an advertiser who would like to learn more about our audience, visit our advertising page. Grants and awards Our biggest pride comes from serving global communities with accessible, engaging scientific information. However, as a small independent team, we’re also happy when we receive recognition and support for our work. Whether it’s for our publication as a whole or our staff members, here are some of the grants and awards we are proud of and thankful for: European School of Oncology grant: A success story in Romania’s struggle to control cervical cancer. Also published on our website: One country’s struggling efforts to fight cervical cancer: Romania takes on HPV vaccination. EJN’s Story Grant for Coastal Resilience: From Gray to Green: How Building With Nature May Save Our Fragile Coastlines. Grants for covering the Abel Prize (see stories 1, 2). Grants for covering the 2016 U.N. Paris Conference of Parties meeting, where the Paris Agreement was signed. Grants for attending the Lindau Nobel Laureate Meeting. Grants for attending the Heidelberg Laureate Forum. Several travel grants for attending specialized conferences and workshops in the field of science journalism and communication. ZME Science vector logo <img src="https://cdn.zmescience.com/wp-content/uploads/2023/11/ZME-Science-LOGO-1024x211.png" height="211" width="1024" srcset="https://cdn.zmescience.com/wp-content/uploads/2023/11/ZME-Science-LOGO-1024x211.png 1024w, https://cdn.zmescience.com/wp-content/uploads/2023/11/ZME-Science-LOGO-750x154.png 750w, https://cdn.zmescience.com/wp-content/uploads/2023/11/ZME-Science-LOGO-1140x235.png 1140w, https://cdn.zmescience.com/wp-content/uploads/2023/11/ZME-Science-LOGO.png 1224w" sizes="(max-width: 1024px) 100vw, 1024px" class="wp-image-253772 sp-no-webp" alt="ZME Science logo" decoding="async" > We are excited to collaborate with our esteemed media partners. For your convenience, we’ve made our official vector logo available for download. This high-resolution format ensures optimal clarity and scalability for various media uses. When using our logo, we kindly ask you to adhere to our brand guidelines, which include maintaining the integrity of the logo’s colors and proportions and avoiding any modifications or overlays. By respecting these guidelines, you’ll help us maintain a consistent and professional brand identity across all platforms. Thank you for your cooperation and support in portraying our brand accurately and effectively. Note: these files are compressed as .rar archives, which you can decompress in .eps on your computer. ZME Science vector logo (.eps) / black on white Download ZME Science vector logo (.eps) / white on black Download How we’re funded and who owns ZME Science ZME Science is owned by ZME GRUP PUBLICITATE SRL, a limited liability company registered in Romania, controlled by ZME Science founders Andrei Mihai and Tiberius Puiu with a 50/50 stake. ZME Science is completely independent and self-owned. ZME Science funds its journalism by selling digital advertisements across our website and newsletters, promoting sponsored content that meets our quality standards, and earning commissions through affiliate marketing sales.'
