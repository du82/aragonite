d about the environment: 88% Are interested in cutting-edge products/gadgets: 73% Demographics as measured by Quantcast. Ad Options And Rates: We offer a variety of ad placements (leaderboard, skyscraper banner, rectangle banner, etc), as long as the ad is relevant to our audience on a fixed price or CPM basis. However, we don’t accept any kind of pop-ups, pop-unders, or other related “pops”. Sponsored articles are available, but our guidelines are pretty strict regarding this and involve all the conditions expressed in the Google ToS. Pricing and, if needed, ad placement can be negotiated on contact. If you’re interested in advertising with us, then please use the contact form or directly e-mail andrei@zmescience.com or tibi@zmescience.com.'
