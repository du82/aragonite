title = "ZooKeeper: Because Coordinating Distributed Systems is a Zoo"
full_description = '''ZooKeeper Use Cases Applications and organizations using ZooKeeper include (alphabetically) [1]. If your use case wants to be listed here. Please do not hesitate, submit a pull request or write an email to dev@zookeeper.apache.org, and then, your use case will be included. If this documentation has violated your intellectual property rights or you and your company's privacy, write an email to dev@zookeeper.apache.org, we will handle them in a timely manner. Free Software Projects AdroitLogic UltraESB Uses ZooKeeper to implement node coordination, in clustering support. This allows the management of the complete cluster, or any specific node - from any other node connected via JMX. A Cluster wide command framework developed on top of the ZooKeeper coordination allows commands that fail on some nodes to be retried etc. We also support the automated graceful round-robin-restart of a complete cluster of nodes using the same framework [1]. Akka Akka is the platform for the next generation event-driven, scalable and fault-tolerant architectures on the JVM. Or: Akka is a toolkit and runtime for building highly concurrent, distributed, and fault tolerant event-driven applications on the JVM [1]. Eclipse Communication Framework The Eclipse ECF project provides an implementation of its Abstract Discovery services using Zookeeper. ECF itself is used in many projects providing base functionallity for communication, all based on OSGi [1]. Eclipse Gyrex The Eclipse Gyrex project provides a platform for building your own Java OSGi based clouds. ZooKeeper is used as the core cloud component for node membership and management, coordination of jobs executing among workers, a lock service and a simple queue service and a lot more [1]. GoldenOrb massive-scale Graph analysis [1]. Juju Service deployment and orchestration framework, formerly called Ensemble [1]. Katta Katta serves distributed Lucene indexes in a grid environment. Zookeeper is used for node, master and index management in the grid [1]. KeptCollections KeptCollections is a library of drop-in replacements for the data structures in the Java Collections framework. KeptCollections uses Apache ZooKeeper as a backing store, thus making its data structures distributed and scalable [1]. Neo4j Neo4j is a Graph Database. It's a disk based, ACID compliant transactional storage engine for big graphs and fast graph traversals, using external indicies like Lucene/Solr for global searches. We use ZooKeeper in the Neo4j High Availability components for write-master election, read slave coordination and other cool stuff. ZooKeeper is a great and focused project - we like! [1]. Norbert Partitioned routing and cluster management [1]. spring-cloud-zookeeper Spring Cloud Zookeeper provides Apache Zookeeper integrations for Spring Boot apps through autoconfiguration and binding to the Spring Environment and other Spring programming model idioms. With a few simple annotations you can quickly enable and configure the common patterns inside your application and build large distributed systems with Zookeeper. The patterns provided include Service Discovery and Distributed Configuration [38]. spring-statemachine Spring Statemachine is a framework for application developers to use state machine concepts with Spring applications. Spring Statemachine can provide this feature:Distributed state machine based on a Zookeeper [31,32]. spring-xd Spring XD is a unified, distributed, and extensible system for data ingestion, real time analytics, batch processing, and data export. The project’s goal is to simplify the development of big data applications. ZooKeeper - Provides all runtime information for the XD cluster. Tracks running containers, in which containers modules and jobs are deployed, stream definitions, deployment manifests, and the like [30,31]. Talend ESB Talend ESB is a versatile and flexible, enterprise service bus. It uses ZooKeeper as endpoint repository of both REST and SOAP Web services. By using ZooKeeper Talend ESB is able to provide failover and load balancing capabilities in a very light-weight manner [1]. redis_failover Redis Failover is a ZooKeeper-based automatic master/slave failover solution for Ruby [1]. Apache Projects Apache Accumulo Accumulo is a distributed key/value store that provides expressive, cell-level access labels. Apache ZooKeeper plays a central role within the Accumulo architecture. Its quorum consistency model supports an overall Accumulo architecture with no single points of failure. Beyond that, Accumulo leverages ZooKeeper to store and communication configuration information for users and tables, as well as operational states of processes and tablets [2]. Apache Atlas Atlas is a scalable and extensible set of core foundational governance services – enabling enterprises to effectively and efficiently meet their compliance requirements within Hadoop and allows integration with the whole enterprise data ecosystem. Atlas uses Zookeeper for coordination to provide redundancy and high availability of HBase,Kafka [31,35]. Apache BookKeeper A scalable, fault-tolerant, and low-latency storage service optimized for real-time workloads. BookKeeper requires a metadata storage service to store information related to ledgers and available bookies. BookKeeper currently uses ZooKeeper for this and other tasks [3]. Apache CXF DOSGi Apache CXF is an open source services framework. CXF helps you build and develop services using frontend programming APIs, like JAX-WS and JAX-RS. These services can speak a variety of protocols such as SOAP, XML/HTTP, RESTful HTTP, or CORBA and work over a variety of transports such as HTTP, JMS or JBI. The Distributed OSGi implementation at Apache CXF uses ZooKeeper for its Discovery functionality [4]. Apache Drill Schema-free SQL Query Engine for Hadoop, NoSQL and Cloud Storage ZooKeeper maintains ephemeral cluster membership information. The Drillbits use ZooKeeper to find other Drillbits in the cluster, and the client uses ZooKeeper to find Drillbits to submit a query [28]. Apache Druid(Incubating) Apache Druid (incubating) is a high performance real-time analytics database. Apache Druid (incubating) uses Apache ZooKeeper (ZK) for management of current cluster state. The operations that happen over ZK are [27]: Coordinator leader election Segment "publishing" protocol from Historical and Realtime Segment load/drop protocol between Coordinator and Historical Overlord leader election Overlord and MiddleManager task management Apache Dubbo Apache Dubbo is a high-performance, java based open source RPC framework. Zookeeper is used for service registration discovery and configuration management in Dubbo [6]. Apache Flink Apache Flink is a framework and distributed processing engine for stateful computations over unbounded and bounded data streams. Flink has been designed to run in all common cluster environments, perform computations at in-memory speed and at any scale. To enable JobManager High Availability you have to set the high-availability mode to zookeeper, configure a ZooKeeper quorum and set up a masters file with all JobManagers hosts and their web UI ports. Flink leverages ZooKeeper for distributed coordination between all running JobManager instances. ZooKeeper is a separate service from Flink, which provides highly reliable distributed coordination via leader election and light-weight consistent state storage [23]. Apache Flume Flume is a distributed, reliable, and available service for efficiently collecting, aggregating, and moving large amounts of log data. It has a simple and flexible architecture based on streaming data flows. It is robust and fault tolerant with tunable reliability mechanisms and many failover and recovery mechanisms. It uses a simple extensible data model that allows for online analytic application. Flume supports Agent configurations via Zookeeper. This is an experimental feature [5]. Apache Fluo Apache Fluo is a distributed processing system that lets users make incremental updates to large data sets. Apache Fluo is built on Apache Accumulo which uses Apache Zookeeper for consensus [31,37]. Apache Griffin Big Data Quality Solution For Batch and Streaming. Griffin uses Zookeeper for coordination to provide redundancy and high availability of Kafka [31,36]. Apache Hadoop The Apache Hadoop software library is a framework that allows for the distributed processing of large data sets across clusters of computers using simple programming models. It is designed to scale up from single servers to thousands of machines, each offering local computation and storage. Rather than rely on hardware to deliver high-availability, the library itself is designed to detect and handle failures at the application layer, so delivering a highly-available service on top of a cluster of computers, each of which may be prone to failures. The implementation of automatic HDFS failover relies on ZooKeeper for the following things: Failure detection - each of the NameNode machines in the cluster maintains a persistent session in ZooKeeper. If the machine crashes, the ZooKeeper session will expire, notifying the other NameNode that a failover should be triggered. Active NameNode election - ZooKeeper provides a simple mechanism to exclusively elect a node as active. If the current active NameNode crashes, another node may take a special exclusive lock in ZooKeeper indicating that it should become the next active. The ZKFailoverController (ZKFC) is a new component which is a ZooKeeper client which also monitors and manages the state of the NameNode. Each of the machines which runs a NameNode also runs a ZKFC, and that ZKFC is responsible for: Health monitoring - the ZKFC pings its local NameNode on a periodic basis with a health-check command. So long as the NameNode responds in a timely fashion with a healthy status, the ZKFC considers the node healthy. If the node has crashed, frozen, or otherwise entered an unhealthy state, the health monitor will mark it as unhealthy. ZooKeeper session management - when the local NameNode is healthy, the ZKFC holds a session open in ZooKeeper. If the local NameNode is active, it also holds a special “lock” znode. This lock uses ZooKeeper’s support for “ephemeral” nodes; if the session expires, the lock node will be automatically deleted. ZooKeeper-based election - if the local NameNode is healthy, and the ZKFC sees that no other node currently holds the lock znode, it will itself try to acquire the lock. If it succeeds, then it has “won the election”, and is responsible for running a failover to make its local NameNode active. The failover process is similar to the manual failover described above: first, the previous active is fenced if necessary, and then the local NameNode transitions to active state [7]. Apache HBase HBase is the Hadoop database. It's an open-source, distributed, column-oriented store model. HBase uses ZooKeeper for master election, server lease management, bootstrapping, and coordination between servers. A distributed Apache HBase installation depends on a running ZooKeeper cluster. All participating nodes and clients need to be able to access the running ZooKeeper ensemble [8]. As you can see, ZooKeeper is a fundamental part of HBase. All operations that require coordination, such as Regions assignment, Master-Failover, replication, and snapshots, are built on ZooKeeper [20]. Apache Helix A cluster management framework for partitioned and replicated distributed resources. We need a distributed store to maintain the state of the cluster and a notification system to notify if there is any change in the cluster state. Helix uses Apache ZooKeeper to achieve this functionality [21]. Zookeeper provides: A way to represent PERSISTENT state which remains until its deleted A way to represent TRANSIENT/EPHEMERAL state which vanishes when the process that created the state dies A notification mechanism when there is a change in PERSISTENT and EPHEMERAL state Apache Hive The Apache Hive data warehouse software facilitates reading, writing, and managing large datasets residing in distributed storage using SQL. Structure can be projected onto data already in storage. A command line tool and JDBC driver are provided to connect users to Hive. Hive has been using ZooKeeper as distributed lock manager to support concurrency in HiveServer2 [25,26]. Apache Ignite Ignite is a memory-centric distributed database, caching, and processing platform for transactional, analytical, and streaming workloads delivering in-memory speeds at petabyte scale Apache Ignite discovery mechanism goes with a ZooKeeper implementations which allows scaling Ignite clusters to 100s and 1000s of nodes preserving linear scalability and performance [31,34].​ Apache James Mailbox The Apache James Mailbox is a library providing a flexible Mailbox storage accessible by mail protocols (IMAP4, POP3, SMTP,...) and other protocols. Uses Zookeeper and Curator Framework for generating distributed unique ID's [31]. Apache Kafka Kafka is a distributed publish/subscribe messaging system Apache Kafka relies on ZooKeeper for the following things: Controller election The controller is one of the most important broking entity in a Kafka ecosystem, and it also has the responsibility to maintain the leader-follower relationship across all the partitions. If a node by some reason is shutting down, it’s the controller’s responsibility to tell all the replicas to act as partition leaders in order to fulfill the duties of the partition leaders on the node that is about to fail. So, whenever a node shuts down, a new controller can be elected and it can also be made sure that at any given time, there is only one controller and all the follower nodes have agreed on that. Configuration Of Topics The configuration regarding all the topics including the list of existing topics, the number of partitions for each topic, the location of all the replicas, list of configuration overrides for all topics and which node is the preferred leader, etc. Access control lists Access control lists or ACLs for all the topics are also maintained within Zookeeper. Membership of the cluster Zookeeper also maintains a list of all the brokers that are functioning at any given moment and are a part of the cluster [9]. Apache Kylin Apache Kylin is an open source Distributed Analytics Engine designed to provide SQL interface and multi-dimensional analysis (OLAP) on Hadoop/Spark supporting extremely large datasets, original contributed from eBay Inc. Apache Kylin leverages Zookeeper for job coordination [31,33]. Apache Mesos Apache Mesos abstracts CPU, memory, storage, and other compute resources away from machines (physical or virtual), enabling fault-tolerant and elastic distributed systems to easily be built and run effectively. Mesos has a high-availability mode that uses multiple Mesos masters: one active master (called the leader or leading master) and several backups in cas'''
