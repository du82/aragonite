["https://zookeeper.apache.org/releases.html"]
title = "Apache ZooKeeper"
full_description = "The Apache ZooKeeper system for distributed coordination is a high-performance service for building distributed applications. The Apache ZooKeeper community supports two release branches at a time: stable and current. The stable version of ZooKeeper is 3.8.x and the current version is 3.9.x. Once a new minor version is released, the stable version is expected to be decommissioned soon and in approximately half a year will be announced as End-of-Life. During the half year grace period only security and critical fixes are expected to be released for the version. After EoL is announced no further patches are provided by the community. All ZooKeeper releases will remain accessible from the official Apache Archives. You can verify the integrity of a downloaded release using release-signing KEYS. For additional information, refer to the Apache documentation for verifying the integrity of Apache project releases. The Apache ZooKeeper community would like to make the official announcement of 3.7 release line End-of-Life. It will be effective on 2nd of February, 2024 00:01 AM (PDT). From that day forward the 3.7 version of Apache ZooKeeper won’t be supported by the community which means we won't Latest released version of Apache ZooKeeper 3.7 (currently 3.7.2) will be available on the download page for another year (until 2nd of February, 2025), after that it will be accessible among other historical versions from Apache Archives. We recommend users of Apache ZooKeeper 3.7 to plan your production upgrades according to the following supported upgrade path: Following the recommended upgrade path with rolling upgrade process ZooKeeper quorum will be available at all times as long as clients are not starting to use new features. This is the first release for the 3.9 branch. It is a major release and it introduces a lot of new features, most notably: ZooKeeper clients from 3.5.x onwards are fully compatible with 3.9.x servers. The upgrade from 3.7.x and 3.8.x can be executed as usual, no particular additional upgrade procedure is needed. ZooKeeper 3.9.x clients are compatible with 3.5.x, 3.6.x, 3.7.x and 3.8.x servers as long as you are not using new APIs not present these versions."
