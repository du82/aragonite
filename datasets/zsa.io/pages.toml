["https://zsa.io/voyager"]
title = "The Voyager: A powerful, low-profile, split ergonomic keyboard | zsa.io"
description = "A lean, mean, split typing machine. The Voyager is everything you’d want in a serious ergonomic keyboard, and nothing more. The essentials, refined."
full_description = '''A powerful, low-profile, split ergonomic keyboardAvailable Now See the Voyager in actionLaptop-friendly: Goes anywhere — on your desk or on the road.Mechanical: Four low-profile switch types offered.Hot-swappable: Change your switches any time.Compact: A 52-key layout minimizes reach and enhances comfort.Built to last: A two-year warranty and great repairability.Available now: Ships in two weeks.See itYour browser does not support the video tag.“It will transform your experience working with computers. In fact, I would say this is arguably the best keyboard in the world”- Ben Vallack Your browser does not support the video tag.Designed with a laptop in mindThe Voyager makes your laptop better.It offers a personalized and productive typing experiencewhile not taking up a ton of space.Ergonomics, anywhere.See itYour browser does not support the video tag.At home on your deskThe Voyager works just as well as part of a permanent desktop setup. Build your entire workstation around it and enjoy great ergonomics while leaving lots of room for a pointing device, a cup of coffee, and your favorite cat.PowerfulThe Voyager can do much more than your typical keyboard. Customize it for your personal typing style and pack it full of handy shortcuts for the apps you use most.Oryx is a free, simple, and powerful keyboard layout editor that you can use right now, in your browser. Point-and-click your way to the ultimate in comfort and productivity.Try OryxSee firmware features ↓It glowsThe Voyager has a bright and colorful LED under every key: These LEDs can dance across the surface of the keyboard using a variety of included animations.You can also use them to highlight specific keys, and it’s easy to make them dimmer or turn them off entirely.“ZSA absolutely nailed it with this keyboard. [...] I just think it's a phenomenal product.”- Ben Frain Smart LayersSwitch to Photoshop, and the "Photoshop" layer on your ZSA keyboard automatically activates. Click into Fortnite, and now your "Game" layer is suddenly active.See Smart LayersComes from a great familyWe've been making high-end keyboards since 2015. Here's our lineup.Ultra-thin, compact, powerful.Ultimate portability. Ergonomics, anywhere.Customize yours Comfortable and modular.Features an articulating thumb cluster. Over 40,000 units sold.Learn More A time-tested classic.Our first keyboard, going strong for years. An ergonomic classic with a big community.Learn More SpacesReal people, in a real workspace, that happen to use one of our keyboards.1/4Holger MatthiesVoyager UserI really didn't have to remap my brain. That was super helpfulShy RuparelMoonlander UserI’ve come to really like the layout, it doesn’t hurt as much, its really nice to use.Russell MatneyMoonlander UserI didn’t think about my typing improving, it just was very natural, so that was kinda a nice surprise.Josh AdamsErgoDox EZ UserIt felt really good to have my wrists at whichever angle I wantedOh, so thinHow do you make a keyboard that’s even thinner than the Moonlander while keeping the level of comfort people have come to expect from ZSA?By combining great build quality with low-profile Choc keyswitches made by Kailh.Our thinnest board yet, and just as comfy.Comes with great toolsFree, industry-leading software to make it easier to master and customize your keyboard.OryxIt’s your keyboard: Set it up just the way you want it. You can play with the full version of Oryx right now, even before buying a ZSA keyboard.Try it outKeymappSee your layout update on your screen as you type. Remember where your keys are without straining your neck. Entirely optional; your layout is always saved to the keyboard itself.Read MoreLive TrainingPractice your custom layout until it becomes second nature. Includes modes to focus on standard text, numbers and symbols, programming syntax, and unlabeled keys within layers.See howSee your layout in real timeOur native app, Keymapp, displays your entire layout right in front of you. It updates as you use your board, so you'll never get lost while navigating layers. Pin Keymapp to the corner of your screen and you'll always know what each key does at a glance, even while working in other windows.Keymapp's "heatmap" feature gives you personalized, always-local data about which keys you use most to help optimize your layout for your own particular workload.Most important, Keymapp is entirely optional. Take your keyboard from one computer to another and all your customizations come with you — not locked in an app sitting in your system tray.See what's possibleYour browser does not support the video tag.Hot swappableJust like all our other boards, it’s easy to pull a keyswitch out and pop a new one in. Customize the board over time or swap out a switch as needed.Learn MoreColumnarBecause when you extend a finger, it doesn‘t go sideways.Columnar keyboards make it easier to reach above and below the home row. Stretch less, type more.“Small and great build quality, making the Voyager a great travel companion. [...] Great software ecosystem: Oryx is still the gold standard for layout editors and the new Keymapp application is great for iterating on a Voyager layout.”- Daniël de Kok Thoughtful KeycapsWe’ve created three high-quality keycap sets specifically for the Voyager. There’s one for US-English, one that’s locale-neutral, and a third option with blank “circle glow” keycaps for a minimal, striking look.About our keycapsEmbraces better typingMost keyboards include tactile homing bumps for the QWERTY layout. We’ve included those, of course — but we’ve also added homing bumps for a couple of layouts that are better than QWERTY.Better than QWERTY?Even More KeycapsThe Voyager comes with a large assortment of extra keycaps. Put these right where you want them to create your own look and fit your personal layout. This helps with mastering the board, too.See the extrasSee itYour browser does not support the video tag.It's comfyWe carefully designed the Voyager’s geometry, balancing comfort with power. It has just enough keys.Download a life-size printable PDF to try it out on your desk.flattentedmountedAccessories that snap onThe bottom plate of the Voyager is made of steel. Not only does it ensure this extra-thin board feels solid, it also happens to be magnetic. Accessories click into place using a combination of magnets and orientation pins, making for a secure and satisfying grip.“One of the things that I was very pleasantly surprised about was the back is made out of steel and that gives it just an extra premium quality feel.”- If Coding Were Natural Smart legsEvery Voyager comes with a set of four high-quality tenting legs that magnetically snap onto the board. Click!We took care to design these legs in a way that allows you to easily harvest the included magnets in case you want to create your own tenting accessories.Included carrying caseWe put so much thought into the Voyager’s carrying case. It’s sized precisely for the unit and includes two inner zipper pockets for securely storing your accessories. We’ve reinforced its spine to protect the Voyager and included a custom-made laser-engraved steel bar to hold the magnetic legs in transport.“Beautiful presentation, spare keycaps and switches. A number of different USB to USB lead lengths. You also get a switch puller and USB A to C adapter. Just a very complete and impeccably presented package.”- Ben Frain A selection of cablesWe felt it was crucial for the Voyager to fit into your particular workspace and curated the cables accordingly.The Voyager comes with an interconnect cable and three different USB-C cables, allowing for extreme flexibility in positioning your board while maintaining the reliability, repairability, and responsiveness that wired connections are known for.See the cablesOptional magnetic tripod mountAdd a standard tripod thread to your Voyager, unlocking endless mounting options.Position and angle each half exactly the way you want it — no desk required. Like every Voyager accessory, the tripod mount magnetically clips on with a satisfying snap.See what's possibleCreate your own accessoriesThe Voyager’s steel backplate and built-in accessory orientation points invite you to design and print your own accessories. Add magnets, and the accessories will hug the Voyager like they were made for it. Here’s our first one.Printable Tenting BarLearn by playingNanotale is a beautiful game that will make you a better typist without you even noticing. Every Voyager sold comes with a free, full license for Nanotale.See the gameA fully-customizable typing experienceMake your keyboard work just like you want itYou don't have to code to customize the Voyager. Oryx is a free, simple, and powerful keyboard layout editor. Point-and-click your way to the ultimate in comfort and productivity.Remap any keyDon't like where something is? Move it. All keys can be remapped and reassigned, and most people iterate over their layouts until they're just right.Tap for A, hold for CtrlOne key can do two, three, or even four things. Tap-dance and dual-function keys make it easy to hold a key for Ctrl (for example) and tap it to get the letter “A”. All the power you need, within easy reach.One-touch shortcutsWant to set up a single key to send Cmd+S? Easy peasy.Works with Mac, Linux and WindowsAll the “smarts” live on the board. No software or drivers required.Unlock the power of system-wide hotkeysHyper is Ctrl+Shift+Alt+Win/Cmd, while Meh is Ctrl+Shift+Alt. No sane application on your machine uses these, which means you get free system-wide shortcuts.Use multiple layersWith up to 32 layers, you can make a layer dedicated to your favorite game or app and get single-key access to helpful combos and shortcuts.Open-source firmwareThe powerful firmware that runs on the Voyager is called QMK, and it’s open-source, available on GitHub. While you can use our configurator to quickly put together a layout, having complete access to the firmware source code means you can dig as deep as you’d like.A thriving communityWith thousands of people using our keyboards for all sorts of interesting things, there is never a lack of layouts to learn from. Some people even create layout tours to explain things better.There’s more: A galaxy of firmware features for you to explore and experiment with.Made by peopleyou can trustMakers ofWe’ve been making high-end keyboards for years.People seem to like them.Uncompromising2-year warrantyThe Voyager is a serious investment in your future well being, and our warranty policy reflects this. We proudly offer a two-year, no-BS, no fine-print warranty on our keyboards.We also fully support the Right to Repair, and offer parts for all of our keyboards.Buy Now...Shipping IncludedCustomize'''
