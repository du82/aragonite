["https://zsa.io/help"]
title = "Help | zsa.io"
description = "An ode to email."
full_description = '''Help & ResourcesDo you already have your ZSA board and are looking to learn more about it, or solve a particular issue? We’ve got you covered!Here you can search throughout our sites and knowledge base, as well as learn about our fantastic support.Thanks so much again for all of your help, support and downright patience to get me through this. It's been a pleasure chatting to you, and very reassuring that you seem to have my best interests at heart. I wish customer support for other companies was as good as this!Jamie DaviesRead More ↓An ode to Email Not Facebook, Reddit, or Twitter. Not even a "phone hotline". Just plain old email.Because email rocks. It lets us carefully read your message, and compose a reply that truly helps. It leaves us all with a permanent record of our interaction that we can then refer back to. It always works: The ultimate cross-platform medium.We don't send little "click-the-smiley" follow-up emails asking how we did. We just give it our absolute all, and have been doing so for years.For more of my thoughts around support and email, check out this Shopify Podcast episode where they interviewed me.For effective, fast, and pleasant help — just email [email protected].All the best,Erez Zukerman,CEO/Co-Founder,ZSA Technology LabsSearch the siteIf you can't find what you're looking for, just send us an email. We're happy to help.SearchHelpful resourcesIf you just got your board, the best place to start is our Getting Started Guide. It covers everything from unpacking the board, physically adjusting it, and plugging it in for the first time, to using the Oryx configurator, controlling the board’s lights, and connecting to Live Training.Once you’ve got the basics covered, there are more specific guides that live on our blog, called “On Tap” (as well as some good details in our FAQ, too). You can find everything from details of the newest Oryx features to in-depth tutorials.As always, if you have a question that’s not answered elsewhere or if you’d prefer getting help straight from our small, passionate support team, then please feel free to write us at [email protected].My husband and I would joke that I handled the pain of childbirth with hardly a peep and yet my hands and wrists are agonizing to me. I had to stop playing my piano, cooking, holding a book to read or even holding someone's hand. Because every touch literally was fire after a day of work. And the immediate results I've experienced... I'm almost afraid to write this email for embarrassment that you guys might think I'm over-exaggerating. But I'm not. So truly, from the bottom of my heart, thank you guys.Michelle EllisonI don't usually leave reviews or anything like this, but I just wanted to take some time to tell you how impressed I am with the quality and design intelligence behind the keyboard, the fast and personal customer service with my custom request, and how excellent the documentation and configurator for the board is.Tyler ScagelHaving the Moonlander has been a literally life changing experience for me. My life is now divided into before and after ZSA.Baer BradfordThank you so much for the help, means a lot to me. Best keyboards and best support ever guys!Konrad BarrekOmg. What a customer experience! Amazing. Thank you so much! I highly appreciate it. Needless to say your NPS score went up to 10 from 9 from me. I already recommended two friends who bought Moonlander already and you can be sure that I will be even louder in my recommendation after this experience. I bought moonlander for health reasons (had a lot of wrist pain). You not only solved my wrist pain but also make my everyday enjoyable. Thank you!! You rock! :)Candost DagdevirenWhere can I leave a review for your products and company? I'd like to let the world know about the great experience I have with you. It's a rare thing today.KyrillThank you very much for the help and patience. The support over at ZSA is second to none.Liam CahillThanks so much again for all of your help, support and downright patience to get me through this. It's been a pleasure chatting to you, and very reassuring that you seem to have my best interests at heart. I wish customer support for other companies was as good as this!Jamie DaviesI can't believe I have been hammering away on this keyboard for 4 years now..it has been by far my favorite keyboard and I couldn't do my job without it.I also appreciate the support you all have provided since I purchased it. I'm glad that I invested in this keyboard and ZSA.Courtney HicksI love this keyboard and y’all are seriously one of the best support teams I've ever had the pleasure of working with.Louise DeonThanks for that great support with the warranty and the replacement! It was a very pleasant experience overall and makes me an even more happy owner of a Moonlander!Bertold SedlekI just wanted to say that you are the best customer service of any other product manufacturer I have met.Aleksander SjåfjellYour dedication and effort in ensuring a smooth and satisfactory experience for me did not go unnoticed. I greatly appreciate your tireless assistance and exceptional customer service. I would be delighted to recommend ZSA to my friends in the future. Once again, thank you for everything.Brian LauWhat you sent was so helpful! My board is back and working fine. I wanted to thank you for all the info you sent, that was super awesome!!TheodoreI love that ZSA is fully supportive of customers who strive to repair devices before they replace them. You probably hear this a hundred times a day, but you're all great. Officially, canonically great. I will continue to recommend you to all my shining, glowing friends.Sophia FrenchSoftware engineer by day, gamer by night. Increased speed, accuracy, and nearly ditched the mouse with custom hotkeys. Split layout was a small hurdle, but ZSA doesn’t just make keyboards, they make sure there’s a smooth transition thanks to their Oryx & Live Training tools. The quality of both the physical product and supporting software has been great.William Teal'''
