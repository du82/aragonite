["https://zsa.io/moonlander"]
title = "ZSA Moonlander: Next-gen Ergonomics | zsa.io"
description = "An open-source keyboard for serious developers, creative professionals, and people who care deeply about their craft."
full_description = '''“I’ve spent a lot of time with many ergonomic keyboards, but ZSA’s Moonlander Mark I may be my favorite one I’ve ever used” Place each half exactly where you need it. Typing at shoulder width keeps your chest open, which leads to a more relaxed posture. Columnar keyboards like the ErgoDox EZ and the Moonlander make it easier to reach above and below the home row. Stretch less, type more. I didn’t think about my typing improving, it just was very natural, so that was kinda a nice surprise. When it‘s time to get your game on, unplug the right side and give your mouse some room to roam. The left side acts as a powerful macro pad. The Platform’s sophisticated latching system allows you to quickly disengage it and stow it away, flat, along with the Moonlander in the Moonlander’s carrying case. The Moonlander comes with high-quality keycaps made of doubleshot PBT plastic. You can get them either with letters ("printed"), or just lines for the light to shine through ("blank"). The printed keycaps are all the same profile so you can use them as-is or move them around for different non-QWERTY layouts. In a mechanical keyboard, each keypress is crisp and distinct. Different keyswitches offer a dramatically different typing feel. When building out your new Moonlander, choose between ten different types of switches. If you're not sure which is right for you, we'll help you choose. Change any keyswitch on your Moonlander at any time, without soldering and without voiding your warranty. Every unit ships with a free tool that makes this easy. Switch to Photoshop, and the "Photoshop" layer on your ZSA keyboard automatically activates. Click into Fortnite, and now your "Game" layer is suddenly active. While the Moonlander excels at the ergonomics of productivity, it also knows how to party. For those of you who enjoy watching LEDs dance, we made a little video showcasing some of the Mooonlander’s moves. The Moonlander comes with three status LEDs on each side and a buzzer for audio output. Get visual and audible feedback as you work, or not (you choose).'''
