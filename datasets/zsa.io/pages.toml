title = "Tripod Kit | zsa.io"
description = "An accessory for mounting your Moonlander on any standard tripod."
full_description = "Absolute flexibility in mounting your Moonlander. Precisely adjust the height and angle of each half any way you want - no desk required. Four M2.6 screws for each mount point, to attach it to the metal mounting threads at the bottom of the Moonlander. This connection is rock-solid. Two Stubs, to replace the Wings of your Moonlander (you won't need the Wing wrist rest with the unit mounted on a tripod). An extra-long 6-foot (210cm) TRRS cable, to connect both halves of the Moonlander. The length of the cable makes it easy to route around desks, chairs, and so on. The kit does not include a tripod. This is so you can provide your own flexible mounting solution. It can be a tripod, a desk stand, or anything with a tripod-like screw. The Tripod Kit adds yet another dimension of flexibility to the Moonlander experience. Suddenly, you're no longer bound to your desk. Your Moonlander can be suspended midair, at any angle you can imagine. Paired with a ball-head tripod, you get absolute control over the angle of each half. Extreme tenting angles, negative tilt — everything is possible. And with an all-metal construction, the Moonlander is rock solid when mounted on the kit. Since you won't be needing a desk to tilt your Moonlander with the Tripod Kit, this also means you can angle the thumb cluster upwards while tenting the unit. Plus, having the Moonlander suspended midair protects it against spills. You get a more compact Moonlander, and even greater freedom to design your workspace however you see fit. Despite the name, the kit isn't just for tripods: It's the ultimate way to mount your Moonlander onto the arms of a chair, with the extra-long cable wrapping all the way around. Tripod-sized bolts (1/4-20 UNC) are easy to source in hardware stores and online in various lengths, for just about any DIY project. Of course, no solution is perfect, and that goes for the Tripod Kit as well. Some drawbacks to consider: The metal mounts are very securely attached to the Moonlander, each with four individual M2.6 screws. This means it takes time to remove the tripod kit — it isn't something you can quickly snap on or off your Moonlander."
