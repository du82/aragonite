["https://zsa.io/moonlander/change-it-yourself"]
title = "Change It Yourself | zsa.io"
description = "How to hot-swap you keyswitches, no soldering required."
full_description = '''We love keyboards, so we get you. Picking the right switch for your board is hard. It‘s usually a choice you get to make just once. Then, those switches get soldered onto the board, and that‘s it (unless you‘re handy with a soldering iron, that is). This is not the case with the "Moonlander. The switches aren‘t soldered on: They sit in special sockets. The board comes with a tool in the box that lets you pull switches out anytime, so you can just pop new ones in. With the Moonlander, you can launch an exploration mission into the universe of mechanical keyswitches! As you may know, your Moonlander makes it possible for you to switch your switches (sorry for the pun). This isn't something you're likely to do on day one, but it's nice to know how simple it is. Scroll down to see the procedure, and feel free to refer back to this page when you decide to try out some new keyswitches.'''
