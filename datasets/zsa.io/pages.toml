["https://zsa.io/smart"]
title = "Smart Layers | zsa.io"
description = "Got a dedicated “Photoshop” layer? Maybe a “Gaming” layer? With Smart Layers, you can have these special layers turn on automatically as soon as you switch to the app or game they’re meant for. Effortless!"
full_description = '''Smart LayersGot a dedicated “Photoshop” layer? Maybe a “Gaming” layer? With Smart Layers, you can have these special layers turn on automatically as soon as you switch to the app or game they’re meant for. Effortless!Automatic layer switchingSwitch to Photoshop, and the "Photoshop" layer on your ZSA keyboard automatically activates. Click into Fortnite, and now your "Game" layer is suddenly active.You didn't have to hit any layer-switching keys on your board: It just happened on its own.All of your favorite macros and shortcuts, and even the lighting pattern you selected for that layer, are suddenly active.Switch away from that app or game, and you drop back to layer 0.Of course, you can also manually drop to layer 0 if you need to do some typing in Photoshop (or Fortnite, or whatever). And then, when you want to get back to the dedicated layer for that app or game, you can just tap a new key called "Smart Layer Trigger". Smart Layers then does the right thing and activates whatever layer is mapped to that app or game.There's another key called "Smart Layer Toggle" that disables the feature entirely for times when you don't want it.Simple and visualSmart Layers is a Keymapp feature. This means linking layers to apps takes just a few clicks:Your browser does not support the video tag.Then, it's easy to see your shortcuts and mappings when you're in a given app — just pin Keymapp to be "always on top" or tuck it in a corner of your screen, and switch to the app. Your layer activates automatically, and Keymapp shows you all your key assignments right on your screen.This makes it much easier to create and use dedicated, highly efficient layers for the applications and games you use most. You'll never have to remember to activate them — you'll just have to worry about learning them and optimizing them over time.LimitationsKeymapp and Smart Layers are powerful, but not magic.There are important caveats to understand:Windows and Mac only - no LinuxIn order for Smart Layers to work, Keymapp needs to know which window is currently active. Windows and macOS have built-in mechanisms that let apps find this out — but Linux does not, or at least not consistently. Some window managers do, others (including some big names) do not. As a result we will not be able to offer Smart Layers in the Linux version of Keymapp.Can't minimize to menubar or system trayKeymapp is a cross-platform app, but minimizing to the menubar (macOS) or the system tray (Windows) is OS-specific. As a result, this is not something Keymapp supports. You can minimize the window, but it'll just be a "regular" minimized window. For the same reason, you can't make the window semi-transparent (though you can pin it to be always on top).Not all apps and games report their names correctlyKeymapp can only see the name of an app that the app exposes. Sometimes this means an app shows up with a name you aren't expecting, such as "Unity 3D" for a game made with Unity (rather than the actual name of the game). Some apps may not even appear on the list.Overlays are trickySome apps do not open in a traditional sense when you use them — Think of Alfred or even Apple's own Spotlight Search on macOS. Keymapp is not able to recognize when these have focus, so any Smart Layer currently active will remain active.Layers may switch if another app grabs focusUsually, you switch to an app when you want to use it. But some apps can grab focus as the active app even while you're using another app — maybe they show a popup, for example. If this happens, any Smart Layers will deactivate or change accordingly. If you use an app where this would be destructive, such as a real-time competitive game or an app where actions can't be undone, we recommend manually switching to the layer for that app or game and not using a Smart Layer.'''
year_published = 2025
clearnet = "https://zsa.io/smart"
