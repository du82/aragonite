full_description = "Privacy PolicyThis Privacy Policy describes how your personal information and other data is collected, used, and shared when you visit, make a purchase from ZSA Technology Labs (”ZSA”), or use a service provided by ZSA.This privacy policy covers:ZSA.ioergodox-ez.comzsa.funtyp.ingAny other sub-domains under zsa.ioWe’ll refer to these sites going forward as “the Sites” or “our Sites”.SummaryWe only collect the personal information that is required to process your request.We don’t share this personal information with third parties unless it is required to process your request (or to comply with the law).You can ask us to amend or delete any collected personal information.We do not sell your personal information.Personal Information We CollectWhen you visit our Sites, we automatically collect certain information about your device and/or web browser. Additionally, as you browse the Sites, we collect information about the individual web pages or products that you view, what websites or search terms referred you to the Sites, and information about how you interact with the Sites. We refer to this automatically-collected information as “Device Information”.When you make a purchase or attempt to make a purchase through the Sites, we collect certain information from you, including your name, billing address, shipping address, payment information, email address, and phone number. We refer to this information as “Order Information”.When you use our Sites we may ask for consent from you to receive marketing information via email or other mechanisms. We collect certain information from you (for example, your email address) to fulfill this request. We refer to this information as “Marketing Information”.Device InformationHow We Collect Device Information↓Device Information is collected automatically from information provided by your device or web browser when you visit our Sites. This information will be in the form of request headers, browser cookies, and other request information.We primarily capture device information via log files from our infrastructure providers.What Device Information We Collect↓We collect and use the following device information:IP addressLocale information as provided by the browserOther information provided automatically by your device or browser as part of your network requestHow We Use the Device Information We Collect↓We use the device information as follows:Protect our sites against bad actors (IP address, Locale information)Serve content specific to a country or region (Locale information)Internal analytics to diagnose issues and to improve our servicesHow We Share Device Information↓We do not explicitly share your device information with third parties unless it is required to process your request.Our hosting providers (Cloudflare and Digital Ocean) may, in the process of fulfilling your request, collect additional device information. You can view the Cloudflare privacy policy here and the Digital Ocean privacy policy here.Our checkout provider (Shopify) may, in the process of fulfilling your request, collect additional device information. You can view the Shopify privacy policy here.Device Information Data Retention↓We may retain device information for up to 30 days after a user request — after which it is deleted automatically.Order InformationHow We Collect Order Information↓We collect order information during the checkout process when you buy something from us. We may collect this information even if you don’t submit or later cancel the order.What Order Information We Collect↓We collect the following personal information:NameCompanyShipping/Billing AddressPhone numberHow We Use Your Order Information↓We use your order information to fulfill your order.We may also use your order information to screen for fraud.How We Share Order Information↓We do not explicitly share your order information with third parties unless it is required to process your order. We do share it with our fulfilment partners who are in charge of shipping orders.We use Shopify to fulfill orders. Your order information will be shared with Shopify in order to complete your request. You can view the Shopify privacy policy here.Order Information Data Retention↓We will maintain your order information for our records unless and until you ask us to delete this information.Marketing InformationHow We Collect Marketing Information↓We collect marketing information during your interactions with the site. For example, during order checkout we ask if we can send you email with marketing information. What Marketing Information We Collect↓We currently collect:Your email address when you sign up for the newsletter.How We Use Your Marketing Information?↓We currently use your marketing information to:Periodically send you information on ZSA products, services, activities, and other relevant topics.How We Share Marketing Information↓We do not share your marketing information with third parties beyond what is required to fulfill the marketing purpose. We do not sell your marketing information to third parties.We use Mailchimp to manage our email marketing information. You can view the Mailchimp Privacy Policy here.We use Zapier to retain and process email marketing information. You can view the Zapier Privacy Policy here.Marketing Information Data Retention↓We will maintain your marketing information unless and until you ask us to delete this information.User DataAny data generated from using our applications in the manner intended (for example, editing your keyboard layout in Oryx) is considered to be User Data.We do not share or sell user data to third parties.We will delete any user data upon request.Your RightsYou have the right to access the personal information we hold about you and to ask that your personal information be corrected, updated, or deleted. If you would like to exercise this right, please contact us through the contact information below.Additionally, if you are a European resident we note that we are processing your information in order to fulfill contracts we might have with you (for example, if you place an order through one of the Sites), or otherwise to pursue our legitimate business interests.Additionally, please note that your personal information will be transferred outside of Europe, including to Canada and the United States.Legal ComplianceWe may also share your Personal Information to comply with applicable laws and regulations, to respond to a subpoena, search warrant or other lawful request for information we receive, or to otherwise protect our rights.Do Not TrackPlease note that we do not alter our Sites’ data collection and use practices when we see a ‘Do Not Track’ signal from your browser.Contact UsFor more information about our privacy practices, if you have questions, or if you would like to make a complaint, please contact us by e‑mail at [email protected]."
