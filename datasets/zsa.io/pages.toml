full_description = "Why spin when you can Click?Send a message with the Satellite.The Moonlander isn't our first space-themed product: That's actually the Satellite. It's a fidget toy that is ergonomic, customizable and addictively clicky. So why not take that fun with you everywhere you go?The Satellite. Classy enough to look good on your desk, and clicky enough to satisfy your bubble-wrap cravings. The Satellite comes with the mechanical switches you know and love, but this time they'll be helping your productivity in a whole new way.This is one handsome toy, and you won't be able to put it down. We certainly can't.Fun to use, pleasing to watch.When it's time to use your hands for typing again, simply place the Satellite back in its included docking station.Hate dust as much as we do? Fear not, our Satellite comes with a protective dome keeping any foreign particles from tainting it. Truly special spacial.Tactile fun that won't get lost in spaceFor those times when you have to take your work outside, we've included a lanyard strap that you can use to maneuver the Satellite at will. Looks great in your hand, and on your keychain.There is one important choice for you to make: Clicky, or stealthy as a space ninja.ClickySix high-impact Kailh Bronze (Thick Gold) Switches. Popcorn in keyboard form. These are clicky in a way we've never experienced before: Clicks once on the downstroke, and clicks again on the upstroke. A high-pitched, crisp click. Light, precise, and utterly unique - this keyswitch is addictive.StealthySix tactically-silenced Kailh Silver Switches. This is an extremely smooth keyswitch. Light enough not to tire your fingers. You can feel the linear resistance, but it's not too much - just springy enough so that you feel you're actually pressing something.The Satellite with black keycaps, stand, dome and strap.ClickyKailh Bronze (Thick Gold)StealthKailh Silver......Free Shipping"
