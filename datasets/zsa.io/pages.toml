["https://zsa.io/voyager/printables"]
title = "Printables | ZSA Voyager"
description = "I recently purchased the Voyager, and am really happy with it!However, I missed the tenting and palm rests of the Moonlander, so I designed and printed something that suits me pretty good! I couldn't find something similar online, but I didn't look too much as I was kinda eager to design my own.Printed this with 10% infill and .20mm layer height, which took 6 hours. No supports necessary."
full_description = "Voyager DockTenting LegVoyager StandAdditional Thumb KeyTenting BarVoyager DocksondresjI recently purchased the Voyager, and am really happy with it!However, I missed the tenting and palm rests of the Moonlander, so I designed and printed something that suits me pretty good! I couldn't find something similar online, but I didn't look too much as I was kinda eager to design my own.Printed this with 10% infill and .20mm layer height, which took 6 hours. No supports necessary.- sondresjMake itTenting LegcadomacNo supports needed!This model creates a large, sturdy leg to be used with the ZSA Voyager keyboard for a higher tent pitch. It is designed to fit snugly over the magnetic feet that come with the Voyager, which provides a sturdier and more stable base than the tent leg currently provided by ZSA themselves.One side of the foot holes is larger as well so that individuals with larger fingers should still be able to push the feet back out of the hole if they want to go back to using them or readjust the alignment. Versions to cover common tenting slopes. The top has alignment pins and recesses for 10 mm x 3 mm magnets.- cadomacMake itVoyager Standmark_feinsteinTenting for the ZSA Voyager keyboard.Versions to cover common tenting slopes. The top has alignment pins and recesses for 10 mm x 3 mm magnets.Printed with 10% infill and 4 top shell layers.- mark_feinsteinMake itAdditional Thumb Keyrfmarves2 keys to convert the default B and N keys into thumb keys when moving all keys 1 layer up on the ZSA Voyager keyboard.The default configuration for the Voyager keyboard only has 2 thumb keys on each side. I found that too limiting, so by eliminating the number row, all the alpha keys can be shifted one layer up, leaving the bottom-most layer available to be used as thumb keys (the CVBNM, keys on the default layout). However, the innermost keys of that layer and the small thumb-cluster keys interfere with each other.By using these custom keycaps, you can now press those keys with the thumb without interfering with the neighboring keys and allows for full set of 5 thumb keys on each side of the keyboard.- rfmarvesMake itTenting BarA ZSA PrintableThe first printable for the Voyager comes directly from us. It's a bar that allows you to tent the Voyager at a steeper angle than what's possible with the included legs.The bar has indentation pins to help it lock into the correct position on the Voyager, and three indents for magnets.You can use the magnets and screws from the Voyager's legs, or get rare-earth magnets elsewhere if you'd like to experiment (any strong magnet will do, though you may have to edit the file to adjust for the size of the magnet you go with).- ZSAMake itMake Your Own DesignOne thing that might help you design a Voyager accessory is the STL file for the shell of the unit. This contains exact measurements, so you can design around it and make sure your new accessory fits perfectly.Once you have a design you’re happy with, please feel free to put it up on Thingiverse for others to use. If you’d like to be featured on this page, email us at [email protected] and let’s talk!Here's the file"
year_published = 2025
clearnet = "https://zsa.io/voyager/printables"
