["https://zsa.io/voyager/our-keycaps"]
title = "About our keycaps | ZSA Voyager | zsa.io"
description = "We’ve created three different keycap sets for the Voyager, as well as a whole bunch of extra keys. See them all here."
full_description = '''Our KeycapsLow profile, precision-injected (doubleshot) PBT plastic. Designed to work perfectly with the Voyager.After a little over a month of having the Voyager, I have become proficient enough with using it to not only effortlessly type for hours on end, but I am now able to type faster than I ever have before! My average words per minute went from about 80-100 to 120-130 with spikes into the 160-170 range. I can confidently say this is one of the best purchases I've ever made not only with regards to my career but in general. It's such an awesome feeling using this keyboard because I could be typing at ~120wpm but it feels so effortless and smooth, more like I'm typing at ~60wpm. Now that I've gotten past that initial learning phase, typing feels insanely comfortable and intuitive now. Thank you, guys, on behalf of me and all those who also love the Voyager, for providing such an exceptional product!I can confidently say this is one of the best purchases I've ever made not only with regards to my career but in general. Read moreElyjah KiehneLove lettersThe Voyager's keycaps are precision-injected (doubleshot) out of PBT plastic. This means the letters and numbers are baked into the key using milky, translucent plastic. They will never wear out, and the Voyager's lights shine through them beautifully.The keycaps are beautifully textured. Not too rough, but not smooth and slippery either. Even the tactile nubs are custom-placed to our exact specifications. In our tests, we felt that most Choc keycaps placed their tactile nubs too low, so we moved them up to where you'll actually be able to feel them while typing.When it came time to make them, we just had to go with Tai-Hao. One of the world's leading keycap manufacturers, Tai-Hao has been partnering with ZSA for years, creating keycaps for the ErgoDox EZ Glow and the Moonlander.Low-profile Choc keycaps were a new challenge for Tai-Hao, and as we dove into the project, we knew we made the right choice. Not only does Tai-Hao possess a deep well of knowledge about keycap manufacturing, they also "get" ZSA and were incredibly patient with our obsessive attention to detail as we iterated over multiple keycap profiles and set designs.In the end, we ended up with something we are deeply proud of: Three keycap sets in two colors each (black and white). Here they are:The US SetThis set of keycaps is optimized for US English, containing a full complement of Shifted characters. If this set matches your locale (US English and many similar locales), having Shifted characters right on your keys can make it easier to learn the keyboard.The Locale-Neutral SetAs a company, ZSA is deeply aware that most people do not, in fact, live in the United States. ;) We are an international, distributed team, and this set reflects that. None of the keys bear Shifted characters. So if typing Shift+3 results in a £ or § symbol showing up on your screen, look no further.The Blank SetThis one's for the minimalists. Tai-Hao produced this set of blank "Circle" keycaps exclusively for ZSA. The circles are carefully sized and placed to make the most of the board's colorful LEDs.The Extras (with every unit)Since these keycaps are so special, we are including 36 additional keycaps with every Voyager sold. We agonized over the exact composition of this set of "extras," going over it many times, shooting for the most useful and versatile set we could imagine. And here they are:A spacebarEnterTabTwo Opt keysA BackspaceA Tilde/backtick keyTwo Alt keysTwo Shift keysTwo Ctrl keysTwo OS keysTwo Cmd keysAn Esc keyEight blank keys, enough to cover every non-alphanumeric key on your boardTwo more blank keys with tactile bumpsKeys with tactile bumps for QWERTY, Dvorak, and Colemak. Learn moreAnd finally:A key bearing the QMK logoA key bearing the Voyager's logo2 extra thumb keys safely tucked into the carrying case’s right pocket: These thumb keys can be fragile, so we’re giving you extrasOptimized for a columnar boardOur keycaps are “cylindrical”. Some people call them “halfpipe,” too. What that really means is that they’re a little curved inwards, so your finger is in a little “tunnel” with walls on the side. It’s subtle, but you can feel it every time you touch them. The shape helps guide your fingers up and down the columns of the Voyager.Exclusive to the VoyagerWe put so much work into the details of these keycaps, designing them to work perfectly with the Voyager. They were envisioned to augment this board from the ground up, so ZSA will not be offering them as a standalone accessory. These are not just keycaps — they are the Voyager keycaps. We hope they'll make your Voyager that much more special.While ZSA won't be selling these keycaps on their own, the work we did to help Tai-Hao refine this new keycap profile is not proprietary. We wanted to push forward Choc keycaps as a whole, not just for us.'''
year_published = 2025
