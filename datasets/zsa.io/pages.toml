["https://zsa.io/moonlander/keyswitches"]
title = "Choosing your keyswitches? | zsa.io"
description = "Part art, part science. So many options!"
full_description = "Keyswitches are one of the most important aspects of a mechanical keyboard. Getting to know your options will help you get the most out of your keyboard. Each key on a mechanical keyboard hides an actual physical switch under it. Typing on these mechanical switches is a very different experience from typing on regular ones. The keys have more travel and are much more tactile; you don’t have to press a key all the way down to get it to register, which makes typing easier on the fingers; and of course, mechanical keyboards have their own unique sound."
year_published = 2025
