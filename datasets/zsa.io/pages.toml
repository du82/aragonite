["https://zsa.io/moonlander/our-keycaps"]
title = "Our keycaps | zsa.io"
description = "What goes into the Moonlander’s keycaps?"
full_description = '''The ones with letters are all the same profile, OEM Row 3. This means you can shuffle them around on your board. QWERTY, Colemak, Workman — anything goes. F and J have homing bumps, but we give you F and J with no homing bumps in the box, too (you won't need homing bumps on F and J if you're using a layout other than QWERTY). The blank ones are sculpted: OEM Rows 0 to 4. So each row on the board is angled a bit differently. A translucent line is doubleshot through each keycap, for the light to shine through. They've got homing bumps, too. Colemak: A modern keyboard layout designed as an alternative to QWERTY and Dvorak, striving for efficient and ergonomic touch typing. doubleshot: Made using a double plastic injection process, where two molds (the translucent letter and the keycap itself) are combined into a single keycap. This is a more expensive way to make keycaps, which makes them extra durable. The letters and symbols are literally baked into the keycap, rather than printed on. OEM Row 3: Also known as "Standard Profile", OEM-profile keycaps come in several different shapes or "profiles", from Row 0 to Row 4. We chose Row 3 as the uniform profile for our printed keycaps after experimenting with all five profiles. homing bumps: Little bits of raised plastic usually present on the F and J keys of most keyboards. These allow touch-typists to place their fingers on the home row more easily. Workman: Another alternative keyboard layout built for low finger travel and reduced movement of the fingers and wrists, along with more balanced left and right hand usage.'''
year_published = 2025
