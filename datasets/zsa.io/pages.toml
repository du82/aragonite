["https://zsa.io/wireless"]
title = "Why are your keyboards not wireless? | zsa.io"
description = "An open-source keyboard for serious developers, creative professionals, and people who care deeply about their craft."
full_description = '''Why are your keyboards not wireless?It's 2025. Why is ZSA still making keyboards with cables?Anybody looking at the recent gadgets online knows it: The future is wireless. Some companies are even toying with the idea of making a "portless" phone — entirely smooth rectangles that charge and communicate entirely wirelessly.This, of course, is a simplification. It's how marketers want us to think. A desk certainly looks sleeker when it has no cables cluttering it up. Great for those product photos on the site!But we know this isn't magic. It's radios and batteries. Those marketers don't love talking about the batteries, because they conveniently degrade over time. Not too fast, of course — just fast enough to make you want a new gadget after a few years. (Some batteries also combust dramatically, but this is an edge case.)The other part is the radio: Wireless is great, when it works. And it only works some of the time. If you've used wireless keyboards in the past, take a moment and recall a time your connection was flaky, or device switching didn't work, or you had trouble pairing. These things happen quite often when working with wireless keyboards, but of course, the shiny marketing sites don't tell you about it.Don't get me wrong: I'm not anti-wireless or anti-batteries. When you have a device that's meant to be truly portable and operate on its own (such as a phone or a camera), of course it needs a battery. But what's nice about making keyboards is that they don't have to contain a battery that then decays over time. We are still supporting the original ErgoDox EZ we started with in 2015, and I get emails from customers who still use and love that board. Not because they can't afford a new one — but because it works today just as well as it did when they first got it.That's what I want to be making. I want to make tools that last, not stuff that's built to degrade over time. Gadgets you can open up with a screwdriver and tinker with. Gear that's powered by open-source firmware that's not even controlled by my company, so you know it'll be around even if we no longer are. Keyboards that make reliability a real priority.Cables are a part of that vision. Yes, they can get tangled up. But they are simple. They work. They're fast and responsive. They're easy to troubleshoot and figure out. And if a cable breaks, it's easy to swap it out with another one — and they're industry standard, so you don't have to get your new cable from us.The way I see it, cables fall under "appropriate technology" for keyboards. Just because lots of companies and marketers are pushing for wireless doesn't mean the benefits for users outweigh the costs over time.Love, Erez ZukermanCEO/Co-founderZSA Technology Labs'''
year_published = 2025
