["https://zsa.io/live-training"]
title = "ZSA Live Training: Your layout in real time. | zsa.io"
description = "Getting used to your new keyboard takes time and practice. Live Training is here to help. With Live Training, you get an interactive view of your layout, as you use it."
full_description = "live trainingyour layout in real timeGetting used to your new keyboard takes time and practice. Live Training is here to help. With Live Training, you get an interactive view of your layout, as you use it:Your browser does not support the video tag.Live Training shows everything from individual keystrokes, to multiple keys pressed at the same time, to layer changes: A complete, interactive view of your layout.You can start Live Training and switch to a different window. It’ll keep working, and you can use the interactive keymap as a reference. This is great when just starting out, and for developing muscle memory for layout changes you make over time.There are also several different modes tailored for programming, writing prose, or even mastering the numbers and symbols on your keyboard.Try Live Training(Requires a ZSA keyboard)Frequently Asked QuestionsHow does this work?Live Training uses webHID technology, which allows the browser to directly communicate with the keyboard once you initiate the connection.Is this a keylogger?No. Live Training does not send any information about the characters being printed. The protocol only sends the physical positions of the keys being pressed.Is it open-source?The code that runs on the keyboard is open-source, and available to review and use here. The server-side component is a part of Oryx, which is not open-source.Will Live Training work with layouts compiled locally, outside of Oryx?In order for Live Training to display your layout, the layout data must be stored in Oryx. If you compiled your layout locally, Live Training will not work, since Oryx doesn't have a copy of your layout to refer to.I have another question.Please email us anytime! [email protected] is where we’re at, and we’d love to hear from you."
