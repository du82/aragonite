["https://zsa.io/return-policy"]
title = "Return Policy | zsa.io"
description = "An open-source keyboard for serious developers, creative professionals, and people who care deeply about their craft."
full_description = "Return PolicyWe're a small, bootstrapped, privately-owned business. No big VC bucks here, and we're not Amazon. We make our keyboards in Taiwan, by highly skilled employees (not contractors) who we pay fairly. We make each of our keyboards to order — we don't pull them off the shelf in a fulfillment center. This means our returns policy has to take some economic realities into account: As much as we'd like to, we can't afford to pay for your return shipping. There is a 30-day return window from the time you receive the keyboard. If during this time you return the board, you would ship it (tracked) at your own expense to Taiwan, where it came from. Once we get the board, we would inspect it, and refund your purchase price in full, without charging a restock fee. Note that orders outside the US will also be charged import fees as the keyboard arrives, and we are not able to refund these fees because we do not collect them. You will need to talk with your customs department about refunding these fees. Shipping a keyboard via USPS from the US to Taiwan costs around $90. This is a significant chunk of the purchase price, and you may recoup a higher part of your investment by selling off the keyboard used, locally. We understand this is not an ideal returns situation, and we wish we could offer Amazon-level returns where you just get a free label and forget about the product. When you work with us, you'll see the benefits of working with a small, personal, and very caring business."
