["https://zvm.app/blog"]
title = "Blog | zvm | Zig Version Manager"
full_description = "Changelog v0.7.1 May 27, 2024 Hello, and welcome to the blog! This is the first Changelog posted to the website. Typically they’ll be short, mostly containing text from GitHub Releases, but with some of my additional thoughts and reasoning thrown in. Today ZVM enters it’s 0.7 series. This minor version cycle, I’ll be focusing on improving the foundations of ZVM in order to bring a hopefully exciting (and secret) feature in v0.8. What changed? Sync The sync command has been retired as of ZVM v0.7.0. With v0.7.1, its functionality has been moved to the use command. Just run zvm use --sync to sync your local version of Zig with your project. VMU The --vmu flag has been upgraded to a command. It still works the same way, but now it’s just easier to access. Upgrade ZVM will now automatically check for upgrades after you’ve ran a command. This just consists of a ping to ZVM’s GitHub repo using GitHub’s public API. Many tools including NPM and Deno do this automatically. If you would like to disable this functionality, you can set the new ZVM_SET_CU environment variable to anything. If you’d like to reenable it, just unset ZVM_SET_CU. As always, if you have any questions, feedback, or want to help ZVM out, you can create an issue on our GitHub, or support free and open source software for less than the price of a cup of coffee on Polar.sh"
year_published = 2024
clearnet = "https://zvm.app/blog"
tags = ["blog", "changed?", "changelog", "manager", "sync", "upgrade", "v0.7.1", "version"]
language = "en"
