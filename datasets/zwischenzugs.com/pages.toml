description = "Introduction This article continues on from part one of this series, which looks at 'CI as code' using Docker to set up isolated and reproducible phoenix deployments of Jenkins deployments Here I add dynamic Docker containers as on-demand Jenkins nodes in a Docker cloud. Code This is now baked into v2.0 of the git repo. Video Here's a video…"
full_description = "CI as Code Part II: Stateless Jenkins With Dynamic Docker Slaves zwischenzugs Uncategorized January 30, 2016August 9, 2017 2 Minutes Introduction This article continues on from part one of this series, which looks at ‘CI as code’ using Docker to set up isolated and reproducible phoenix deployments of Jenkins deployments Here I add dynamic Docker containers as on-demand Jenkins nodes in a Docker cloud. Code This is now baked into v2.0 of the git repo. Video Here’s a video of the stateless setup of the Docker cloud, and the job ‘docker-test’ which dynamically provisions a Docker container to run as a Jenkins slave. What it does Starts up Jenkins container with a server config config.xml preloaded ‘jenkinssetup’ container waits for Jenkins to be up and ready Sets up global credentials Updates Jenkins’ config.xml with the credentials id Restart Jenkins and wait for jenkins to be ready Kick off install of plugins Periodically restart Jenkins until plugins confirmed installed Upload job configurations Details The Docker plugins for Jenkins are generally poorly documented and fiddly to set up. And between them there’s quite a few, so the Docker options in a job available can get quite confusing. This took a little bit of trial and error before I could reliably get it to work. To allow dynamic Docker provisioning, I used the standard docker plugin, mainly because it was the only one I ended up getting working with my Jenkins-in-docker-compose approach. To get a dynamic on-demand Docker instance provisioned for every build, you have to set up a Docker cloud with the details of the Docker host to contact to spin up the container. This cloud is given a label, which you use in your job to specify that it should be run in a Docker container. Currently co-authoring a book on Docker: Get 39% off with the code 39miell2 Note: If you want to recreate this you must have an opened-up Docker daemon. See here for a great guide on this. Once that’s done you may need to change the docker host address in the docker.xml field to point to your opened up Docker daemon. Usually this is with the IP address outputted from ‘ip route’ in your running containers. The default in the git repo is fine, assuming you have opened it up on port 4243. Share this:EmailRedditTweetShare on TumblrPocketLike Loading... Related Published by zwischenzugs View all posts by zwischenzugs Published January 30, 2016August 9, 2017"
