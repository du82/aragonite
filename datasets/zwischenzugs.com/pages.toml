full_description = "Understanding Docker – Network Namespaces zwischenzugs Uncategorized November 21, 2015January 17, 2016 1 Minute Currently co-authoring a book on Docker: Get 39% off with the code 39miell tl;dr A video showing how to set up two namespaces to talk to each other based on this excellent tutorial. Source available here. What it does To many developers, networking is a bit of a mystery; it’s the thing to blame when things go wrong. I’ve been forced to learn about networking more as a result of getting into Docker, and as a result have taught myself some basics. In this video, (based on this awesome set of tutorials) I take the viewer through the process of setting up network namespaces (a key aspect of Docker’s isolation technology), and use OpenVSwitch (a virtualised switching tool) to act as a bridge between the two networks in the so-called ‘root namespace’. All of this takes place within a VM. Enjoy! Share this:EmailRedditTweetShare on TumblrPocketLike Loading... Related Published by zwischenzugs View all posts by zwischenzugs Published November 21, 2015January 17, 2016"
