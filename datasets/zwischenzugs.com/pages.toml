title = "Convert Any Server to a Docker Container (Updated) – zwischenzugs"
description = "How and Why? Let's say you have a server that has been lovingly hand-crafted that you want to containerize. Figuring out exactly what software is required on there and what config files need adjustment would be quite a task, but fortunately blueprint exists as a solution to that. What I've done here is automate that…"
full_description = "Convert Any Server to a Docker Container (Updated) zwischenzugs Uncategorized April 4, 2016May 28, 2022 1 Minute How and Why? Let’s say you have a server that has been lovingly hand-crafted that you want to containerize. Figuring out exactly what software is required on there and what config files need adjustment would be quite a task, but fortunately blueprint exists as a solution to that. What I’ve done here is automate that process down to a few simple steps. Here’s how it works: You kick off a ShutIt script (as root) that automates the bash interactions required to get a blueprint copy of your server, then this in turn kicks off another ShutIt script which creates a Docker container that provisions the container with the right stuff, then commits it. Got it? Don’t worry, it’s automated and only a few lines of bash. There are therefore 3 main steps to getting into your container: – Install ShutIt on the server – Run the ‘copyserver’ ShutIt script – Run your copyserver Docker image as a container Step 1 Install ShutIt as root: sudo su - pip install shutit The pre-requisites are python-pip, git and docker. The exact names of these in your package manager may vary slightly (eg docker-io or docker.io) depending on your distro. You may need to make sure the docker server is running too, eg with ‘systemctl start docker’ or ‘service docker start’. Step 2 Check out the copyserver script: git clone https://github.com/ianmiell/shutit_copyserver.git If you like this, you might like one of my books:Learn Bash the Hard WayLearn Git the Hard WayLearn Terraform the Hard Way Buy in a bundle here Step 3 Run the copy_server script: cd shutit_copyserver/bin ./copy_server.sh There is a prompt to ask what docker base image you want to use. Make sure you use one as close to the original server as possible. Step 4 Run the built image: docker run -ti [username]/copyserver /bin/bash You are now in a practical facsimile of your server within a docker container! Share this:EmailRedditTweetShare on TumblrPocketLike Loading... Related Published by zwischenzugs View all posts by zwischenzugs Published April 4, 2016May 28, 2022"
