<!DOCTYPE html>
<html>
<head>
    <style>
        .header {
        padding: 10px;
        background: #fff;
        color: #3b3b3b;
        position: fixed;
        width: 100%;
        border-width: 5px;
        border-bottom: solid #e7e7e7;
        border-bottom-width: 1px;
        }

        .content {
        padding: 16px;
        }

        body {
            background-color: #fff;
            color: #3b3b3b;
            font-family: Arial, sans-serif;
            height: wrap-content;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 4px;
            position: fixed;
        }

        line {
            width: 2px;
            height: 10%;
            background-color: #fff;
        }

        .search-row {
            display: flex;
            align-items: center;
            margin-left: 100px;
        }

        .search-buttons-row {
            display: flex;
            margin-left: 100px;
        }

        form {
            display: flex;
            flex-direction: column;
            margin: auto;
        }

        label, input {
            margin-bottom: 20px;
            border-radius: 0px;
        }

        input {
            cursor: pointer;
            background-color: #fff;
            color: black;
            border-color: lightgray;
            border-width: 2px;
            border-style: solid;
            border-radius: 8px;
            padding: 10px;
            font-size: 16px;
            width: fit-content;
        }

        input[type="submit"]:hover {
            background-color: #2b2b2b;
        }

        .search-container {
            display: flex;
            justify-content: space-between;
        }

        .search-result {
            height: fit-content;
            width: 550px;
            padding: 10px;
        }

        .more-info {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .results-container {
            flex-direction: column;
            padding-top: 120px;
            margin-left: 100px;
            max-width: fit-content;
        }

        .footer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .footer-box {
            height: fit-content;
            width: 70%;
            border-color: white;
            border-width: 2px;
            border-style: solid;
            padding: 10px;
            margin-bottom: 20px;
        }

        .search-box {
            width: 500px;
            border-radius: 8px;
        }
        
        span {
            font-size: 12px;
            font-weight: normal;
            float: center;
            text-align: right;
        }

        h3 {
            margin-top: 0px;
            margin-bottom: -10px;
            padding: 0;
        }

        a {
            color: #7d4698;
            text-decoration: none;
        }

        a:hover {
            color: #a325e3;
            text-decoration: none;
        }
    </style>
</head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- You won't find any JavaScript here, just a staticly generated SERP! -->
<body>
    <div class="header">
        <div class="search-row">
            <form action="/search" method="post" style="margin: 0; padding: 0;">
                <div style="display: flex;">
                    <input class="search-box" type="text" name="query" placeholder="Search" style="margin-right: 15px;">
                    <input type="submit" value="Search">
                </div>
            </form>
            <form action="/logout" method="post" style="position: fixed; right: 10px; margin: 0; padding: 0;">
                <input type="submit" value="Logout from {{display_name}}">
            </form>
        </div>
        <div class="search-buttons-row">

                Images

            <a href="/videos" style="display: flex; align-items: center; margin: 0; padding: 0; margin-right: 15px;">
                <svg fill="black" height="30px" viewBox="0 0 28 28">
                    <path d="M9.75,10.00152a1,1,0,0,1,1.51446-.85747l3.33079,1.99848a1,1,0,0,1,0,1.71494L11.26447,14.856A1,1,0,0,1,9.75,13.99848Z" fill="none" stroke="#323232" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><rect x="3" y="3" width="18" height="18" rx="5" stroke-width="1.5" stroke="#323232" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

            <a href="/news" style="display: flex; align-items: center; margin: 0; padding: 0; margin-right: 15px;">
                <svg fill="black" height="30px" viewBox="0 0 28 28">
                    <line x1="12" y1="10" x2="15" y2="10" fill="none" stroke="#323232" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><line x1="12" y1="7" x2="15" y2="7" fill="none" stroke="#323232" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><rect x="6" y="7" width="3" height="3" rx="0.5" stroke-width="1.5" stroke="#323232" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="6" y1="13.5" x2="15" y2="13.5" fill="none" stroke="#323232" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><line x1="15" y1="17" x2="6" y2="17" fill="none" stroke="#323232" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M18,8h1a2,2,0,0,1,2,2v9a2,2,0,0,1-2,2H5a2,2,0,0,1-2-2V5A2,2,0,0,1,5,3H16a2,2,0,0,1,2,2V21" fill="none" stroke="#323232" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><rect width="24" height="24" fill="none"/>

            <a href="/news" style="display: flex; align-items: center; margin: 0; padding: 0; margin-right: 15px;">
                <svg fill="black" height="30px" viewBox="0 0 28 28">
                    <path d="M19.704,15.014c-1.195,2.916 -4.058,4.971 -7.405,4.971c-4.42,0 -8.003,-3.583 -8.003,-8.003c0,-4.186 3.215,-7.616 7.31,-7.968c-2.039,2.806 -1.801,6.751 0.729,9.281c1.994,1.994 4.867,2.562 7.369,1.719Z" stroke-linecap="round" stroke-width="1.5" stroke="#323232" fill="none" stroke-linejoin="round"></path>
                </svg>
                Dark Web
            </a>
            <p>{{statistics}}</p>
        </div>
    </div>
</body>
</html>
