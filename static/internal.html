<!DOCTYPE html>
<html>
<head>
    <style>

        html {
            scrollbar-width: thin;
            scrollbar-color: black black;
        }

        html::-webkit-scrollbar {
            width: 12px;
        }

        html::-webkit-scrollbar-track {
            background: black;
        }

        html::-webkit-scrollbar-thumb {
            background-color: black;
            border: 2px solid white;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            height: fit-content;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 4px;
        }

        line {
            width: 2px;
            height: 100%;
            background-color: #fff;
        }

        .search-container {
            display: flex;
            align-items: center;
        }

        form {
            display: flex;
            flex-direction: column;
            margin: auto;
        }

        label, input {
            margin-bottom: 20px;
            border-radius: 0px;
        }

        input {
            cursor: pointer;
            background-color: #000;
            color: #fff;
            border-color: white;
            border-width: 2px;
            border-style: solid;
            padding: 10px;
            font-size: 16px;
            width: fit-content;
        }

        input[type="submit"]:hover {
            background-color: #2b2b2b;
        }

        .search-container {
            width: 72%;
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .search-result {
            height: fit-content;
            width: 70%;
            border-color: white;
            border-width: 2px;
            border-style: solid;
            border-bottom-width: 0px;
            padding: 10px;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .footer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .footer-box {
            height: fit-content;
            width: 70%;
            border-color: white;
            border-width: 2px;
            border-style: solid;
            padding: 10px;
            margin-bottom: 20px;
        }

        .search-box {
            width: 300%;
        }
        
        span {
            margin-top: 5px;
            font-size: 12px;
            font-weight: normal;
            float: center;
            text-align: center;
        }

        h3 {
            margin-top: 0px;
            margin-bottom: 1px;
            padding: 0;
        }

        a {
            color: #7d4698;
            text-decoration: none;
        }

        a:hover {
            color: #a325e3;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="search-container">
            <form action="/search" method="post" style="margin: 0; padding: 0;">
                <div style="display: flex;">
                    <input class="search-box" type="text" name="query" placeholder="Search" style="margin-right: 15px;">
                    <input type="submit" value="Search">
                </div>
            </form>
            <p>{{statistics}}</p>
            <form action="/logout" method="post" style="margin: 0; padding: 0;">
                <input type="submit" value="Logout from {{display_name}}">
            </form>
        </div>
    </div>
</body>
</html>
