<!doctype html>
<!-- You won't find any JavaScript here, just a dynamically generated page! -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Settings</title>
        <meta property="og:description" content="A soverign search engine" />
        <meta property="og:image" content="static/themes/media/logo.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="{{theme}}" />
    </head>
    <body>
        <div class="header">
            <img src="/themes/media/logo.png" class="logo" />
            <div class="search-row">
                <form
                    action="/search"
                    method="post"
                    style="margin: 0; padding: 0"
                >
                    <div style="display: flex">
                        <input
                            class="search-box"
                            name="query"
                            placeholder="{{search_string}}"
                        />
                        <input type="submit" value="Search" />
                    </div>
                </form>
                <a
                    href="/donate"
                    class="donate-button"
                    style="position: fixed; top: 10px; right: 10px; margin: 0"
                >
                    Donate
                </a>
            </div>
            <div class="search-tabs-row">
                <a href="/" class="search-tab">
                    <svg fill="black" height="30px" viewBox="0 0 28 28">
                        <rect y="0.00001" width="24" height="24" fill="none" />
                        <path
                            d="M13.5,14,9.79289,10.2929A1,1,0,0,0,9.08579,10H8.00134a1,1,0,0,0-.88833,1.4592L8.42642,14"
                            fill="none"
                            stroke="#323232"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="1.5"
                        />
                        <path
                            d="M22,11H18.25A1.25,1.25,0,0,1,17,9.75v-1A1.25,1.25,0,0,0,15.75,7.5h-1A1.25,1.25,0,0,1,13.5,6.25v-4.235"
                            fill="none"
                            stroke="#323232"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="1.5"
                        />
                        <path
                            d="M5.76038,7A8.49614,8.49614,0,0,1,22,10.5V11"
                            fill="none"
                            stroke="#323232"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="1.5"
                        />
                        <path
                            d="M12.5,18,8.79289,21.70712A1,1,0,0,1,8.08579,22H7.00134a1,1,0,0,1-.88833-1.4592L7.42642,18H5.05486a2,2,0,0,1-1.89737-1.36754L2.05208,13.31624A1,1,0,0,1,3.00077,12h.99454a1,1,0,0,1,.89442.55279L5.61334,14H16a2,2,0,0,1,2,2h0a2,2,0,0,1-2,2Z"
                            fill="none"
                            stroke="#323232"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="1.5"
                        />
                    </svg>
                    Home
                </a>
            </div>
        </div>
        
        <div class="content">
            <div class="landing">
                <h2>Settings</h2>
                
                <!-- Theme Settings -->
                <div class="border-box" style="margin-top: 20px; margin-bottom: 20px;">
                    <h3>Theme Settings</h3>
                    <form action="/themes">
                        <label for="selection">Choose a theme:</label>
                        <select
                            name="selection"
                            class="drop-down"
                            id="theme-set"
                            style="margin-bottom: 10px"
                        >
                            <option value="" disabled selected>
                                Official Themes
                            </option>
                            <option value="gemstone.css">Dark Mode</option>
                            <option value="gemstone_light.css">
                                Light Mode
                            </option>
                        </select>
                        <input type="submit" value="Set Theme" />
                    </form>
                </div>
                
                <!-- Safe Search Settings -->
                <div class="border-box" style="margin-top: 20px; margin-bottom: 20px;">
                    <h3>Safe Search Settings</h3>
                    
                    <div style="margin-bottom: 15px;">
                        <form action="/safe_search">
                            <p>Enable Safe Search:</p>
                            <div style="display: flex; align-items: center; margin-bottom: 10px;">
                                <input type="radio" id="safe_search_on" name="enabled" value="true" {{safe_search_checked}}>
                                <label for="safe_search_on" style="margin-left: 5px;">On</label>
                                
                                <input type="radio" id="safe_search_off" name="enabled" value="false" {{safe_search_off_checked}} style="margin-left: 20px;">
                                <label for="safe_search_off" style="margin-left: 5px;">Off</label>
                            </div>
                            <input type="submit" value="Save Setting" />
                        </form>
                    </div>
                    
                    <div>
                        <form action="/safe_search_level">
                            <label for="level">Safe Search Level:</label>
                            <select
                                name="level"
                                class="drop-down"
                                id="safe-search-level"
                                style="margin-bottom: 10px"
                            >
                                <option value="off" {{level_off_selected}}>Off</option>
                                <option value="moderate" {{level_moderate_selected}}>Moderate</option>
                                <option value="strict" {{level_strict_selected}}>Strict</option>
                            </select>
                            <p style="font-size: 12px; margin-top: 0;">
                                <strong>Off</strong>: No content filtering<br>
                                <strong>Moderate</strong>: Filters adult content<br>
                                <strong>Strict</strong>: Filters adult content, violence, drugs, and gambling
                            </p>
                            <input type="submit" value="Set Level" />
                        </form>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="main-footer">
            <div class="footer-container">
                <a href="donate"> Donate </a>| <a href="mirrors"> Mirrors </a>|
                <a href="privacy"> Privacy </a>|
                <a href="/settings"> Settings </a>
                <p class="centered-text">Mirror updated: {{mirror_updated}}</p>
            </div>
        </div>
    </body>
</html>
